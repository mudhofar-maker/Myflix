<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyFlix - Streaming</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Arial, sans-serif;
}

body {
  background: #141414;
  color: #fff;
  min-height: 100vh;
}

.header {
  background: linear-gradient(180deg, #000 0%, transparent 100%);
  padding: 15px 20px;
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  color: #e50914;
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 2px;
}

.nav {
  display: flex;
  gap: 15px;
  font-size: 14px;
}

.nav a {
  color: #fff;
  text-decoration: none;
  opacity: 0.8;
}

.nav a.active {
  opacity: 1;
  font-weight: bold;
}

.hero {
  position: relative;
  height: 400px;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  display: flex;
  align-items: flex-end;
  padding: 30px 20px;
  overflow: hidden;
}

.hero::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: url('https://peach.blender.org/wp-content/uploads/bbb-splash.png') center/cover;
  opacity: 0.3;
}

.hero-content {
  position: relative;
  z-index: 2;
  max-width: 600px;
}

.hero-title {
  font-size: 32px;
  margin-bottom: 10px;
  text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
}

.hero-desc {
  font-size: 14px;
  line-height: 1.5;
  margin-bottom: 20px;
  opacity: 0.9;
  text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
}

.hero-buttons {
  display: flex;
  gap: 10px;
}

.btn {
  padding: 10px 20px;
  border: none;
  border-radius: 5px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.3s;
}

.btn-play {
  background: #fff;
  color: #000;
}

.btn-play:hover {
  background: #ddd;
}

.btn-info {
  background: rgba(109,109,110,0.7);
  color: #fff;
}

.btn-info:hover {
  background: rgba(109,109,110,0.9);
}

.modal {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.95);
  z-index: 1000;
  padding: 20px;
  overflow-y: auto;
}

.modal.active {
  display: block;
}

.modal-close {
  position: absolute;
  top: 15px;
  right: 20px;
  background: rgba(0,0,0,0.7);
  border: none;
  color: #fff;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
  z-index: 1001;
}

.video-container {
  max-width: 900px;
  margin: 40px auto;
  background: #000;
  border-radius: 10px;
  overflow: hidden;
}

video {
  width: 100%;
  max-height: 70vh;
  display: block;
}

.modal-info {
  max-width: 900px;
  margin: 20px auto;
  padding: 20px;
}

.modal-title {
  font-size: 28px;
  margin-bottom: 15px;
}

.modal-meta {
  display: flex;
  gap: 15px;
  margin-bottom: 15px;
  font-size: 14px;
  color: #46d369;
  font-weight: bold;
}

.modal-desc {
  font-size: 15px;
  line-height: 1.6;
  opacity: 0.9;
}

.section {
  padding: 20px;
}

.section-title {
  font-size: 20px;
  margin-bottom: 15px;
  font-weight: bold;
}

.movie-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
}

.movie-card {
  position: relative;
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.3s;
  aspect-ratio: 2/3;
  background: #222;
}

.movie-card:hover {
  transform: scale(1.05);
}

.movie-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.movie-card .overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 10px;
  background: linear-gradient(transparent, rgba(0,0,0,0.9));
}

.movie-card .title {
  font-size: 13px;
  font-weight: bold;
}

.movie-card .year {
  font-size: 11px;
  opacity: 0.7;
}

.error-box {
  background: #e50914;
  color: #fff;
  padding: 15px;
  border-radius: 8px;
  margin: 20px;
  text-align: center;
  display: none;
}

.error-box.show {
  display: block;
}

@media (max-width: 600px) {
  .hero { height: 300px; }
  .hero-title { font-size: 24px; }
  .movie-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">MYFLIX</div>
  <div class="nav">
    <a href="#" class="active">Beranda</a>
    <a href="#">Film</a>
    <a href="#">Serial</a>
  </div>
</div>

<div class="hero">
  <div class="hero-content">
    <h1 class="hero-title">Big Buck Bunny</h1>
    <p class="hero-desc">Animasi pendek tentang kelinci raksasa yang menghadapi tiga hewan pengganggu yang nakal. Film open source dari Blender Foundation.</p>
    <div class="hero-buttons">
      <button class="btn btn-play" onclick="playVideo(0)">▶ Putar</button>
      <button class="btn btn-info" onclick="showInfo(0)">ℹ Info</button>
    </div>
  </div>
</div>

<div class="error-box" id="errorBox">
  ️ Video gagal dimuat. Coba video lain.
</div>

<div class="section">
  <h2 class="section-title"> Sedang Trending</h2>
  <div class="movie-grid" id="movieGrid"></div>
</div>

<div class="section">
  <h2 class="section-title">🎬 Film Populer</h2>
  <div class="movie-grid" id="popularGrid"></div>
</div>

<div class="modal" id="videoModal">
  <button class="modal-close" onclick="closeModal()">✕</button>
  <div class="video-container">
    <video id="videoPlayer" controls playsinline preload="metadata">
      <source src="" type="video/mp4">
      Browser Anda tidak mendukung video.
    </video>
  </div>
  <div class="modal-info">
    <h2 class="modal-title" id="modalTitle"></h2>
    <div class="modal-meta">
      <span id="modalMatch">98% Cocok</span>
      <span id="modalYear">2008</span>
      <span>HD</span>
    </div>
    <p class="modal-desc" id="modalDesc"></p>
  </div>
</div>

<script>
const movies = [
  {
    title: "Big Buck Bunny",
    year: "2008",
    desc: "Animasi pendek tentang kelinci raksasa yang menghadapi tiga hewan pengganggu yang nakal. Karya Blender Foundation.",
    poster: "https://peach.blender.org/wp-content/uploads/bbb-splash.png",
    video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
  },
  {
    title: "Elephant Dream",
    year: "2006",
    desc: "Film animasi pendek pertama dari Blender Foundation. Kisah dua karakter di dunia mesin yang aneh.",
    poster: "https://orange.blender.org/wp-content/themes/orange/images/media/gallery/s1_proog.jpg",
    video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4"
  },
  {
    title: "For Bigger Blazes",
    year: "2014",
    desc: "Video demo Chromecast. Petualangan seru dengan visual yang memukau.",
    poster: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400",
    video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"
  },
  {
    title: "Sintel",
    year: "2010",
    desc: "Film animasi epik tentang seorang gadis yang mencari naga kesayangannya. Karya Blender Institute.",
    poster: "https://durian.blender.org/wp-content/uploads/2010/06/sintel_poster.jpg",
    video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4"
  },
  {
    title: "Tears of Steel",
    year: "2012",
    desc: "Film sci-fi live-action dengan efek visual luar biasa dari Blender Foundation.",
    poster: "https://mango.blender.org/wp-content/uploads/2013/05/01_thom_celia_bridge.jpg",
    video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4"
  },
  {
    title: "For Bigger Fun",
    year: "2014",
    desc: "Keseruan tanpa batas dalam video pendek ini.",
    poster: "https://images.unsplash.com/photo-1440404653325-ab127d49abc1?w=400",
    video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4"
  }
];

function renderMovies() {
  const trendingGrid = document.getElementById('movieGrid');
  const popularGrid = document.getElementById('popularGrid');
  
  trendingGrid.innerHTML = '';
  popularGrid.innerHTML = '';
  
  movies.slice(0, 4).forEach((movie, index) => {
    trendingGrid.innerHTML += createMovieCard(movie, index);
  });
  
  movies.slice(4).forEach((movie, index) => {
    popularGrid.innerHTML += createMovieCard(movie, index + 4);
  });
}

function createMovieCard(movie, index) {
  return `
    <div class="movie-card" onclick="playVideo(${index})">
      <img src="${movie.poster}" alt="${movie.title}" 
           onerror="this.src='https://via.placeholder.com/300x450/333/fff?text=${encodeURIComponent(movie.title)}'">
      <div class="overlay">
        <div class="title">${movie.title}</div>
        <div class="year">${movie.year}</div>
      </div>
    </div>
  `;
}

function playVideo(index) {
  const movie = movies[index];
  const modal = document.getElementById('videoModal');
  const video = document.getElementById('videoPlayer');
  const errorBox = document.getElementById('errorBox');
  
  document.getElementById('modalTitle').textContent = movie.title;
  document.getElementById('modalYear').textContent = movie.year;
  document.getElementById('modalDesc').textContent = movie.desc;
  
  video.src = movie.video;
  video.load();
  
  modal.classList.add('active');
  errorBox.classList.remove('show');
  
  video.play().then(() => {
    console.log('Video playing:', movie.title);
  }).catch(err => {
    console.error('Play error:', err);
    errorBox.textContent = `⚠️ Video "${movie.title}" gagal dimuat. Coba video lain.`;
    errorBox.classList.add('show');
    setTimeout(() => errorBox.classList.remove('show'), 5000);
  });
  
  video.onerror = function() {
    console.error('Video load error:', video.error);
    errorBox.textContent = `⚠️ Video "${movie.title}" tidak tersedia. Coba video lain.`;
    errorBox.classList.add('show');
  };
}

function showInfo(index) {
  const movie = movies[index];
  const modal = document.getElementById('videoModal');
  const video = document.getElementById('videoPlayer');
  
  document.getElementById('modalTitle').textContent = movie.title;
  document.getElementById('modalYear').textContent = movie.year;
  document.getElementById('modalDesc').textContent = movie.desc;
  
  video.src = movie.video;
  video.load();
  
  modal.classList.add('active');
}

function closeModal() {
  const modal = document.getElementById('videoModal');
  const video = document.getElementById('videoPlayer');
  
  video.pause();
  video.src = '';
  modal.classList.remove('active');
}

window.addEventListener('popstate', function() {
  closeModal();
});

renderMovies();
</script>

</body>
</html>
