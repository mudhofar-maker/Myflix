<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyFlix - Video Pendek & Kreator Hub</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #fff; font-family: sans-serif; margin: 0; padding: 0; }
        .main-container { width: 100%; max-width: 1000px; margin: 0 auto; padding: 15px; }
        .card-custom { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; }
        .video-container { background: #000; height: 400px; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; width: 100%; }
        .video-container video { width: 100%; height: 100%; object-fit: cover; }
        .upload-section { background: #181818; border: 2px dashed #444; border-radius: 12px; padding: 20px; text-align: center; }
    </style>
</head>
<body>

    <div class="main-container">

        <!-- HEADER FULL WIDTH -->
        <div class="d-flex justify-content-between align-items-center mb-4 p-3 card-custom">
            <h3 class="text-danger fw-bold m-0">🎬 MyFlix</h3>
            <span class="text-muted small">Platform Video Pendek & Musik Kreatif</span>
        </div>

        <div class="row">
            <!-- KOLOM KIRI: PANEL UPLOAD & MUSIK (KREATOR) -->
            <div class="col-md-5 mb-4">
                <div class="card card-custom p-4 shadow-lg">
                    <h5 class="mb-3 text-warning">🚀 Studio Kreator & Upload</h5>
                    
                    <div class="upload-section mb-3">
                        <label for="videoFile" class="form-label fw-bold text-white mb-2">📁 Ambil Video dari Galeri</label>
                        <input class="form-control form-control-sm bg-dark text-white border-secondary mb-3" type="file" id="videoFile" accept="video/*">
                        
                        <label for="bgMusic" class="form-label fw-bold text-white mb-2">🎵 Tambahkan Musik / Audio</label>
                        <select id="bgMusic" class="form-select form-select-sm bg-dark text-white border-secondary mb-3">
                            <option value="">-- Pilih Musik Latar --</option>
                            <option value="DJ Remix Viral">DJ Remix Viral 2026</option>
                            <option value="Akustik Santai">Akustik Santai Senja</option>
                            <option value="Beat Elektronik">Beat Elektronik Cepat</option>
                            <option value="Instrumental Cinematic">Instrumental Cinematic</option>
                        </select>

                        <button class="btn btn-danger w-100 fw-bold" onclick="uploadVideoFromGallery()">Unggah & Putar Video</button>
                    </div>
                </div>
            </div>

            <!-- KOLOM KANAN: FEED VIDEO (TAMPILAN LEBAR & PENUH) -->
            <div class="col-md-7">
                <div class="card card-custom p-4 shadow-lg mb-4">
                    <h5 class="mb-3 text-info">🔥 Feed Video Pendek</h5>
                    
                    <div id="videoFeedContainer">
                        <!-- Konten video yang diunggah akan muncul di sini secara dinamis -->
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Memuat video dari penyimpanan saat halaman dibuka
        window.onload = function() {
            loadFeedVideos();
        };

        function uploadVideoFromGallery() {
            const fileInput = document.getElementById('videoFile');
            const musicSelect = document.getElementById('bgMusic');

            if (fileInput.files.length === 0) {
                alert('Silakan pilih file video dari galeri terlebih dahulu!');
                return;
            }

            const videoFile = fileInput.files[0];
            const videoUrl = URL.createObjectURL(videoFile); // Membuat URL lokal agar video bisa diputar
            const selectedMusic = musicSelect.value ? musicSelect.value : 'Tanpa Musik';

            // Simpan data video ke LocalStorage
            let videos = JSON.parse(localStorage.getItem('myflix_feed_videos')) || [];
            videos.unshift({ name: videoFile.name, url: videoUrl, music: selectedMusic, date: 'Baru saja' });
            localStorage.setItem('myflix_feed_videos', JSON.stringify(videos));

            alert('Video berhasil diunggah dan langsung masuk ke feed!');
            fileInput.value = '';
            musicSelect.value = '';
            loadFeedVideos();
        }

        function loadFeedVideos() {
            let videos = JSON.parse(localStorage.getItem('myflix_feed_videos')) || [];
            let container = document.getElementById('videoFeedContainer');
            
            if (videos.length === 0) {
                container.innerHTML = `<p class="text-muted text-center">Belum ada video. Silakan unggah video dari galeri Anda!</p>`;
                return;
            }

            container.innerHTML = '';
            videos.forEach((vid, index) => {
                container.innerHTML += `
                    <div class="card card-custom p-3 mb-4 border-secondary">
                        <div class="d-flex align-items-center mb-2">
                            <div class="bg-success rounded-circle d-flex align-items-center justify-content-center text-white fw-bold me-2" style="width: 35px; height: 35px;">K</div>
                            <div>
                                <h6 class="mb-0 text-white">Kreator Mandiri</h6>
                                <small class="text-muted">Musik: ${vid.music}</small>
                            </div>
                        </div>
                        
                        <p class="mb-2">📱 ${vid.name}</p>

                        <!-- Pemutar Video Asli (Bisa Play/Pause) -->
                        <div class="video-container mb-3">
                            <video controls autoplay loop src="${vid.url}"></video>
                        </div>

                        <div class="d-flex justify-content-around border-top border-secondary pt-2">
                            <button class="btn btn-sm btn-dark text-danger" onclick="toggleLike(this)">❤️ <span class="like-count">0</span></button>
                            <button class="btn btn-sm btn-dark text-info" onclick="toggleCommentBox(this)">💬 Komentar</button>
                            <button class="btn btn-sm btn-dark text-success" onclick="shareVideo()">🔗 Bagikan</button>
                        </div>

                        <div class="comment-section mt-3 d-none">
                            <div class="input-group mb-2">
                                <input type="text" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="Tulis komentar...">
                                <button class="btn btn-sm btn-outline-light" onclick="addComment(this)">Kirim</button>
                            </div>
                            <div class="comment-list small text-muted"></div>
                        </div>
                    </div>
                `;
            });
        }

        function toggleLike(btn) {
            let countSpan = btn.querySelector('.like-count');
            let count = parseInt(countSpan.textContent);
            if (btn.classList.contains('liked')) {
                btn.classList.remove('liked');
                btn.style.color = '';
                countSpan.textContent = count - 1;
            } else {
                btn.classList.add('liked');
                btn.style.color = '#ff416c';
                countSpan.textContent = count + 1;
            }
        }

        function toggleCommentBox(btn) {
            let card = btn.closest('.card');
            let commentSection = card.querySelector('.comment-section');
            commentSection.classList.toggle('d-none');
        }

        function addComment(btn) {
            let section = btn.closest('.comment-section');
            let input = section.querySelector('input');
            let list = section.querySelector('.comment-list');
            
            if (input.value.trim() === '') return;

            list.innerHTML += `<p class="mb-1"><strong>Penonton:</strong> ${input.value}</p>`;
            input.value = '';
        }

        function shareVideo() {
            alert('Tautan video berhasil disalin!');
        }
    </script>
</body>
</html>
