<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyFlix - Nonton Video Pendek</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #fff; font-family: sans-serif; }
        .card-custom { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; }
        .video-container { background: #000; height: 350px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #777; }
    </style>
</head>
<body class="container py-4">

    <div class="row justify-content-center">
        <div class="col-md-6">

            <!-- HEADER / NAVBAR SEDERHANA -->
            <div class="d-flex justify-content-between align-items-center mb-4 px-2">
                <h3 class="text-danger fw-bold m-0">MyFlix</h3>
                <span class="text-muted small">Tanpa Daftar • Tanpa Login</span>
            </div>

            <!-- FEED UTAMA (Khusus Penonton: Nonton, Like, Komen, Share) -->
            <div id="videoFeed">
                
                <!-- Contoh Video 1 -->
                <div class="card card-custom p-3 mb-4 shadow">
                    <div class="d-flex align-items-center mb-2">
                        <div class="bg-secondary rounded-circle d-flex align-items-center justify-content-center text-white fw-bold me-2" style="width: 35px; height: 35px;">K</div>
                        <div>
                            <h6 class="mb-0 text-white">Kreator Official</h6>
                            <small class="text-muted">Video Pendek Pilihan</small>
                        </div>
                    </div>
                    
                    <p class="mb-2">Menikmati momen seru hari ini! 🎬✨</p>

                    <!-- Area Pemutar Video -->
                    <div class="video-container mb-3">
                        [ Pemutar Video MyFlix ]
                    </div>

                    <!-- Tombol Interaksi (Like, Komen, Share) -->
                    <div class="d-flex justify-content-around border-top border-secondary pt-2">
                        <button class="btn btn-sm btn-dark text-danger" onclick="toggleLike(this)">❤️ <span class="like-count">124</span></button>
                        <button class="btn btn-sm btn-dark text-info" onclick="toggleCommentBox(this)">💬 Komentar</button>
                        <button class="btn btn-sm btn-dark text-success" onclick="shareVideo()">🔗 Bagikan</button>
                    </div>

                    <!-- Kolom Komentar Tersembunyi Awalnya -->
                    <div class="comment-section mt-3 d-none">
                        <div class="input-group mb-2">
                            <input type="text" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="Tulis komentar publik...">
                            <button class="btn btn-sm btn-outline-light" onclick="addComment(this)">Kirim</button>
                        </div>
                        <div class="comment-list small text-muted">
                            <p class="mb-1"><strong>Budi:</strong> Videonya keren banget!</p>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <script>
        // Fungsi Like Interaktif Tanpa Login
        function toggleLike(btn) {
            let countSpan = btn.querySelector('.like-count');
            let count = parseInt(countSpan.textContent);
            if (btn.classList.contains('liked')) {
                btn.classList.remove('liked');
                btn.style.color = '';
                countSpan.textContent = count - 1;
            } else {
                btn.classList.add('liked');
                btn.style.color = '#ff416c';
                countSpan.textContent = count + 1;
            }
        }

        // Buka/Tutup Kolom Komentar
        function toggleCommentBox(btn) {
            let card = btn.closest('.card');
            let commentSection = card.querySelector('.comment-section');
            commentSection.classList.toggle('d-none');
        }

        // Kirim Komentar Instan
        function addComment(btn) {
            let section = btn.closest('.comment-section');
            let input = section.querySelector('input');
            let list = section.querySelector('.comment-list');
            
            if (input.value.trim() === '') return;

            list.innerHTML += `<p class="mb-1"><strong>Penonton:</strong> ${input.value}</p>`;
            input.value = '';
        }

        // Fitur Share
        function shareVideo() {
            alert('Tautan video disalin ke clipboard!');
        }
    </script>
</body>
</html>
