<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TikVid - Cloudinary Edition</title>
<!-- Menghubungkan ke file CSS eksternal -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOADER -->
<div class="loader-overlay" id="loader">
  <div class="spinner"></div>
  <div id="loaderText">Memuat...</div>
</div>

<!-- HALAMAN BERANDA (FEED) -->
<div class="screen active" id="screen-home">
  <div class="feed-container" id="feedContainer">
    <div class="feed-top-bar">
      <div class="live-badge" onclick="showToast('Live segera hadir')">🔴 LIVE</div>
      <div class="feed-tabs">
        <span class="feed-tab active">Mengikuti</span>
        <span class="feed-tab">Panjang & FYP</span>
      </div>
    </div>
    <div class="empty-feed" id="emptyFeed">
      <div style="font-size:60px; margin-bottom:10px;">🎬</div>
      <div>Belum ada video</div>
    </div>
  </div>
</div>

<!-- HALAMAN PROFIL -->
<div class="screen" id="screen-profile">
    <div style="padding: 40px; text-align: center;">
        <h2>Profil</h2>
        <p style="color: var(--text-dim);">Video yang kamu posting akan muncul di sini.</p>
        <button class="btn-publish" onclick="switchTab('home')" style="max-width: 200px; margin: 20px auto;">Kembali ke Beranda</button>
    </div>
</div>

<!-- NAVIGASI BAWAH -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="switchTab('home')"><span class="icon">🏠</span> Beranda</div>
  <div class="nav-item" onclick="showToast('Fitur Teman')"><span class="icon">👥</span> Teman</div>
  <div class="nav-item btn-plus-wrap" onclick="openCamera()"><div class="btn-plus">+</div></div>
  <div class="nav-item" onclick="showToast('Kotak Masuk')"><span class="icon">📥</span> Kotak Masuk</div>
  <div class="nav-item" onclick="switchTab('profile')"><span class="icon">👤</span> Profil</div>
</div>

<!-- HALAMAN KAMERA -->
<div class="screen full-screen" id="screen-camera">
  <div class="content">
    <div style="display:flex; justify-content:space-between; padding:15px; position:absolute; top:0; left:0; right:0; z-index:10;">
      <button class="icon-btn" onclick="stopCamera(); switchTab('home')">✕</button>
      <button class="icon-btn" onclick="toggleCameraFacing()">🔄</button>
    </div>
    <div class="cam-preview-wrap">
      <video id="camPreview" autoplay playsinline muted></video>
    </div>
    <div class="cam-controls">
      <div style="width:50px;"></div>
      <button class="rec-btn" id="recBtn" onclick="toggleRecording()"></button>
      <button class="icon-btn" onclick="pickFromGallery()" style="width:50px;height:50px;font-size:24px;">🖼️</button>
    </div>
  </div>
  <input type="file" id="galleryInput" accept="video/*" style="display:none">
</div>

<!-- HALAMAN EDITOR & UPLOAD -->
<div class="screen full-screen" id="screen-editor">
  <div class="content">
    <div style="display:flex; justify-content:space-between; padding:15px; position:absolute; top:0; left:0; right:0; z-index:10;">
      <button class="icon-btn" onclick="switchTab('home')">←</button>
      <button class="icon-btn" onclick="publishVideo()" style="background:var(--primary);">✓</button>
    </div>
    <div class="editor-video-wrap">
      <video id="editVideo" playsinline controls style="max-width:100%; max-height:100%;"></video>
    </div>
    <div class="editor-panel">
      <p style="color:var(--text-dim); font-size:12px; text-align:center; margin-bottom:10px;">Video siap diupload.</p>
      <button class="btn-publish" onclick="publishVideo()">Posting Video</button>
    </div>
  </div>
</div>

<!-- MODAL PUBLISH (INPUT JUDUL & DESKRIPSI) -->
<div class="modal-bg" id="publishModal">
  <div class="modal">
    <h3 style="margin-top:0;">Posting Video</h3>
    <div class="form-group">
      <label>Judul Video</label>
      <input type="text" id="pubTitle" placeholder="Judul menarik...">
    </div>
    <div class="form-group">
      <label>Deskripsi</label>
      <textarea id="pubDesc" rows="3" placeholder="Deskripsi..."></textarea>
    </div>
    <div style="display:flex; gap:10px; margin-top:20px;">
      <button onclick="closeModal('publishModal')" style="flex:1; padding:14px; background:var(--surface2); border:none; color:#fff; border-radius:8px; cursor:pointer;">Batal</button>
      <button onclick="confirmPublish()" style="flex:1; padding:14px; background:var(--primary); border:none; color:#fff; border-radius:8px; font-weight:bold; cursor:pointer;">Posting</button>
    </div>
  </div>
</div>

<!-- NOTIFIKASI TOAST -->
<div class="toast" id="toast"></div>

<!-- PANGGIL FILE SCRIPT.JS -->
<script type="module" src="script.js"></script>
</body>
</html>
