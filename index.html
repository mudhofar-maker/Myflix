<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>TikVid - Video Cloud DB & Music API</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/plus-jakarta-sans@5.0.3/index.css" />
<!-- Puter.js untuk Free Cloud Storage Database khusus file media -->
<script src="https://js.puter..com/v2/"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #000;
    color: #fff;
    user-select: none;
  }
  #app {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 480px;
    margin: 0 auto;
    background: #000;
    overflow: hidden;
  }
  /* Top Bar */
  .top-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 50;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  }
  .top-bar .live-btn {
    font-size: 14px; font-weight: 600;
    opacity: 0.9; cursor: pointer; padding: 6px 12px;
    background: linear-gradient(135deg, #ff2d55, #ff9500); border-radius: 16px;
    display: flex; align-items: center; gap: 4px;
    box-shadow: 0 2px 10px rgba(255,45,85,0.4);
  }
  .top-bar .tabs {
    display: flex;
    gap: 20px;
    font-size: 16px;
    font-weight: 600;
  }
  .top-bar .tab { opacity: 0.6; cursor: pointer; position: relative; padding: 6px 4px; }
  .top-bar .tab.active { opacity: 1; }
  .top-bar .tab.active::after {
    content: '';
    position: absolute;
    bottom: 0px; left: 50%;
    transform: translateX(-50%);
    width: 18px; height: 3px;
    background: #fff;
    border-radius: 2px;
  }
  .top-bar .search-btn {
    font-size: 20px;
    cursor: pointer;
    padding: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
  }
  /* Feed */
  .feed {
    width: 100%;
    height: 100%;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
  }
  .feed::-webkit-scrollbar { display: none; }
  .video-slide {
    position: relative;
    width: 100%;
    height: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    overflow: hidden;
    background: #000;
  }
  .video-slide canvas, .video-slide video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }
  /* Play/Pause indicator */
  .play-indicator {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 80px;
    opacity: 0;
    pointer-events: none;
    transition: transform 0.25s ease, opacity 0.25s ease;
    z-index: 20;
    text-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .play-indicator.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 0.9;
  }
  /* Double tap heart */
  .double-tap-heart {
    position: absolute;
    font-size: 100px;
    color: #ff2d55;
    pointer-events: none;
    z-index: 25;
    animation: heartPop 1s ease-out forwards;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
  }
  @keyframes heartPop {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-15deg); opacity: 0; }
    20% { transform: translate(-50%, -50%) scale(1.3) rotate(10deg); opacity: 1; }
    40% { transform: translate(-50%, -50%) scale(1) rotate(-5deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.1) rotate(0); opacity: 0; }
  }
  /* Sidebar */
  .sidebar {
    position: absolute;
    right: 10px;
    bottom: 110px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    z-index: 10;
  }
  .sidebar .avatar-wrap {
    position: relative;
    margin-bottom: 6px;
  }
  .sidebar .avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 2px solid #fff;
    background: linear-gradient(135deg, #ff2d55, #ff9500);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 18px;
    overflow: hidden;
  }
  .sidebar .follow-btn {
    position: absolute;
    bottom: -8px; left: 50%;
    transform: translateX(-50%);
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #ff2d55;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: 2px solid #000;
  }
  .sidebar .follow-btn.followed { background: #2ecc71; }
  .sidebar .action {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    cursor: pointer;
  }
  .sidebar .action .icon {
    width: 42px; height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }
  .sidebar .action .count {
    font-size: 12px;
    font-weight: 600;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
  .sidebar .like-btn.liked .icon { color: #ff2d55; }
  .sidebar .like-btn.liked .icon svg { fill: #ff2d55; }
  .sidebar .bookmark-btn.bookmarked .icon svg { fill: #ffd700; }
  /* Bottom Info */
  .bottom-info {
    position: absolute;
    left: 12px;
    right: 80px;
    bottom: 80px;
    z-index: 10;
    background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
    padding: 30px 12px 10px;
    margin: 0 -12px;
  }
  .bottom-info .username {
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 6px;
  }
  .bottom-info .caption {
    font-size: 14px;
    line-height: 1.4;
    margin-bottom: 8px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .bottom-info .caption .hashtag { font-weight: 600; }
  .bottom-info .music {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    overflow: hidden;
  }
  .bottom-info .music .marquee {
    overflow: hidden;
    white-space: nowrap;
    flex: 1;
  }
  .bottom-info .music .marquee span {
    display: inline-block;
    padding-right: 40px;
    animation: marquee 10s linear infinite;
  }
  @keyframes marquee {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  /* Progress bar */
  .progress-bar {
    position: absolute;
    bottom: 60px;
    left: 0; right: 0;
    height: 2px;
    background: rgba(255,255,255,0.2);
    z-index: 15;
  }
  .progress-bar .progress {
    height: 100%;
    background: #fff;
    width: 0%;
  }
  /* Bottom Nav */
  .bottom-nav {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 60px;
    background: #000;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 40;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .bottom-nav .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 10px;
    color: #fff;
    opacity: 0.6;
    cursor: pointer;
    padding: 8px 0;
  }
  .bottom-nav .nav-item.active { opacity: 1; }
  .bottom-nav .nav-item .nav-icon {
    font-size: 22px;
    line-height: 1;
  }
  .bottom-nav .upload-btn {
    width: 44px; height: 30px;
    background: linear-gradient(90deg, #25f4ee, #fff, #fe2c55);
    border-radius: 8px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .bottom-nav .upload-btn::before {
    content: '+';
    position: absolute;
    inset: 0;
    background: #000;
    border-radius: 6px;
    margin: 2px 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 22px;
    font-weight: 300;
  }
  /* Modals */
  .modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    display: none;
    align-items: flex-end;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    width: 100%;
    max-height: 70%;
    background: #1c1c1e;
    border-radius: 16px 16px 0 0;
    padding: 16px;
    display: flex;
    flex-direction: column;
  }
  .modal-header {
    text-align: center;
    font-weight: 700;
    font-size: 15px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    position: relative;
  }
  .modal-close {
    position: absolute;
    right: 0; top: 50%;
    transform: translateY(-50%);
    font-size: 18px;
    cursor: pointer;
    padding: 8px;
  }
  /* Comments */
  .comments-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 0;
    max-height: 320px;
  }
  .comment-item {
    display: flex;
    gap: 10px;
    padding: 10px 0;
  }
  .comment-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
  }
  .comment-body { flex: 1; }
  .comment-user {
    font-size: 13px;
    opacity: 0.6;
    margin-bottom: 2px;
  }
  .comment-text {
    font-size: 14px;
    line-height: 1.4;
  }
  .comment-input-wrap {
    display: flex;
    gap: 10px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .comment-input {
    flex: 1;
    background: #2c2c2e;
    border: none;
    border-radius: 20px;
    padding: 10px 16px;
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  .comment-send {
    background: #fe2c55;
    border: none;
    color: #fff;
    padding: 0 18px;
    border-radius: 20px;
    font-weight: 600;
    cursor: pointer;
  }
  /* Share */
  .share-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    padding: 20px 0;
  }
  .share-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .share-icon {
    width: 50px; height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }
  /* Toast */
  .toast {
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(0,0,0,0.9);
    color: #fff;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    z-index: 400;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  /* Mute indicator */
  .mute-indicator {
    position: absolute;
    top: 60px;
    right: 16px;
    background: rgba(0,0,0,0.6);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 30;
    cursor: pointer;
  }
  /* Camera & Live Studio Modal */
  .camera-modal {
    position: absolute;
    inset: 0;
    background: #000;
    z-index: 300;
    display: none;
    flex-direction: column;
    justify-content: space-between;
    padding: 20px;
  }
  .camera-modal.show { display: flex; }
  .camera-preview-wrap {
    position: absolute;
    inset: 0;
    background: #111;
    z-index: 1;
    overflow: hidden;
  }
  #cameraVideo {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .camera-top-bar {
    position: relative;
    z-index: 5;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 16px;
    font-weight: 600;
  }
  .camera-controls {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
    padding-bottom: 20px;
  }
  .camera-actions-row {
    display: flex;
    justify-content: space-around;
    align-items: center;
    width: 100%;
  }
  .cam-btn {
    background: rgba(255,255,255,0.25);
    border: none;
    color: #fff;
    padding: 10px 16px;
    border-radius: 20px;
    font-weight: 600;
    cursor: pointer;
    font-size: 12px;
  }
  .record-shutter {
    width: 70px; height: 70px;
    border-radius: 50%;
    border: 4px solid #fff;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .record-shutter-inner {
    width: 54px; height: 54px;
    background: #fe2c55;
    border-radius: 50%;
    transition: all 0.2s;
  }
  .record-shutter.recording .record-shutter-inner {
    width: 30px; height: 30px;
    border-radius: 4px;
  }
  .live-indicator-badge {
    position: absolute;
    top: 70px;
    left: 20px;
    background: #ff2d55;
    color: #fff;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: bold;
    display: none;
    z-index: 5;
  }
  .music-picker {
    background: rgba(0,0,0,0.7);
    padding: 8px 14px;
    border-radius: 16px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid rgba(255,255,255,0.2);
  }
</style>
</head>
<body>
<div id="app">
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="live-btn" id="liveBtn">🔴 LIVE</div>
    <div class="tabs">
      <div class="tab" data-tab="following">Mengikuti</div>
      <div class="tab active" data-tab="foryou">Untuk Kamu</div>
    </div>
    <div class="search-btn" id="searchBtn">🔍</div>
  </div>

  <!-- Mute indicator -->
  <div class="mute-indicator" id="muteIndicator">
    <span id="muteIcon">🔇</span>
    <span id="muteText">Suara Mati</span>
  </div>

  <!-- Feed -->
  <div class="feed" id="feed"></div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <div class="nav-item active" data-nav="beranda">
      <div class="nav-icon">🏠</div>
      <div>Beranda</div>
    </div>
    <div class="nav-item" data-nav="jelajahi">
      <div class="nav-icon">🧭</div>
      <div>Jelajahi</div>
    </div>
    <div class="nav-item">
      <div class="upload-btn" id="openCameraModal"></div>
    </div>
    <div class="nav-item" data-nav="kotakmasuk">
      <div class="nav-icon">📥</div>
      <div>Kotak Masuk</div>
    </div>
    <div class="nav-item" data-nav="profil">
      <div class="nav-icon">👤</div>
      <div>Profil</div>
    </div>
  </div>

  <!-- Comments Modal -->
  <div class="modal-overlay" id="commentsModal">
    <div class="modal">
      <div class="modal-header">
        <span id="commentsCount">0 Komentar</span>
        <div class="modal-close" data-close="commentsModal">✕</div>
      </div>
      <div class="comments-list" id="commentsList"></div>
      <div class="comment-input-wrap">
        <input type="text" class="comment-input" id="commentInput" placeholder="Tambah komentar..." />
        <button class="comment-send" id="commentSend">Kirim</button>
      </div>
    </div>
  </div>

  <!-- Share Modal -->
  <div class="modal-overlay" id="shareModal">
    <div class="modal">
      <div class="modal-header">
        Bagikan ke
        <div class="modal-close" data-close="shareModal">✕</div>
      </div>
      <div class="share-grid" id="shareGrid"></div>
    </div>
  </div>

  <!-- Search Modal -->
  <div class="modal-overlay" id="searchModal">
    <div class="modal" style="height: 240px;">
      <div class="modal-header">
        Pencarian TikVid
        <div class="modal-close" data-close="searchModal">✕</div>
      </div>
      <div style="padding-top: 15px;">
        <input type="text" class="comment-input" id="searchInput" placeholder="Cari tag atau kreator..." style="width: 100%; margin-bottom: 15px;" />
        <button class="comment-send" id="executeSearch" style="width: 100%; border-radius: 20px; padding: 10px;">Cari</button>
      </div>
    </div>
  </div>

  <!-- Music Picker Modal (Connected to Live Jamendo API) -->
  <div class="modal-overlay" id="musicModal">
    <div class="modal" style="height: 380px;">
      <div class="modal-header">
        Pilih Musik Viral (API Live)
        <div class="modal-close" data-close="musicModal">✕</div>
      </div>
      <div class="comments-list" id="musicList">
        <div class="comment-item" style="padding: 14px; text-align:center; opacity:0.6;">Memuat musik viral dari API...</div>
      </div>
    </div>
  </div>

  <!-- Camera & LIVE Studio Modal -->
  <div class="camera-modal" id="cameraModal">
    <div class="camera-preview-wrap">
      <video id="cameraVideo" autoplay playsinline muted></video>
    </div>
    <div class="live-indicator-badge" id="liveBadge">LIVE STREAMING</div>
    <div class="camera-top-bar">
      <div style="cursor: pointer; padding: 10px;" id="closeCamera">✕ Tutup</div>
      <div id="recordingTimer" style="color: #fe2c55; display: none;">● 00:00</div>
      <div style="cursor: pointer; padding: 10px;" id="switchCameraBtn">🔄 Putar Kamera</div>
    </div>
    <div class="camera-controls">
      <div class="music-picker" id="openMusicModal">
        <span id="selectedMusicLabel">🎵 ♪ Lofi Sunset Vibes - ChillBeats</span>
      </div>
      <div class="camera-actions-row">
        <button class="cam-btn" id="uploadGalleryBtn">📁 Galeri</button>
        <div class="record-shutter" id="recordShutter">
          <div class="record-shutter-inner"></div>
        </div>
        <button class="cam-btn" id="camModeToggleBtn">Rekam</button>
      </div>
    </div>
    <input type="file" id="galleryInput" accept="video/*" style="display: none;" />
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>
</div>

<script>
  const defaultVideos = [
    { id: 1, user: 'sunset_lover', displayName: 'Pecinta Senja', avatar: '🌅', avatarBg: 'linear-gradient(135deg, #ff9966, #ff5e62)', caption: 'Senja hari ini benar-benar memukau 🌇 Siapa yang setuju?', hashtags: ['senja', 'sunset', 'indonesia', 'fyp'], music: '♪ Lofi Sunset Vibes - ChillBeats', likes: 128400, comments: 2341, shares: 892, bookmarks: 4521, theme: 'sunset' },
    { id: 2, user: 'ocean_dreamer', displayName: 'Pemimpi Laut', avatar: '🌊', avatarBg: 'linear-gradient(135deg, #2193b0, #6dd5ed)', caption: 'Gelombang laut menenangkan pikiran 🌊✨', hashtags: ['ocean', 'waves', 'calm', 'nature'], music: '♪ Ocean Waves - Nature Sounds', likes: 89200, comments: 1203, shares: 456, bookmarks: 2310, theme: 'ocean' },
    { id: 3, user: 'aurora_north', displayName: 'Cahaya Utara', avatar: '✨', avatarBg: 'linear-gradient(135deg, #00c9ff, #92fe9d)', caption: 'Aurora borealis di malam ini 💚💙', hashtags: ['aurora', 'northernlights', 'sky'], music: '♪ Northern Lights - Ambient', likes: 456700, comments: 8921, shares: 3421, bookmarks: 12300, theme: 'aurora' }
  ];

  let videos = [];
  let currentSelectedMusic = '♪ Lofi Sunset Vibes - ChillBeats';

  // Inisialisasi Cloud Storage DB Gratis via Puter.js
  async function initCloudDatabase() {
    try {
      // Membaca file database cloud khusus video
      const file = await puter.fs.read('tikvid_cloud_videos.json');
      if (file) {
        const text = await file.text();
        videos = JSON.parse(text);
      } else {
        videos = [...defaultVideos];
      }
    } catch (e) {
      // Fallback jika belum ada file di cloud DB, gunakan default/lokal
      const saved = localStorage.getItem('tikvid_custom_videos');
      videos = saved ? JSON.parse(saved) : [...defaultVideos];
    }
    renderFeed(videos);
  }

  const sampleComments = [
    { user: 'dina_k', text: 'Keren banget kak! 🔥', time: '2j', likes: 234 },
    { user: 'rizky.m', text: 'Indahnya ya Allah 😍', time: '3j', likes: 567 }
  ];

  const shareOptions = [
    { name: 'WhatsApp', icon: '💬', bg: '#25D366' },
    { name: 'Instagram', icon: '📷', bg: '#dc2743' },
    { name: 'Facebook', icon: '📘', bg: '#1877F2' },
    { name: 'Salin Link', icon: '🔗', bg: '#555' }
  ];

  // Fetch Live Viral Music from Jamendo API
  async function fetchViralMusicAPI() {
    const musicListEl = document.getElementById('musicList');
    try {
      const response = await fetch('https://api.jamendo.com/v3.0/tracks/?client_id=5997230b&format=json&limit=15&boost=popularity');
      const data = await response.json();
      
      if (data && data.results && data.results.length > 0) {
        musicListEl.innerHTML = '';
        data.results.forEach(track => {
          const item = document.createElement('div');
          item.className = 'comment-item';
          item.style.cssText = 'cursor:pointer; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: space-between;';
          item.dataset.music = `♪ ${track.name} - ${track.artist_name}`;
          item.innerHTML = `
            <div>
              <div style="font-weight: 600; font-size: 14px;">🎵 ${track.name}</div>
              <div style="font-size: 12px; opacity: 0.6;">Artist: ${track.artist_name}</div>
            </div>
            <div style="font-size: 12px; color: #25f4ee;">Gunakan</div>
          `;
          musicListEl.appendChild(item);
        });
      }
    } catch (err) {
      musicListEl.innerHTML = `
        <div class="comment-item" data-music="♪ Lofi Sunset Vibes - ChillBeats" style="cursor:pointer; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05);">🎵 Lofi Sunset Vibes - ChillBeats</div>
        <div class="comment-item" data-music="♪ Ocean Waves - Nature Sounds" style="cursor:pointer; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05);">🎵 Ocean Waves - Nature Sounds</div>
        <div class="comment-item" data-music="♪ TikTok Viral Remix 2026" style="cursor:pointer; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05);">🎵 TikTok Viral Remix 2026</div>
      `;
    }
  }

  function formatCount(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
    return n.toString();
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  const feed = document.getElementById('feed');

  function renderFeed(list) {
    feed.innerHTML = '';
    list.forEach((v, idx) => {
      const slide = document.createElement('div');
      slide.className = 'video-slide';
      slide.dataset.idx = idx;
      
      let mediaContent = `<canvas></canvas>`;
      if (v.isCustomVideo) {
        mediaContent = `<video src="${v.videoUrl}" autoplay loop playsinline></video>`;
      }

      slide.innerHTML = `
        ${mediaContent}
        <div class="play-indicator" id="playInd-${idx}">▶</div>
        <div class="sidebar">
          <div class="avatar-wrap">
            <div class="avatar" style="background:${v.avatarBg}">${v.avatar}</div>
            <div class="follow-btn" data-action="follow" data-idx="${idx}">+</div>
          </div>
          <div class="action like-btn" data-action="like" data-idx="${idx}">
            <div class="icon">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="white">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
              </svg>
            </div>
            <div class="count" id="likeCount-${idx}">${formatCount(v.likes)}</div>
          </div>
          <div class="action comment-btn" data-action="comment" data-idx="${idx}">
            <div class="icon">💬</div>
            <div class="count">${formatCount(v.comments)}</div>
          </div>
          <div class="action bookmark-btn" data-action="bookmark" data-idx="${idx}">
            <div class="icon">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="white">
                <path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/>
              </svg>
            </div>
            <div class="count" id="bookmarkCount-${idx}">${formatCount(v.bookmarks)}</div>
          </div>
          <div class="action share-btn" data-action="share" data-idx="${idx}">
            <div class="icon">↗</div>
            <div class="count">${formatCount(v.shares)}</div>
          </div>
        </div>
        <div class="bottom-info">
          <div class="username">@${v.user}</div>
          <div class="caption">${v.caption} ${(v.hashtags || []).map(h => `<span class="hashtag">#${h}</span>`).join(' ')}</div>
          <div class="music">
            <span>🎵</span>
            <div class="marquee"><span>${v.music} &nbsp;&nbsp;&nbsp; </span></div>
          </div>
        </div>
        <div class="progress-bar"><div class="progress" id="progress-${idx}"></div></div>
      `;
      feed.appendChild(slide);
    });
  }

  const state = videos.map(v => ({
    liked: false,
    bookmarked: false,
    followed: false,
    likes: v.likes,
    bookmarks: v.bookmarks,
    comments: [...sampleComments]
  }));

  initCloudDatabase();

  // Canvas background animations
  document.querySelectorAll('.video-slide').forEach((slide, idx) => {
    const canvas = slide.querySelector('canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let t = 0;

    function draw() {
      t += 0.03;
      ctx.fillStyle = idx % 2 === 0 ? '#ff6b35' : '#2193b0';
      ctx.fillRect(0, 0, canvas.width || 300, canvas.height || 500);
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      for(let i=0; i<15; i++) {
        let px = (i * 40 + t * 20) % 400;
        let py = (i * 70 + Math.sin(t+i)*30) % 700;
        ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI*2); ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    draw();
  });

  // ============ GLOBAL EVENT LISTENER ============
  document.addEventListener('click', (e) => {
    const tab = e.target.closest('.tab');
    if (tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      showToast(`Tab: ${tab.textContent}`);
      return;
    }

    if (e.target.closest('#liveBtn')) {
      openLiveStudio();
      return;
    }

    if (e.target.closest('#searchBtn')) {
      document.getElementById('searchModal').classList.add('show');
      return;
    }
    if (e.target.closest('#executeSearch')) {
      document.getElementById('searchModal').classList.remove('show');
      showToast('Hasil pencarian ditampilkan');
      return;
    }

    if (e.target.closest('#openMusicModal')) {
      document.getElementById('musicModal').classList.add('show');
      fetchViralMusicAPI();
      return;
    }

    const musicItem = e.target.closest('[data-music]');
    if (musicItem) {
      currentSelectedMusic = musicItem.dataset.music;
      document.getElementById('selectedMusicLabel').textContent = currentSelectedMusic;
      document.getElementById('musicModal').classList.remove('show');
      showToast(`Musik aktif: ${currentSelectedMusic}`);
      return;
    }

    const navItem = e.target.closest('.bottom-nav .nav-item[data-nav]');
    if (navItem) {
      document.querySelectorAll('.bottom-nav .nav-item').forEach(i => i.classList.remove('active'));
      navItem.classList.add('active');
      showToast(`Menu: ${navItem.textContent.trim()}`);
      return;
    }

    const closeBtn = e.target.closest('[data-close]');
    if (closeBtn) {
      const modalId = closeBtn.dataset.close;
      document.getElementById(modalId).classList.remove('show');
      return;
    }

    const actionEl = e.target.closest('[data-action]');
    if (actionEl) {
      const action = actionEl.dataset.action;
      const idx = parseInt(actionEl.dataset.idx);

      if (action === 'like') {
        state[idx].liked = !state[idx].liked;
        state[idx].likes += state[idx].liked ? 1 : -1;
        actionEl.classList.toggle('liked', state[idx].liked);
        document.getElementById(`likeCount-${idx}`).textContent = formatCount(state[idx].likes);
      } else if (action === 'bookmark') {
        state[idx].bookmarked = !state[idx].bookmarked;
        state[idx].bookmarks += state[idx].bookmarked ? 1 : -1;
        actionEl.classList.toggle('bookmarked', state[idx].bookmarked);
        document.getElementById(`bookmarkCount-${idx}`).textContent = formatCount(state[idx].bookmarks);
        showToast(state[idx].bookmarked ? 'Disimpan ke favorit' : 'Dihapus dari favorit');
      } else if (action === 'follow') {
        state[idx].followed = !state[idx].followed;
        actionEl.classList.toggle('followed', state[idx].followed);
        actionEl.textContent = state[idx].followed ? '✓' : '+';
        showToast(state[idx].followed ? 'Mengikuti kreator' : 'Berhenti mengikuti');
      } else if (action === 'comment') {
        openComments(idx);
      } else if (action === 'share') {
        openShare(idx);
      }
      return;
    }
  });

  function openComments(idx) {
    const modal = document.getElementById('commentsModal');
    const list = document.getElementById('commentsList');
    document.getElementById('commentsCount').textContent = `${state[idx].comments.length} Komentar`;
    list.innerHTML = '';
    state[idx].comments.forEach(c => {
      list.innerHTML += `<div class="comment-item"><div class="comment-avatar" style="background:#ff6b6b">${c.user[0]}</div><div class="comment-body"><div class="comment-user">@${c.user}</div><div class="comment-text">${c.text}</div></div></div>`;
    });
    modal.classList.add('show');
    modal.dataset.idx = idx;
  }

  document.getElementById('commentSend').addEventListener('click', () => {
    const input = document.getElementById('commentInput');
    const text = input.value.trim();
    if (!text) return;
    const modal = document.getElementById('commentsModal');
    const idx = parseInt(modal.dataset.idx);
    state[idx].comments.unshift({ user: 'saya', text: text });
    input.value = '';
    openComments(idx);
    showToast('Komentar terkirim');
  });

  function openShare(idx) {
    const modal = document.getElementById('shareModal');
    const grid = document.getElementById('shareGrid');
    grid.innerHTML = '';
    shareOptions.forEach(opt => {
      const item = document.createElement('div');
      item.className = 'share-item';
      item.innerHTML = `<div class="share-icon" style="background:${opt.bg}">${opt.icon}</div><div>${opt.name}</div>`;
      item.addEventListener('click', () => {
        modal.classList.remove('show');
        showToast(`Membuka ${opt.name}`);
      });
      grid.appendChild(item);
    });
    modal.classList.add('show');
  }

  let muted = true;
  document.getElementById('muteIndicator').addEventListener('click', () => {
    muted = !muted;
    document.getElementById('muteIcon').textContent = muted ? '🔇' : '🔊';
    document.getElementById('muteText').textContent = muted ? 'Suara Mati' : 'Suara Aktif';
    showToast(muted ? 'Audio dimatikan' : 'Audio diaktifkan');
  });

  // ============ CAMERA, LIVE & CLOUD DB STORAGE ============
  const cameraModal = document.getElementById('cameraModal');
  const cameraVideo = document.getElementById('cameraVideo');
  const openCameraBtn = document.getElementById('openCameraModal');
  const closeCameraBtn = document.getElementById('closeCamera');
  const switchCameraBtn = document.getElementById('switchCameraBtn');
  const recordShutter = document.getElementById('recordShutter');
  const uploadGalleryBtn = document.getElementById('uploadGalleryBtn');
  const galleryInput = document.getElementById('galleryInput');
  const liveBadge = document.getElementById('liveBadge');
  const camModeToggleBtn = document.getElementById('camModeToggleBtn');

  let mediaStream = null;
  let mediaRecorder = null;
  let recordedChunks = [];
  let isRecording = false;
  let useFrontCamera = true;
  let isLiveMode = false;

  async function startCamera(front) {
    if (mediaStream) {
      mediaStream.getTracks().forEach(t => t.stop());
    }
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: front ? 'user' : 'environment' },
        audio: true
      });
      cameraVideo.srcObject = mediaStream;
    } catch (err) {
      showToast('Akses kamera/mikrofon diblokir');
    }
  }

  openCameraBtn.addEventListener('click', async () => {
    isLiveMode = false;
    liveBadge.style.display = 'none';
    camModeToggleBtn.textContent = 'Rekam';
    cameraModal.classList.add('show');
    await startCamera(useFrontCamera);
  });

  async function openLiveStudio() {
    isLiveMode = true;
    liveBadge.style.display = 'block';
    camModeToggleBtn.textContent = 'LIVE Aktif';
    cameraModal.classList.add('show');
    await startCamera(useFrontCamera);
    showToast('Memulai Siaran LIVE via Kamera Perangkat...');
  }

  closeCameraBtn.addEventListener('click', () => {
    if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
    cameraModal.classList.remove('show');
    if (isRecording) {
      mediaRecorder.stop();
      isRecording = false;
      recordShutter.classList.remove('recording');
    }
  });

  switchCameraBtn.addEventListener('click', async () => {
    useFrontCamera = !useFrontCamera;
    await startCamera(useFrontCamera);
    showToast(useFrontCamera ? 'Kamera Depan' : 'Kamera Belakang');
  });

  recordShutter.addEventListener('click', () => {
    if (isLiveMode) {
      showToast('Anda sedang dalam siaran LIVE.');
      return;
    }

    if (!isRecording) {
      recordedChunks = [];
      try {
        mediaRecorder = new MediaRecorder(mediaStream);
      } catch(e) {
        mediaRecorder = new MediaRecorder(mediaStream, {mimeType: 'video/webm'});
      }
      mediaRecorder.ondataavailable = e => { if(e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const reader = new FileReader();
        reader.readAsDataURL(blob);
        reader.onloadend = () => {
          addNewVideoToCloudDB(reader.result);
        };
      };
      mediaRecorder.start();
      isRecording = true;
      recordShutter.classList.add('recording');
      showToast('Perekaman video dimulai...');
    } else {
      mediaRecorder.stop();
      isRecording = false;
      recordShutter.classList.remove('recording');
      cameraModal.classList.remove('show');
      if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
      showToast('Video berhasil direkam & disimpan ke Cloud DB!');
    }
  });

  uploadGalleryBtn.addEventListener('click', () => {
    galleryInput.click();
  });

  galleryInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onloadend = () => {
        addNewVideoToCloudDB(reader.result);
        cameraModal.classList.remove('show');
        if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
        showToast('Video galeri diunggah ke Cloud DB!');
      };
    }
  });

  async function addNewVideoToCloudDB(videoDataUrl) {
    const newVid = {
      id: Date.now(),
      user: 'kreator_cloud',
      displayName: 'Anda',
      avatar: '☁️',
      avatarBg: '#25f4ee',
      caption: 'Video tersimpan di Cloud Database gratis 🚀',
      hashtags: ['fyp', 'cloud', 'viral'],
      music: currentSelectedMusic,
      likes: 1, comments: 0, shares: 0, bookmarks: 0,
      isCustomVideo: true,
      videoUrl: videoDataUrl
    };

    videos.unshift(newVid);
    state.unshift({ liked: false, bookmarked: false, followed: true, likes: 1, bookmarks: 0, comments: [] });
    
    // Simpan otomatis ke Puter Cloud Storage & LocalStorage Backup
    try {
      await puter.fs.write('tikvid_cloud_videos.json', JSON.stringify(videos));
      localStorage.setItem('tikvid_custom_videos', JSON.stringify(videos));
    } catch (e) {
      localStorage.setItem('tikvid_custom_videos', JSON.stringify(videos));
    }

    renderFeed(videos);
  }
</script>
</body>
</html>
