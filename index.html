<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VideoStream Studio</title>
<style>
  :root{
    --bg:#121212; --surface:#1e1e1e; --surface2:#2a2a2a;
    --primary:#7c4dff; --primary-dark:#5e35b1;
    --text:#ffffff; --text-dim:#b0b0b0; --danger:#ff5252; --success:#4caf50;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column;
  }

  /* ============ HEADER ============ */
  header{
    background:var(--surface); padding:14px 18px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid #333; flex-shrink:0;
  }
  header h1{margin:0; font-size:17px; font-weight:600; letter-spacing:.3px;}
  header .logo{display:flex; align-items:center; gap:8px;}
  .back-btn{
    background:none; border:none; color:var(--text); font-size:22px;
    cursor:pointer; padding:4px 8px; display:none;
  }

  /* ============ SCREENS ============ */
  .screen{flex:1; overflow-y:auto; display:none; padding:20px;}
  .screen.active{display:block;}
  .screen.no-pad{padding:0; overflow:hidden; display:none;}
  .screen.no-pad.active{display:flex; flex-direction:column;}

  /* ============ HOME ============ */
  .home-wrap{
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; min-height:100%; text-align:center; gap:10px;
  }
  .home-wrap .icon-big{font-size:80px; margin-bottom:10px;}
  .home-wrap h2{font-size:22px; margin:0 0 30px;}
  .menu-btn{
    width:100%; max-width:360px; padding:20px 24px;
    background:var(--surface); border:2px solid transparent;
    border-radius:16px; display:flex; align-items:center; gap:16px;
    color:var(--text); font-size:17px; font-weight:600; cursor:pointer;
    transition:all .15s; margin-bottom:14px;
  }
  .menu-btn:active{transform:scale(.97);}
  .menu-btn .m-icon{font-size:28px;}
  .menu-btn.cam{border-color:var(--danger);}
  .menu-btn.gal{border-color:#448aff;}

  /* ============ CAMERA ============ */
  .cam-preview-wrap{
    flex:1; position:relative; background:#000;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  #camPreview{width:100%; height:100%; object-fit:cover;}
  .cam-controls{
    background:var(--surface); padding:24px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; gap:50px; position:relative;
  }
  .rec-btn{
    width:76px; height:76px; border-radius:50%;
    border:4px solid #fff; background:transparent;
    cursor:pointer; position:relative; transition:all .2s;
  }
  .rec-btn::after{
    content:""; position:absolute; inset:8px; border-radius:50%;
    background:var(--danger); transition:all .2s;
  }
  .rec-btn.recording::after{
    inset:20px; border-radius:8px;
  }
  .icon-btn{
    background:var(--surface2); border:none; color:var(--text);
    width:52px; height:52px; border-radius:50%; font-size:22px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .rec-timer{
    position:absolute; top:-40px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.7); color:#fff; padding:6px 16px;
    border-radius:20px; font-size:14px; display:none; align-items:center; gap:8px;
  }
  .rec-timer.show{display:flex;}
  .rec-dot{width:10px;height:10px;background:var(--danger);border-radius:50%;animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:.2;}}

  /* ============ EDITOR ============ */
  .editor-preview{
    flex:1; position:relative; background:#000; overflow:hidden;
    display:flex; align-items:center; justify-content:center; min-height:0;
  }
  #editVideo{
    max-width:100%; max-height:100%; object-fit:contain;
  }
  .text-overlay{
    position:absolute; color:#fff; font-weight:bold;
    text-shadow:2px 2px 4px rgba(0,0,0,.9);
    white-space:nowrap; user-select:none; cursor:move;
    transform:translate(-50%,-50%);
    padding:2px 6px; border:1px dashed transparent;
  }
  .text-overlay:hover, .text-overlay.selected{border-color:rgba(124,77,255,.8);}
  .editor-panel{
    background:var(--surface); flex-shrink:0; max-height:52%; overflow-y:auto;
    padding:16px; border-top:1px solid #333;
  }
  .editor-actions{
    display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;
  }
  .action-btn{
    flex:1; min-width:130px; padding:12px; border-radius:12px;
    background:var(--primary); border:none; color:#fff; font-size:14px;
    font-weight:600; cursor:pointer; display:flex; align-items:center;
    justify-content:center; gap:8px; transition:all .15s;
  }
  .action-btn:active{transform:scale(.96);}
  .action-btn.sec{background:var(--surface2);}

  /* Trim */
  .trim-section{margin-bottom:16px;}
  .trim-label{
    display:flex; justify-content:space-between;
    font-size:13px; color:var(--text-dim); margin-bottom:8px;
  }
  .trim-track{
    position:relative; height:44px; background:#333;
    border-radius:8px; overflow:hidden; margin-bottom:8px;
  }
  .trim-selection{
    position:absolute; top:0; bottom:0;
    background:rgba(124,77,255,.4); border-left:3px solid var(--primary);
    border-right:3px solid var(--primary); pointer-events:none;
  }
  .trim-handle{
    position:absolute; top:0; width:20px; height:100%;
    background:var(--primary); cursor:ew-resize; z-index:2;
    display:flex; align-items:center; justify-content:center;
  }
  .trim-handle::after{
    content:""; width:4px; height:20px;
    background:rgba(255,255,255,.7); border-radius:2px;
  }
  .trim-handle.left{left:0; border-radius:8px 0 0 8px;}
  .trim-handle.right{right:0; border-radius:0 8px 8px 0;}
  .trim-info{
    display:flex; justify-content:space-between;
    font-size:12px; color:var(--text-dim);
  }
  .trim-info .range{color:var(--primary); font-weight:600;}

  /* Text overlay list */
  .overlay-list{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
  .overlay-chip{
    background:var(--surface2); padding:8px 12px; border-radius:20px;
    font-size:13px; display:flex; align-items:center; gap:8px;
  }
  .overlay-chip button{
    background:none; border:none; color:var(--danger);
    font-size:16px; cursor:pointer; padding:0; line-height:1;
  }

  /* ============ MODAL ============ */
  .modal-bg{
    position:fixed; inset:0; background:rgba(0,0,0,.75);
    display:none; align-items:center; justify-content:center;
    padding:20px; z-index:100;
  }
  .modal-bg.show{display:flex;}
  .modal{
    background:var(--surface); border-radius:20px; padding:24px;
    width:100%; max-width:420px; max-height:85vh; overflow-y:auto;
  }
  .modal h3{margin:0 0 18px; font-size:18px;}
  .form-group{margin-bottom:14px;}
  .form-group label{
    display:block; font-size:13px; color:var(--text-dim); margin-bottom:6px;
  }
  .form-group input[type=text], .form-group input[type=number],
  .form-group textarea, .form-group select{
    width:100%; padding:12px 14px; background:var(--surface2);
    border:1px solid #444; border-radius:10px; color:var(--text);
    font-size:15px; font-family:inherit; outline:none;
  }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus{
    border-color:var(--primary);
  }
  .form-group textarea{resize:vertical; min-height:80px;}
  .color-picker{display:flex; gap:10px; flex-wrap:wrap;}
  .color-swatch{
    width:38px; height:38px; border-radius:50%; cursor:pointer;
    border:3px solid transparent; transition:all .15s;
  }
  .color-swatch.selected{border-color:var(--primary); transform:scale(1.1);}
  .modal-actions{display:flex; gap:10px; margin-top:20px;}
  .modal-actions button{
    flex:1; padding:14px; border-radius:12px; border:none;
    font-size:15px; font-weight:600; cursor:pointer;
  }
  .modal-actions .btn-cancel{background:var(--surface2); color:var(--text);}
  .modal-actions .btn-ok{background:var(--primary); color:#fff;}

  /* Music list */
  .music-item{
    display:flex; align-items:center; gap:14px; padding:14px;
    background:var(--surface2); border-radius:12px; margin-bottom:10px;
    cursor:pointer; transition:all .15s;
  }
  .music-item:active{transform:scale(.98);}
  .music-item.selected{border:2px solid var(--primary); background:rgba(124,77,255,.15);}
  .music-item .m-play{font-size:24px;}

  /* ============ PUBLISH ============ */
  .publish-wrap{padding:20px; max-width:500px; margin:0 auto; width:100%;}
  .publish-thumb{
    width:100%; aspect-ratio:16/9; background:#000; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    font-size:56px; margin-bottom:10px;
  }
  .publish-meta{
    font-size:12px; color:var(--text-dim); margin-bottom:20px;
    display:flex; gap:14px; flex-wrap:wrap;
  }
  .btn-publish{
    width:100%; padding:16px; border-radius:14px; border:none;
    background:var(--primary); color:#fff; font-size:16px;
    font-weight:700; cursor:pointer; margin-top:10px;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .btn-publish:disabled{opacity:.5; cursor:not-allowed;}
  .progress-bar{
    height:8px; background:var(--surface2); border-radius:4px;
    overflow:hidden; margin:16px 0 8px;
  }
  .progress-fill{
    height:100%; width:0%; background:var(--primary);
    border-radius:4px; transition:width .2s;
  }

  /* ============ TOAST ============ */
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(120px);
    background:var(--surface2); color:#fff; padding:14px 22px;
    border-radius:12px; font-size:14px; z-index:200;
    transition:transform .3s; max-width:90%; text-align:center;
    box-shadow:0 6px 20px rgba(0,0,0,.4);
  }
  .toast.show{transform:translateX(-50%) translateY(0);}
  .toast.err{background:#b71c1c;}
  .toast.ok{background:#2e7d32;}

  /* Gallery upload zone */
  .upload-zone{
    border:2px dashed #555; border-radius:16px; padding:60px 20px;
    text-align:center; cursor:pointer; transition:all .15s;
  }
  .upload-zone:active{border-color:var(--primary); background:rgba(124,77,255,.05);}
  .upload-zone .uz-icon{font-size:64px; margin-bottom:16px;}
</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header>
  <div class="logo">
    <button class="back-btn" id="backBtn" onclick="goBack()">←</button>
    <h1>🎬 VideoStream Studio</h1>
  </div>
</header>

<!-- ============ HOME ============ -->
<div class="screen active" id="screen-home">
  <div class="home-wrap">
    <div class="icon-big">🎥</div>
    <h2>Buat Video Keren Kamu</h2>
    <button class="menu-btn cam" onclick="openCamera()">
      <span class="m-icon">📹</span> Rekam Video
    </button>
    <button class="menu-btn gal" onclick="pickFromGallery()">
      <span class="m-icon">🖼️</span> Pilih dari Galeri
    </button>
  </div>
</div>

<!-- ============ CAMERA ============ -->
<div class="screen no-pad" id="screen-camera">
  <div class="cam-preview-wrap">
    <video id="camPreview" autoplay playsinline muted></video>
  </div>
  <div class="cam-controls">
    <div class="rec-timer" id="recTimer">
      <span class="rec-dot"></span><span id="recTimerText">00:00</span>
    </div>
    <button class="icon-btn" onclick="toggleCameraFacing()" title="Ganti Kamera">🔄</button>
    <button class="rec-btn" id="recBtn" onclick="toggleRecording()"></button>
    <button class="icon-btn" onclick="toggleCamMute()" id="camMuteBtn" title="Mute">🔊</button>
  </div>
  <input type="file" id="galleryInput" accept="video/*" style="display:none">
</div>

<!-- ============ GALLERY ============ -->
<div class="screen" id="screen-gallery">
  <div class="upload-zone" onclick="pickFromGallery()">
    <div class="uz-icon">🖼️</div>
    <div style="font-size:17px; font-weight:600;">Pilih Video dari Galeri</div>
    <div style="color:var(--text-dim); font-size:13px; margin-top:8px;">Ketuk untuk membuka galeri</div>
  </div>
</div>

<!-- ============ EDITOR ============ -->
<div class="screen no-pad" id="screen-editor">
  <div class="editor-preview" id="editorPreview">
    <video id="editVideo" playsinline></video>
    <div id="overlayLayer" style="position:absolute; inset:0; pointer-events:none;"></div>
    <button class="icon-btn" id="playPauseBtn" onclick="togglePlayPause()"
      style="position:absolute; bottom:12px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.6);">
      ▶️
    </button>
  </div>
  <div class="editor-panel">
    <!-- Trim -->
    <div class="trim-section">
      <div class="trim-label">
        <span>✂️ Trim Durasi Video</span>
        <span id="trimCurrent" class="range" style="color:var(--primary); font-weight:600;">00:00 - 00:00</span>
      </div>
      <div class="trim-track" id="trimTrack">
        <div class="trim-selection" id="trimSelection"></div>
        <div class="trim-handle left" id="trimLeft" style="left:0;"></div>
        <div class="trim-handle right" id="trimRight" style="right:0;"></div>
      </div>
      <div class="trim-info">
        <span id="trimMin">Min: 00:03</span>
        <span id="trimDur">Durasi dipilih: 00:00</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="editor-actions">
      <button class="action-btn" onclick="openTextModal()">📝 Tambah Text</button>
      <button class="action-btn sec" onclick="openMusicModal()">🎵 Musik</button>
    </div>

    <!-- Overlay chips -->
    <div class="overlay-list" id="overlayList"></div>

    <!-- Next -->
    <button class="btn-publish" onclick="goToPublish()">
      ☁️ Lanjut ke Publish
    </button>
  </div>
</div>

<!-- ============ PUBLISH ============ -->
<div class="screen no-pad" id="screen-publish">
  <div class="publish-wrap">
    <div class="publish-thumb">🎞️</div>
    <div class="publish-meta">
      <span id="pubFile">📁 video.mp4</span>
      <span id="pubDuration">⏱️ 00:00</span>
      <span id="pubTexts">📝 0 text</span>
      <span id="pubMusic">🎵 -</span>
    </div>

    <div class="form-group">
      <label>Judul Video *</label>
      <input type="text" id="pubTitle" maxlength="100" placeholder="Judul menarik...">
    </div>
    <div class="form-group">
      <label>Deskripsi</label>
      <textarea id="pubDesc" maxlength="500" placeholder="Ceritakan tentang video ini..."></textarea>
    </div>

    <div class="progress-bar" id="uploadProgressWrap" style="display:none;">
      <div class="progress-fill" id="uploadProgress"></div>
    </div>
    <div id="uploadStatus" style="display:none; font-size:13px; color:var(--text-dim); text-align:center;"></div>

    <button class="btn-publish" id="publishBtn" onclick="publishVideo()">
      ☁️ Publish Sekarang
    </button>
  </div>
</div>

<!-- ============ MODAL: TEXT ============ -->
<div class="modal-bg" id="textModal">
  <div class="modal">
    <h3>📝 Tambah Text Overlay</h3>
    <div class="form-group">
      <label>Teks</label>
      <input type="text" id="txtContent" maxlength="80" placeholder="Tulis teks...">
    </div>
    <div class="form-group">
      <label>Ukuran Font</label>
      <input type="number" id="txtSize" value="28" min="10" max="120">
    </div>
    <div class="form-group">
      <label>Font</label>
      <select id="txtFont">
        <option value="sans-serif">Sans Serif</option>
        <option value="serif">Serif</option>
        <option value="monospace">Monospace</option>
        <option value="'Comic Sans MS', cursive">Comic</option>
        <option value="Impact, sans-serif">Impact</option>
      </select>
    </div>
    <div class="form-group">
      <label>Warna</label>
      <div class="color-picker" id="txtColors"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('textModal')">Batal</button>
      <button class="btn-ok" onclick="addTextOverlay()">Tambah</button>
    </div>
  </div>
</div>

<!-- ============ MODAL: MUSIC ============ -->
<div class="modal-bg" id="musicModal">
  <div class="modal">
    <h3>🎵 Pilih Musik Background</h3>
    <div id="musicList"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeMusicModal()">Tutup</button>
    </div>
  </div>
</div>

<!-- ============ TOAST ============ -->
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   STATE GLOBAL
   ============================================================ */
const state = {
  currentScreen: 'home',
  history: [],
  // camera
  camStream: null,
  camFacing: 'environment',
  mediaRecorder: null,
  recordedChunks: [],
  isRecording: false,
  recordingStartTime: 0,
  recTimerInterval: null,
  camMuted: true,
  // video
  videoBlob: null,
  videoURL: null,
  videoDuration: 0,
  trimStart: 0,
  trimEnd: 0,
  // overlays
  textOverlays: [],
  // music
  musicPath: null,
  musicAudio: null,
  musicName: null,
  // publish
  publishedVideos: []
};

/* ============================================================
   NAVIGASI
   ============================================================ */
function showScreen(name, addHistory = true) {
  if (addHistory && state.currentScreen !== name) {
    state.history.push(state.currentScreen);
  }
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById('screen-' + name);
  if (el) el.classList.add('active');
  state.currentScreen = name;

  const backBtn = document.getElementById('backBtn');
  backBtn.style.display = name === 'home' ? 'none' : 'block';
}

function goBack() {
  // cleanup per screen
  if (state.currentScreen === 'camera') stopCamera();
  if (state.currentScreen === 'editor') {
    pauseEditVideo();
    stopMusic();
  }
  if (state.currentScreen === 'publish') stopMusic();

  const prev = state.history.pop() || 'home';
  showScreen(prev, false);
}

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer;
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

/* ============================================================
   KAMERA
   ============================================================ */
async function openCamera() {
  showScreen('camera');
  await startCamera();
}

async function startCamera() {
  try {
    if (state.camStream) {
      state.camStream.getTracks().forEach(t => t.stop());
    }
    state.camStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: state.camFacing,
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: !state.camMuted
    });
    const video = document.getElementById('camPreview');
    video.srcObject = state.camStream;
    video.muted = true; // selalu mute preview agar tidak feedback
    await video.play();
  } catch (err) {
    console.error(err);
    showToast('Gagal membuka kamera: ' + err.message, 'err');
    goBack();
  }
}

function stopCamera() {
  if (state.camStream) {
    state.camStream.getTracks().forEach(t => t.stop());
    state.camStream = null;
  }
  if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') {
    state.mediaRecorder.stop();
  }
  clearInterval(state.recTimerInterval);
  state.isRecording = false;
  document.getElementById('recBtn').classList.remove('recording');
  document.getElementById('recTimer').classList.remove('show');
}

async function toggleCameraFacing() {
  if (state.isRecording) {
    showToast('Stop rekaman dulu sebelum ganti kamera', 'err');
    return;
  }
  state.camFacing = state.camFacing === 'environment' ? 'user' : 'environment';
  await startCamera();
}

function toggleCamMute() {
  state.camMuted = !state.camMuted;
  document.getElementById('camMuteBtn').textContent = state.camMuted ? '🔇' : '🔊';
  // restart stream untuk terapkan audio
  if (!state.isRecording) startCamera();
}

function toggleRecording() {
  if (state.isRecording) {
    stopRecording();
  } else {
    startRecording();
  }
}

function startRecording() {
  if (!state.camStream) return;
  state.recordedChunks = [];
  const options = { mimeType: 'video/webm;codecs=vp9,opus' };
  try {
    state.mediaRecorder = new MediaRecorder(state.camStream, options);
  } catch (e) {
    try {
      state.mediaRecorder = new MediaRecorder(state.camStream, { mimeType: 'video/webm' });
    } catch (e2) {
      state.mediaRecorder = new MediaRecorder(state.camStream);
    }
  }
  state.mediaRecorder.ondataavailable = e => {
    if (e.data && e.data.size > 0) state.recordedChunks.push(e.data);
  };
  state.mediaRecorder.onstop = () => {
    const blob = new Blob(state.recordedChunks, { type: 'video/webm' });
    handleNewVideo(blob, 'rekaman_' + Date.now() + '.webm');
  };
  state.mediaRecorder.start();
  state.isRecording = true;
  state.recordingStartTime = Date.now();
  document.getElementById('recBtn').classList.add('recording');
  document.getElementById('recTimer').classList.add('show');

  state.recTimerInterval = setInterval(() => {
    const s = Math.floor((Date.now() - state.recordingStartTime) / 1000);
    document.getElementById('recTimerText').textContent = formatTime(s);
  }, 250);
}

function stopRecording() {
  if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') {
    state.mediaRecorder.stop();
  }
  state.isRecording = false;
  clearInterval(state.recTimerInterval);
  document.getElementById('recBtn').classList.remove('recording');
  document.getElementById('recTimer').classList.remove('show');
}

/* ============================================================
   GALERI
   ============================================================ */
function pickFromGallery() {
  const input = document.getElementById('galleryInput');
  input.value = '';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    handleNewVideo(file, file.name);
  };
  input.click();
}

/* ============================================================
   HANDLE VIDEO BARU → MASUK EDITOR
   ============================================================ */
function handleNewVideo(blob, filename) {
  if (state.videoURL) URL.revokeObjectURL(state.videoURL);
  state.videoBlob = blob;
  state.videoURL = URL.createObjectURL(blob);
  state.videoFilename = filename;
  state.textOverlays = [];
  state.musicPath = null;
  state.musicName = null;

  const v = document.getElementById('editVideo');
  v.src = state.videoURL;
  v.onloadedmetadata = () => {
    state.videoDuration = v.duration;
    state.trimStart = 0;
    state.trimEnd = v.duration;
    initTrimUI();
    renderOverlays();
    showScreen('editor');
    v.currentTime = 0;
    v.play();
    updatePlayPauseBtn();
  };
  v.onerror = () => showToast('Format video tidak didukung browser', 'err');
}

/* ============================================================
   TRIM SLIDER
   ============================================================ */
function initTrimUI() {
  const track = document.getElementById('trimTrack');
  const sel = document.getElementById('trimSelection');
  const left = document.getElementById('trimLeft');
  const right = document.getElementById('trimRight');

  // reset posisi
  left.style.left = '0px';
  right.style.right = '0px';
  updateSelection();

  function updateSelection() {
    const w = track.clientWidth;
    const s = (state.trimStart / state.videoDuration) * w;
    const e = (state.trimEnd / state.videoDuration) * w;
    sel.style.left = s + 'px';
    sel.style.width = Math.max(0, e - s) + 'px';
    document.getElementById('trimCurrent').textContent =
      formatTime(state.trimStart) + ' - ' + formatTime(state.trimEnd);
    document.getElementById('trimDur').textContent =
      'Durasi dipilih: ' + formatTime(state.trimEnd - state.trimStart);
    document.getElementById('trimMin').textContent =
      'Min: 00:03 / Max: ' + formatTime(state.videoDuration);
  }
  updateSelection();

  let dragging = null;

  function onStart(side) {
    return e => {
      e.preventDefault();
      dragging = side;
    };
  }
  function onMove(e) {
    if (!dragging) return;
    e.preventDefault();
    const rect = track.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const ratio = Math.max(0, Math.min(1, x / rect.width));
    const time = ratio * state.videoDuration;
    const minDur = 3;

    if (dragging === 'left') {
      const maxAllowed = state.trimEnd - minDur;
      state.trimStart = Math.min(Math.max(0, time), maxAllowed);
    } else {
      const minAllowed = state.trimStart + minDur;
      state.trimEnd = Math.max(Math.min(state.videoDuration, time), minAllowed);
    }
    updateSelection();
  }
  function onEnd() { dragging = null; }

  // bersihkan listener lama
  left.onmousedown = left.ontouchstart = onStart('left');
  right.onmousedown = right.ontouchstart = onStart('right');
  document.onmousemove = onMove;
  document.ontouchmove = onMove;
  document.onmouseup = onEnd;
  document.ontouchend = onEnd;
}

/* ============================================================
   EDITOR — PLAY/PAUSE
   ============================================================ */
function togglePlayPause() {
  const v = document.getElementById('editVideo');
  if (v.paused) { v.play(); } else { v.pause(); }
  updatePlayPauseBtn();
}
function updatePlayPauseBtn() {
  const v = document.getElementById('editVideo');
  document.getElementById('playPauseBtn').textContent = v.paused ? '▶️' : '⏸️';
}
function pauseEditVideo() {
  const v = document.getElementById('editVideo');
  v.pause();
  updatePlayPauseBtn();
}

/* ============================================================
   TEXT OVERLAY
   ============================================================ */
let selectedTextColor = 0xFFFFFF;

function openTextModal() {
  document.getElementById('txtContent').value = '';
  document.getElementById('txtSize').value = '28';
  document.getElementById('txtFont').value = 'sans-serif';
  renderColorPicker();
  document.getElementById('textModal').classList.add('show');
  setTimeout(() => document.getElementById('txtContent').focus(), 100);
}

function renderColorPicker() {
  const colors = ['#ffffff', '#ffff00', '#ff5252', '#00e5ff', '#69f0ae', '#ff4081'];
  const wrap = document.getElementById('txtColors');
  wrap.innerHTML = '';
  colors.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (c === '#ffffff' ? ' selected' : '');
    sw.style.background = c;
    sw.onclick = () => {
      document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
      sw.classList.add('selected');
    };
    wrap.appendChild(sw);
  });
}

function addTextOverlay() {
  const text = document.getElementById('txtContent').value.trim();
  if (!text) { showToast('Teks tidak boleh kosong', 'err'); return; }
  const size = parseInt(document.getElementById('txtSize').value) || 28;
  const font = document.getElementById('txtFont').value;
  const colorEl = document.querySelector('.color-swatch.selected');
  const color = colorEl ? colorEl.style.background : '#ffffff';

  state.textOverlays.push({
    id: Date.now(),
    text, size, font, color,
    x: 0.5, y: 0.5, // relatif 0-1
  });
  closeModal('textModal');
  renderOverlays();
  renderOverlayList();
}

function renderOverlays() {
  const layer = document.getElementById('overlayLayer');
  layer.innerHTML = '';
  layer.style.pointerEvents = 'none';
  state.textOverlays.forEach((t, idx) => {
    const el = document.createElement('div');
    el.className = 'text-overlay';
    el.textContent = t.text;
    el.style.left = (t.x * 100) + '%';
    el.style.top = (t.y * 100) + '%';
    el.style.fontSize = t.size + 'px';
    el.style.fontFamily = t.font;
    el.style.color = t.color;
    el.dataset.idx = idx;
    el.style.pointerEvents = 'auto';
    makeDraggable(el, idx);
    layer.appendChild(el);
  });
}

function makeDraggable(el, idx) {
  let dragging = false, offsetX = 0, offsetY = 0;
  const parent = document.getElementById('editorPreview');

  function start(e) {
    e.preventDefault();
    dragging = true;
    el.classList.add('selected');
  }
  function move(e) {
    if (!dragging) return;
    e.preventDefault();
    const rect = parent.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX);
    const cy = (e.touches ? e.touches[0].clientY : e.clientY);
    let x = (cx - rect.left) / rect.width;
    let y = (cy - rect.top) / rect.height;
    x = Math.max(0.03, Math.min(0.97, x));
    y = Math.max(0.05, Math.min(0.95, y));
    state.textOverlays[idx].x = x;
    state.textOverlays[idx].y = y;
    el.style.left = (x * 100) + '%';
    el.style.top = (y * 100) + '%';
  }
  function end() {
    dragging = false;
    el.classList.remove('selected');
  }

  el.onmousedown = el.ontouchstart = start;
  document.addEventListener('mousemove', move);
  document.addEventListener('touchmove', move, { passive: false });
  document.addEventListener('mouseup', end);
  document.addEventListener('touchend', end);
}

function renderOverlayList() {
  const list = document.getElementById('overlayList');
  list.innerHTML = '';
  state.textOverlays.forEach((t, idx) => {
    const chip = document.createElement('div');
    chip.className = 'overlay-chip';
    chip.innerHTML = `<span>"${escapeHtml(t.text)}"</span>`;
    const btn = document.createElement('button');
    btn.textContent = '✕';
    btn.onclick = () => {
      state.textOverlays.splice(idx, 1);
      renderOverlays();
      renderOverlayList();
    };
    chip.appendChild(btn);
    list.appendChild(chip);
  });
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   MUSIK — pakai Web Audio API synth (tanpa file eksternal)
   ============================================================ */
const MUSIC_TRACKS = [
  { id: 'chill',     name: 'Chill Vibes',   notes: [261.63, 329.63, 392.00, 329.63], tempo: 400 },
  { id: 'energetic', name: 'Energetic',     notes: [440.00, 523.25, 659.25, 523.25], tempo: 220 },
  { id: 'ambient',   name: 'Ambient Pad',   notes: [196.00, 246.94, 293.66, 246.94], tempo: 700 },
  { id: 'happy',     name: 'Happy Tune',    notes: [523.25, 659.25, 783.99, 659.25], tempo: 300 },
];

let audioCtx = null;
let musicLoopTimer = null;

function openMusicModal() {
  const list = document.getElementById('musicList');
  list.innerHTML = '';

  // opsi tanpa musik
  const none = document.createElement('div');
  none.className = 'music-item' + (state.musicPath === null ? ' selected' : '');
  none.innerHTML = '<span class="m-play">🚫</span><span>Tanpa Musik</span>';
  none.onclick = () => { stopMusic(); state.musicPath = null; state.musicName = null; closeMusicModal(); };
  list.appendChild(none);

  MUSIC_TRACKS.forEach(track => {
    const item = document.createElement('div');
    item.className = 'music-item' + (state.musicPath === track.id ? ' selected' : '');
    item.innerHTML = `<span class="m-play">🎵</span><span>${track.name}</span>`;
    item.onclick = () => {
      selectMusic(track);
      closeMusicModal();
    };
    list.appendChild(item);
  });

  document.getElementById('musicModal').classList.add('show');
}

function closeMusicModal() {
  document.getElementById('musicModal').classList.remove('show');
}

function selectMusic(track) {
  stopMusic();
  state.musicPath = track.id;
  state.musicName = track.name;
  playMusicLoop(track);
  showToast('Musik: ' + track.name, 'ok');
}

function playMusicLoop(track) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  let idx = 0;
  function playNote() {
    if (state.musicPath !== track.id) return;
    const freq = track.notes[idx % track.notes.length];
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.08, audioCtx.currentTime + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + track.tempo / 1000);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + track.tempo / 1000);
    idx++;
    musicLoopTimer = setTimeout(playNote, track.tempo);
  }
  playNote();
}

function stopMusic() {
  clearTimeout(musicLoopTimer);
  musicLoopTimer = null;
}

/* ============================================================
   PUBLISH
   ============================================================ */
function goToPublish() {
  pauseEditVideo();

  document.getElementById('pubFile').textContent =
    '📁 ' + (state.videoFilename || 'video.webm');
  document.getElementById('pubDuration').textContent =
    '⏱️ ' + formatTime(state.trimEnd - state.trimStart);
  document.getElementById('pubTexts').textContent =
    '📝 ' + state.textOverlays.length + ' text';
  document.getElementById('pubMusic').textContent =
    '🎵 ' + (state.musicName || '-');

  document.getElementById('pubTitle').value = '';
  document.getElementById('pubDesc').value = '';
  document.getElementById('uploadProgressWrap').style.display = 'none';
  document.getElementById('uploadStatus').style.display = 'none';
  document.getElementById('uploadProgress').style.width = '0%';
  document.getElementById('publishBtn').disabled = false;

  showScreen('publish');
}

async function publishVideo() {
  const title = document.getElementById('pubTitle').value.trim();
  if (!title) { showToast('Judul wajib diisi', 'err'); return; }

  const btn = document.getElementById('publishBtn');
  const wrap = document.getElementById('uploadProgressWrap');
  const fill = document.getElementById('uploadProgress');
  const status = document.getElementById('uploadStatus');
  btn.disabled = true;
  wrap.style.display = 'block';
  status.style.display = 'block';

  // Simulasi upload (progress)
  status.textContent = 'Menyiapkan metadata...';
  await sleep(300);

  const payload = {
    id: 'vid_' + Date.now(),
    title,
    description: document.getElementById('pubDesc').value.trim(),
    filename: state.videoFilename,
    size: state.videoBlob ? state.videoBlob.size : 0,
    duration: state.trimEnd - state.trimStart,
    trimStart: state.trimStart,
    trimEnd: state.trimEnd,
    textOverlays: state.textOverlays,
    music: state.musicPath,
    createdAt: new Date().toISOString(),
  };

  // Simulasi progress upload
  for (let p = 0; p <= 100; p += 5) {
    fill.style.width = p + '%';
    status.textContent = `Mengupload... ${p}%`;
    await sleep(80);
  }

  // Simpan ke localStorage (simulasi database)
  try {
    const list = JSON.parse(localStorage.getItem('publishedVideos') || '[]');
    list.unshift(payload);
    localStorage.setItem('publishedVideos', JSON.stringify(list));
  } catch (e) { /* quota exceeded - ignore */ }

  status.textContent = '✅ Berhasil dipublish!';
  showToast('Video berhasil dipublish! 🎉', 'ok');
  await sleep(1200);

  resetToHome();
}

function resetToHome() {
  stopMusic();
  if (state.videoURL) { URL.revokeObjectURL(state.videoURL); state.videoURL = null; }
  state.videoBlob = null;
  state.textOverlays = [];
  state.musicPath = null;
  state.musicName = null;
  state.history = [];
  showScreen('home', false);
}

/* ============================================================
   UTIL
   ============================================================ */
function formatTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  const m = String(Math.floor(sec / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  return `${m}:${s}`;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

/* klik background modal untuk close */
document.querySelectorAll('.modal-bg').forEach(m => {
  m.addEventListener('click', e => {
    if (e.target === m) m.classList.remove('show');
  });
});

/* esc untuk close modal */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-bg.show').forEach(m => m.classList.remove('show'));
  }
});

/* cleanup saat halaman ditutup */
window.addEventListener('beforeunload', () => {
  stopCamera();
  stopMusic();
});

/* update tombol play/pause saat video berubah */
document.getElementById('editVideo').addEventListener('play', updatePlayPauseBtn);
document.getElementById('editVideo').addEventListener('pause', updatePlayPauseBtn);

/* inisialisasi */
window.addEventListener('load', () => {
  showScreen('home', false);
});
