<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>VidStream Pro — Ultimate Camera</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  body { background:#000; color:#fff; overflow-x:hidden; }
  .hidden { display:none !important; }

  /* ===== NAVBAR ===== */
  .navbar {
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 12px;
    background:linear-gradient(180deg,rgba(0,0,0,0.95),transparent);
    backdrop-filter:blur(10px);
  }
  .logo {
    font-size:1.1rem; font-weight:bold; line-height:1.1;
    background:linear-gradient(90deg,#ff0050,#ff8a00);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .nav-buttons { display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
  .nav-btn {
    background:#2a2a2a; border:1px solid #444; color:#fff;
    padding:8px; border-radius:50%; font-size:1rem;
    cursor:pointer; transition:0.2s; display:flex;
    justify-content:center; align-items:center;
    width:36px; height:36px;
  }
  .nav-btn.feed-icon { color:#ff0050; }
  .nav-btn.grid-icon { color:#f7b733; }
  .nav-btn.live-icon { color:#ff0000; background:#3a0000; border-color:#ff0000; }
  .nav-btn.upload-icon { color:#00c853; }
  .nav-btn.active { background:linear-gradient(135deg,#ff8a00,#ff0050); color:#fff; border-color:#ff8a00; box-shadow:0 0 10px rgba(255,138,0,0.5); }
  .nav-btn.coin-btn {
    background:linear-gradient(135deg,#f7b733,#fc4a1a);
    border:none; font-weight:bold; border-radius:20px; 
    width:auto; padding:8px 12px; font-size:0.85rem; gap:4px; color:#fff;
  }

  /* ===== FEED ===== */
  .feed-container {
    height:100vh; overflow-y:scroll; scroll-snap-type:y mandatory;
    scrollbar-width:none; padding-bottom:0;
  }
  .feed-container::-webkit-scrollbar { display:none; }
  .video-card {
    position:relative; height:100vh; width:100%;
    scroll-snap-align:start; display:flex; justify-content:center; align-items:center;
    background:#000; overflow:hidden;
  }
  .video-card video { width:100%; height:100%; object-fit:cover; transition: filter 0.3s ease; }
  
  /* OVERLAY TEXT (FINAL RENDER) */
  .video-text-overlay {
    position:absolute; z-index:2; text-align:center; width:auto;
    font-weight:bold; text-shadow:0 2px 8px rgba(0,0,0,0.9), 0 0 4px rgba(0,0,0,0.8);
    pointer-events:none; white-space:nowrap;
  }

  .video-info {
    position:absolute; bottom:80px; left:16px; right:80px;
    z-index:2; text-shadow:0 2px 8px rgba(0,0,0,0.8);
  }
  .user-row { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .video-info .username { font-weight:bold; font-size:1rem; }
  .follow-btn {
    background:transparent; border:1px solid #fff; color:#fff;
    padding:4px 10px; border-radius:12px; font-size:0.7rem;
    font-weight:bold; cursor:pointer; transition:0.2s;
  }
  .follow-btn.followed { background:#fff; color:#000; }
  
  .video-info .caption { font-size:0.85rem; opacity:0.9; line-height:1.3; }
  
  .music-info {
    display:flex; align-items:center; gap:6px;
    font-size:0.75rem; margin-top:8px; color:#fff;
    background:rgba(0,0,0,0.6); padding:4px 10px;
    border-radius:12px; width:fit-content;
    backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,0.2);
  }
  .marquee { width:150px; overflow:hidden; white-space:nowrap; }
  .marquee span { display:inline-block; padding-left:100%; animation: marquee 8s linear infinite; }
  @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

  .side-actions {
    position:absolute; right:12px; bottom:110px;
    display:flex; flex-direction:column; gap:16px; z-index:2;
  }
  .action-btn {
    background:none; border:none; color:#fff; font-size:1.4rem;
    cursor:pointer; display:flex; flex-direction:column;
    align-items:center; gap:2px; transition:transform 0.15s;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }
  .action-btn:active { transform:scale(0.85); }
  .action-btn span { font-size:0.65rem; margin-top:2px; font-weight:600; }
  
  .mute-btn {
    position:absolute; top:70px; right:16px; z-index:3;
    background:rgba(0,0,0,0.5); border:none; color:#fff;
    width:36px; height:36px; border-radius:50%;
    cursor:pointer; font-size:1.2rem; display:flex;
    justify-content:center; align-items:center; backdrop-filter:blur(4px);
  }

  .play-indicator {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    font-size:4rem; opacity:0; pointer-events:none; transition:opacity 0.3s;
  }
  .play-indicator.show { opacity:0.8; }

  .progress-bar {
    position:absolute; bottom:60px; left:0; right:0; height:3px; background:rgba(255,255,255,0.2);
  }
  .progress-fill { height:100%; background:#ff0050; width:0%; transition:width 0.1s linear; }

  /* ===== GRID & MODAL UMUM ===== */
  .grid-container { padding:80px 16px 40px; min-height:100vh; }
  .grid-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .grid-item { position:relative; border-radius:8px; overflow:hidden; cursor:pointer; aspect-ratio:2/3; background:#111; transition:transform 0.2s; }
  .grid-item video { width:100%; height:100%; object-fit:cover; }
  .grid-item .grid-title { position:absolute; bottom:0; left:0; right:0; padding:20px 8px 8px; font-size:0.75rem; background:linear-gradient(transparent,rgba(0,0,0,0.9)); }

  .modal { position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:200; display:flex; justify-content:center; align-items:center; padding:16px; overflow-y:auto; }
  .modal-content { position:relative; width:100%; max-width:520px; background:#111; border-radius:12px; overflow:hidden; max-height:95vh; display:flex; flex-direction:column; }
  .modal-content video { width:100%; aspect-ratio:9/16; object-fit:contain; background:#000; }
  .close-btn { position:absolute; top:8px; right:8px; z-index:10; background:rgba(0,0,0,0.6); border:none; color:#fff; width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:1rem; }

  /* ===== COMMENT BOTTOM SHEET ===== */
  .comment-sheet {
    position:fixed; bottom:0; left:0; right:0; background:#1a1a1a; border-radius:16px 16px 0 0;
    z-index:300; height:60vh; display:flex; flex-direction:column;
    transform:translateY(100%); transition:transform 0.3s ease; box-shadow:0 -4px 20px rgba(0,0,0,0.5);
  }
  .comment-sheet.show { transform:translateY(0); }
  .comment-header { display:flex; justify-content:space-between; align-items:center; padding:16px; border-bottom:1px solid #333; }
  .comment-header button { background:none; border:none; color:#fff; font-size:1.2rem; cursor:pointer; }
  .comment-list { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:16px; }
  .comment-item { display:flex; gap:12px; }
  .comment-avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#ff0050,#ff8a00); display:flex; justify-content:center; align-items:center; font-weight:bold; font-size:0.8rem; flex-shrink:0; }
  .comment-body .c-user { font-weight:bold; font-size:0.8rem; color:#ccc; margin-bottom:2px; }
  .comment-body .c-text { font-size:0.9rem; line-height:1.3; }
  .comment-input-area { padding:12px 16px; border-top:1px solid #333; display:flex; gap:10px; background:#111; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  .comment-input-area input { flex:1; background:#222; border:1px solid #444; border-radius:20px; padding:10px 16px; color:#fff; font-size:0.9rem; outline:none; }
  .comment-input-area button { background:#ff0050; border:none; color:#fff; width:40px; height:40px; border-radius:50%; cursor:pointer; font-size:1.2rem; display:flex; justify-content:center; align-items:center; flex-shrink:0; }

  /* ===== UPLOAD & RECORD MODAL ===== */
  .upload-body { padding:20px; overflow-y:auto; height: 100%; display:flex; flex-direction:column;}
  
  /* Tab Selector */
  .tab-selector { display:flex; margin-bottom:16px; background:#222; border-radius:8px; overflow:hidden; flex-shrink:0; }
  .tab-btn { flex:1; padding:10px; background:transparent; border:none; color:#aaa; cursor:pointer; font-weight:bold; transition:0.2s; }
  .tab-btn.active { background:#333; color:#fff; border-bottom:2px solid #ff0050; }

  /* Camera UI */
  .camera-container {
    position:relative; width:100%; aspect-ratio:9/16; background:#000;
    border-radius:12px; overflow:hidden; margin-bottom:16px;
    flex:1; display:flex; justify-content:center; align-items:center;
  }
  .camera-container video { width:100%; height:100%; object-fit:cover; }
  
  .record-btn {
    position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
    width:60px; height:60px; border-radius:50%; background:rgba(255,255,255,0.3);
    border:4px solid #fff; cursor:pointer; z-index:10;
    display:flex; justify-content:center; align-items:center; transition:0.2s;
  }
  .record-btn.recording { background:rgba(255,0,80,0.5); border-color:#ff0050; }
  .record-btn .inner { width:46px; height:46px; border-radius:50%; background:#ff0050; transition:0.2s; }
  .record-btn.recording .inner { border-radius:8px; width:24px; height:24px; background:#fff; }

  /* Tombol Ganti Kamera */
  .flip-cam-btn {
    position:absolute; top:16px; right:16px;
    background:rgba(0,0,0,0.6); border:none; color:#fff;
    width:44px; height:44px; border-radius:50%;
    cursor:pointer; z-index:10; font-size:1.5rem;
    display:flex; justify-content:center; align-items:center;
    backdrop-filter:blur(4px);
  }
  .flip-cam-btn:active { transform:scale(0.9); }

  /* ===== KATALOG LAGU VIEW ===== */
  .music-catalog-view {
    position:absolute; inset:0; background:#111; z-index:10;
    display:flex; flex-direction:column;
    border-radius:12px; overflow:hidden;
  }
  .music-catalog-header {
    display:flex; justify-content:space-between; align-items:center;
    padding:16px; border-bottom:1px solid #333;
  }
  .music-catalog-list {
    flex:1; overflow-y:auto; padding:12px;
  }
  .song-item {
    display:flex; align-items:center; gap:12px;
    background:#1a1a1a; padding:12px; border-radius:8px;
    margin-bottom:8px; cursor:pointer; transition:0.2s;
    border:1px solid transparent;
  }
  .song-item:hover, .song-item.selected {
    background:#222; border-color:#f7b733;
  }
  .song-icon {
    width:40px; height:40px; border-radius:8px;
    background:linear-gradient(135deg,#f7b733,#fc4a1a);
    display:flex; justify-content:center; align-items:center;
    font-size:1.2rem; flex-shrink:0;
  }
  .song-info { flex:1; }
  .song-title { font-weight:bold; font-size:0.9rem; margin-bottom:2px; }
  .song-meta { font-size:0.75rem; color:#aaa; }
  .song-play-btn { background:none; border:none; color:#fff; font-size:1.2rem; cursor:pointer; }

  /* ===== EDITOR OVERLAY UI ===== */
  .editor-controls {
    background:#1a1a1a; border-radius:12px; padding:12px; margin-bottom:16px;
    display:flex; flex-direction:column; gap:10px; border:1px solid #333;
  }
  .editor-controls label { font-size:0.8rem; color:#aaa; font-weight:bold; margin-bottom:2px; display:block; }
  .editor-controls input[type="text"], .editor-controls select {
    width:100%; padding:10px; background:#222; border:1px solid #444;
    border-radius:6px; color:#fff; font-size:0.9rem; outline:none;
  }
  .editor-row { display:flex; gap:10px; }
  .editor-row > div { flex:1; }
  
  .preview-wrapper {
    position:relative; width:100%; margin-bottom:16px;
    border-radius:12px; overflow:hidden; background:#000;
    display:flex; justify-content:center;
  }
  .preview-wrapper video { width:100%; max-height:300px; object-fit:contain; }
  .interactive-text {
    position:absolute; z-index:10; cursor:move;
    padding:4px; border:1px dashed transparent;
    user-select:none; touch-action:none;
    white-space:nowrap; font-weight:bold;
    text-shadow:0 2px 8px rgba(0,0,0,0.9);
  }
  .interactive-text.active { border-color:#ff0050; background:rgba(255,0,80,0.1); }
  .interactive-text .controls {
    position:absolute; bottom:-30px; left:50%; transform:translateX(-50%);
    display:flex; gap:6px; background:#222; padding:4px 8px; border-radius:12px;
    opacity:0; pointer-events:none; transition:0.2s;
  }
  .interactive-text.active .controls { opacity:1; pointer-events:auto; }
  .interactive-text .controls button { background:none; border:none; color:#fff; cursor:pointer; font-size:1rem; }

  .btn-primary {
    width:100%; padding:12px; background:linear-gradient(90deg,#ff0050,#ff8a00);
    border:none; color:#fff; border-radius:8px; font-weight:bold; font-size:0.95rem;
    cursor:pointer; margin-top:8px;
  }
  .btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
  
  .btn-secondary {
    width:100%; padding:12px; background:#333;
    border:1px solid #555; color:#fff; border-radius:8px; font-weight:bold; font-size:0.9rem;
    cursor:pointer; display:flex; justify-content:space-between; align-items:center;
  }
  .btn-secondary .selected-song { color:#f7b733; font-size:0.8rem;}

  .toast {
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px);
    background:#333; color:#fff; padding:12px 20px; border-radius:24px; font-size:0.85rem;
    z-index:500; opacity:0; transition:0.3s; pointer-events:none;
    box-shadow:0 4px 20px rgba(0,0,0,0.5); text-align:center; max-width:90%;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <header class="navbar">
    <div class="logo">🎬 VidStream<br>Pro</div>
    <div class="nav-buttons">
      <button id="btnFeed" class="nav-btn feed-icon active" title="Feed">📱</button>
      <button id="btnGrid" class="nav-btn grid-icon" title="Browse">🍿</button>
      <button id="btnUpload" class="nav-btn upload-icon" title="Buat Video">🎥</button>
      <button id="btnMonet" class="nav-btn coin-btn" title="Monetisasi">💰 <span id="navBalance">0</span></button>
    </div>
  </header>

  <main id="feedView" class="feed-container"></main>
  <main id="gridView" class="grid-container hidden"><div id="gridList" class="grid-list"></div></main>

  <!-- UPLOAD & RECORD MODAL -->
  <div id="uploadModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeUpload" class="close-btn" style="z-index:20;">✕</button>
      
      <!-- HALAMAN 1: PILIH METODE (KAMERA / GALERI) -->
      <div id="pageSelectMethod" class="upload-body">
        <div class="tab-selector">
          <button class="tab-btn active" id="tabRecord">🎥 Rekam Kamera</button>
          <button class="tab-btn" id="tabUpload">📁 Pilih Galeri</button>
        </div>

        <div id="recordSection" style="flex:1; display:flex;">
          <div class="camera-container" id="cameraContainer">
            <video id="liveCamera" autoplay playsinline muted></video>
            <!-- TOMBOL GANTI KAMERA -->
            <button class="flip-cam-btn" id="btnFlipCamera" title="Ganti Kamera Depan/Belakang">🔄</button>
            <!-- TOMBOL REKAM -->
            <button class="record-btn" id="btnRecord"><div class="inner"></div></button>
          </div>
        </div>

        <div id="uploadSection" class="hidden" style="flex:1; display:flex; flex-direction:column; justify-content:center;">
          <div id="dropzone" style="border:2px dashed #444; border-radius:12px; padding:40px 20px; text-align:center; background:#1a1a1a;">
            <div style="font-size:3rem; margin-bottom:10px;">📁</div>
            <p><strong>Tap untuk pilih video dari galeri</strong></p>
            <p style="font-size:0.8rem; color:#aaa; margin-top:4px;">MP4 / WebM / MOV</p>
          </div>
          <input type="file" id="fileInput" accept="video/*" hidden />
        </div>
      </div>

      <!-- HALAMAN 2: EDITOR VIDEO & TEKS -->
      <div id="pageEditor" class="upload-body hidden">
        <div class="preview-wrapper" id="previewWrapper">
          <video id="previewVideo" controls playsinline></video>
          <div id="interactiveText" class="interactive-text hidden" style="top:50%; left:50%; font-size:24px; color:#ffffff; font-family:inherit;">
            Ketik Teks
            <div class="controls">
              <button id="btnTextSmaller">➖</button>
              <button id="btnTextBigger">➕</button>
              <button id="btnTextRotate">🔄</button>
            </div>
          </div>
        </div>

        <div class="editor-controls">
          <div>
            <label>✨ Teks di Video</label>
            <input type="text" id="inputText" placeholder="Ketik teks yang muncul..." value="" />
          </div>
          <div class="editor-row">
            <div>
              <label>Font</label>
              <select id="selectFont">
                <option value="inherit">Default</option>
                <option value="'Courier New', monospace">Monospace</option>
                <option value="Impact, sans-serif">Impact (Tebal)</option>
              </select>
            </div>
            <div>
              <label>Warna</label>
              <select id="selectColor">
                <option value="#ffffff">Putih</option>
                <option value="#ff0050">Merah Muda</option>
                <option value="#f7b733">Kuning</option>
                <option value="#00c853">Hijau</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Tombol Buka Katalog Lagu -->
        <div style="margin-bottom:12px;">
          <button id="btnOpenMusic" class="btn-secondary">
            <span>🎵 Katalog Lagu</span>
            <span class="selected-song" id="displaySelectedMusic">Suara Asli</span>
          </button>
        </div>

        <div class="form-group">
          <label>Username <span style="color:#ff0050">*</span></label>
          <input type="text" id="uploadUsername" placeholder="@username" style="width:100%; padding:10px; background:#1a1a1a; border:1px solid #333; border-radius:8px; color:#fff;" />
        </div>
        <div class="form-group">
          <label>Caption <span style="color:#ff0050">*</span></label>
          <textarea id="uploadCaption" rows="2" placeholder="Tulis caption..." style="width:100%; padding:10px; background:#1a1a1a; border:1px solid #333; border-radius:8px; color:#fff;"></textarea>
        </div>
        
        <button id="btnSubmitUpload" class="btn-primary" disabled>🚀 Publikasikan</button>
      </div>

      <!-- HALAMAN 3: KATALOG LAGU TERPISAH -->
      <div id="pageMusicCatalog" class="music-catalog-view hidden">
        <div class="music-catalog-header">
          <h3 style="font-size:1.1rem;">🎵 Katalog Lagu Viral</h3>
          <button id="btnCloseMusic" style="background:none; border:none; color:#fff; font-size:1.2rem; cursor:pointer;">✕</button>

    </div>
  </div>

  <!-- MONETISASI MODAL -->
  <div id="monetModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeMonet" class="close-btn">✕</button>
      <div style="padding:20px;">
        <h3>💰 Dashboard Monetisasi</h3>
        <div style="background:linear-gradient(135deg,#f7b733,#fc4a1a); border-radius:12px; padding:20px; margin:20px 0; text-align:center;">
          <div style="font-size:0.8rem;">Saldo Koin</div>
          <div style="font-size:2rem; font-weight:bold;">🪙 <span id="coinBalance">0</span></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div style="background:#1a1a1a; padding:14px; border-radius:10px; text-align:center;">
            <div style="font-size:1.3rem; font-weight:bold; color:#ff8a00;" id="statViews">0</div>
            <div style="font-size:0.7rem; color:#aaa;">👀 Views</div>
          </div>
          <div style="background:#1a1a1a; padding:14px; border-radius:10px; text-align:center;">
            <div style="font-size:1.3rem; font-weight:bold; color:#ff8a00;" id="statVideos">0</div>
            <div style="font-size:0.7rem; color:#aaa;">🎬 Video</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

<script>
  const STORAGE_KEY = 'vidstream_v10';
  let state = { coins: 0, views: 0, userVideos: [], comments: {}, likedVideos: {}, followedUsers: {} };

  // INDEXEDDB
  const DB_NAME = 'vidstream_db'; const DB_STORE = 'videos'; let db;
  function initDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = e => { if (!e.target.result.objectStoreNames.contains(DB_STORE)) e.target.result.createObjectStore(DB_STORE, { keyPath: 'id' }); };
      req.onsuccess = e => { db = e.target.result; resolve(); };
      req.onerror = e => reject(e);
    });
  }
  function saveVideoToDB(id, blob) { return new Promise((res, rej) => { const tx = db.transaction(DB_STORE, 'readwrite'); tx.objectStore(DB_STORE).put({ id, blob }).onsuccess = () => res(); tx.onerror = rej; }); }
  function getVideoFromDB(id) { return new Promise((res, rej) => { const tx = db.transaction(DB_STORE, 'readonly'); tx.objectStore(DB_STORE).get(id).onsuccess = e => res(e.target.result ? e.target.result.blob : null); tx.onerror = rej; }); }

  // KATALOG LAGU BEBAS ROYALTI
  const songCatalog = [
    { id: 's1', title: 'DJ Remix Viral', genre: 'EDM / Remix', dur: '0:30', url: 'https://cdn.pixabay.com/audio/2022/03/15/audio_c8c8a73467.mp3' },
    { id: 's2', title: 'Aesthetic Future Bass', genre: 'Chill', dur: '0:45', url: 'https://cdn.pixabay.com/audio/2022/05/27/audio_1808fbf07a.mp3' },
    { id: 's3', title: 'Upbeat Dance Pop', genre: 'Pop', dur: '0:25', url: 'https://cdn.pixabay.com/audio/2021/11/25/audio_91b32e02f9.mp3' },
    { id: 's4', title: 'Funky Groove Hits', genre: 'Funk', dur: '1:10', url: 'https://cdn.pixabay.com/audio/2022/01/18/audio_d0c6ff1bab.mp3' },
    { id: 's5', title: 'Emotional Cinematic', genre: 'Cinematic', dur: '1:20', url: 'https://cdn.pixabay.com/audio/2022/08/02/audio_884fe92c21.mp3' },
    { id: 's6', title: 'Tropical House Summer', genre: 'House', dur: '0:50', url: 'https://cdn.pixabay.com/audio/2022/10/25/audio_946bc7f5ba.mp3' },
    { id: 's7', title: 'Lo-Fi Chill Beats', genre: 'Lo-Fi', dur: '1:05', url: 'https://cdn.pixabay.com/audio/2021/08/04/audio_0625c1539c.mp3' }
  ];
  let selectedMusicUrl = "";
  let selectedMusicTitle = "Suara Asli";

  const defaultVideos = [
    { id:1, username:"@nature_vibes", caption:"Sunset di pantai 🏖️", src:"https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4", likes:1240, music:"", overlayData: null },
    { id:2, username:"@funny_cat", caption:"Kucing lucu 😹", src:"https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4", likes:892, music:"", overlayData: { text:"Cute Cat!", x:50, y:20, size:30, color:"#f7b733", font:"Impact, sans-serif", rotate:0 } }
  ];
  function getAllVideos() { return [...state.userVideos, ...defaultVideos]; }

  // CAMERA STATE
  let streamRef = null; let mediaRecorder; let recordedChunks = []; let currentFacingMode = 'user'; let pendingFile = null;
  let textState = { x: 50, y: 50, size: 24, rotate: 0 };

  function showToast(msg, type='info') {
    const toast = document.getElementById('toast'); toast.textContent = msg;
    toast.style.background = type === 'success' ? '#00c853' : type === 'error' ? '#ff0050' : '#333';
    toast.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => toast.classList.remove('show'), 2500);
  }

  // ==========================================
  // FUNGSI KAMERA (DEPAN & BELAKANG)
  // ==========================================
  async function startCamera() {
    if (streamRef) { streamRef.getTracks().forEach(t => t.stop()); }
    try {
      streamRef = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: currentFacingMode }, 
        audio: true 
      });
      document.getElementById('liveCamera').srcObject = streamRef;
    } catch (err) {
      showToast('Tidak bisa akses kamera: ' + err.message, 'error');
    }
  }
  function stopCamera() {
    if (streamRef) { streamRef.getTracks().forEach(t => t.stop()); streamRef = null; }
  }

  document.getElementById('btnFlipCamera').addEventListener('click', () => {
    currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
    startCamera();
  });

  document.getElementById('btnRecord').addEventListener('click', () => {
    if (!streamRef) return;
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop(); document.getElementById('btnRecord').classList.remove('recording');
    } else {
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(streamRef);
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        pendingFile = new File([blob], "rekaman.webm", { type: 'video/webm' });
        stopCamera(); showEditorPage();
      };
      mediaRecorder.start(); document.getElementById('btnRecord').classList.add('recording');
      showToast('🔴 Merekam... Tekan lagi untuk berhenti.', 'info');
    }
  });

  // ==========================================
  // LOGIKA KATALOG LAGU TERPISAH
  // ==========================================
  function renderMusicCatalog() {
    const list = document.getElementById('musicList');
    list.innerHTML = `
      <div class="song-item ${selectedMusicUrl === '' ? 'selected' : ''}" data-url="" data-title="Suara Asli">
        <div class="song-icon">🎤</div>
        <div class="song-info"><div class="song-title">Suara Asli Video</div><div class="song-meta">Tanpa musik tambahan</div></div>
      </div>
    ` + songCatalog.map(song => `
      <div class="song-item ${selectedMusicUrl === song.url ? 'selected' : ''}" data-url="${song.url}" data-title="${song.title}">
        <div class="song-icon">🎵</div>
        <div class="song-info">
          <div class="song-title">${song.title}</div>
          <div class="song-meta">${song.genre} • ${song.dur}</div>
        </div>
        <button class="song-play-btn">▶</button>
      </div>
    `).join('');

    // Event Listener Pilih Lagu
    list.querySelectorAll('.song-item').forEach(item => {
      item.addEventListener('click', (e) => {
        if (e.target.classList.contains('song-play-btn')) {
          // Fitur Preview putar lagu
          const url = item.dataset.url;
          if (url) { const audio = new Audio(url); audio.play(); setTimeout(() => audio.pause(), 5000); showToast('Memutar preview 5 detik...', 'info'); }
          else { showToast('Suara asli tidak bisa di-preview', 'info'); }
          return;
        }
        
        selectedMusicUrl = item.dataset.url;
        selectedMusicTitle = item.dataset.title;
        document.getElementById('displaySelectedMusic').textContent = selectedMusicTitle;
        document.getElementById('pageMusicCatalog').classList.add('hidden');
        showToast(`🎵 Lagu dipilih: ${selectedMusicTitle}`, 'success');
      });
    });
  }

  document.getElementById('btnOpenMusic').addEventListener('click', () => {
    renderMusicCatalog();
    document.getElementById('pageMusicCatalog').classList.remove('hidden');
  });
  document.getElementById('btnCloseMusic').addEventListener('click', () => {
    document.getElementById('pageMusicCatalog').classList.add('hidden');
  });

  // ==========================================
  // NAVIGASI HALAMAN UPLOAD
  // ==========================================
  document.getElementById('btnUpload').addEventListener('click', () => {
    document.getElementById('uploadModal').classList.remove('hidden');
    resetUploadForm(); startCamera();
  });
  document.getElementById('closeUpload').addEventListener('click', () => {
    document.getElementById('uploadModal').classList.add('hidden');
    stopCamera(); if (pendingFile) URL.revokeObjectURL(document.getElementById('previewVideo').src);
    resetUploadForm();
  });

  function resetUploadForm() {
    pendingFile = null; selectedMusicUrl = ""; selectedMusicTitle = "Suara Asli";
    document.getElementById('displaySelectedMusic').textContent = selectedMusicTitle;
    document.getElementById('uploadCaption').value = '';
    document.getElementById('uploadUsername').value = '';
    document.getElementById('fileInput').value = '';
    document.getElementById('inputText').value = '';
    document.getElementById('interactiveText').classList.add('hidden');
    textState = { x: 50, y: 50, size: 24, rotate: 0 };
    
    // Sembunyikan semua halaman, tampilkan halaman 1 (Kamera)
    document.getElementById('pageSelectMethod').classList.remove('hidden');
    document.getElementById('pageEditor').classList.add('hidden');
    document.getElementById('pageMusicCatalog').classList.add('hidden');
    
    document.getElementById('btnSubmitUpload').disabled = true;
    document.getElementById('btnSubmitUpload').textContent = '🚀 Publikasikan';
  }

  document.getElementById('tabRecord').addEventListener('click', () => {
    document.getElementById('tabRecord').classList.add('active'); document.getElementById('tabUpload').classList.remove('active');
    document.getElementById('recordSection').classList.remove('hidden'); document.getElementById('uploadSection').classList.add('hidden');
    startCamera();
  });
  document.getElementById('tabUpload').addEventListener('click', () => {
    document.getElementById('tabUpload').classList.add('active'); document.getElementById('tabRecord').classList.remove('active');
    document.getElementById('uploadSection').classList.remove('hidden'); document.getElementById('recordSection').classList.add('hidden');
    stopCamera();
  });

  document.getElementById('dropzone').addEventListener('click', () => document.getElementById('fileInput').click());
  document.getElementById('fileInput').addEventListener('change', e => {
    if (e.target.files[0]) {
      if (!e.target.files[0].type.startsWith('video/')) { showToast('File harus video!', 'error'); return; }
      pendingFile = e.target.files[0]; showEditorPage();
    }
  });

  function showEditorPage() {
    document.getElementById('pageSelectMethod').classList.add('hidden');
    document.getElementById('pageEditor').classList.remove('hidden');
    if (pendingFile) { document.getElementById('previewVideo').src = URL.createObjectURL(pendingFile); document.getElementById('previewVideo').play(); }
    validateForm();
  }

  // ==========================================
  // FITUR TEXT DRAG & RESIZE (EDITOR)
  // ==========================================
  const interactiveText = document.getElementById('interactiveText');
  let isDragging = false; let startX, startY, initialX, initialY;

  interactiveText.addEventListener('pointerdown', (e) => {
    if(e.target.tagName === 'BUTTON') return;
    isDragging = true; interactiveText.classList.add('active');
    startX = e.clientX; startY = e.clientY;
    const rect = document.getElementById('previewVideo').getBoundingClientRect();
    initialX = (textState.x / 100) * rect.width; initialY = (textState.y / 100) * rect.height;
    interactiveText.setPointerCapture(e.pointerId);
  });

  interactiveText.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const rect = document.getElementById('previewVideo').getBoundingClientRect();
    let newX = initialX + (e.clientX - startX); let newY = initialY + (e.clientY - startY);
    newX = Math.max(0, Math.min(newX, rect.width)); newY = Math.max(0, Math.min(newY, rect.height));
    textState.x = (newX / rect.width) * 100; textState.y = (newY / rect.height) * 100;
    updateTextPosition();
  });

  interactiveText.addEventListener('pointerup', (e) => { isDragging = false; interactiveText.releasePointerCapture(e.pointerId); });

  function updateTextPosition() {
    interactiveText.style.left = textState.x + '%'; interactiveText.style.top = textState.y + '%';
    interactiveText.style.transform = `translate(-50%, -50%) rotate(${textState.rotate}deg)`;
  }

  document.getElementById('inputText').addEventListener('input', (e) => {
    if (e.target.value.trim() === '') interactiveText.classList.add('hidden');
    else { interactiveText.classList.remove('hidden'); interactiveText.childNodes[0].nodeValue = e.target.value; }
  });
  document.getElementById('selectFont').addEventListener('change', (e) => { interactiveText.style.fontFamily = e.target.value; });
  document.getElementById('selectColor').addEventListener('change', (e) => { interactiveText.style.color = e.target.value; });
  
  document.getElementById('btnTextBigger').addEventListener('click', (e) => { e.stopPropagation(); textState.size += 4; interactiveText.style.fontSize = textState.size + 'px'; });
  document.getElementById('btnTextSmaller').addEventListener('click', (e) => { e.stopPropagation(); textState.size = Math.max(10, textState.size - 4); interactiveText.style.fontSize = textState.size + 'px'; });
  document.getElementById('btnTextRotate').addEventListener('click', (e) => { e.stopPropagation(); textState.rotate += 45; updateTextPosition(); });
  document.getElementById('previewVideo').addEventListener('click', () => interactiveText.classList.remove('active'));

  // ==========================================
  // SIMPAN VIDEO
  // ==========================================
  function validateForm() {
    const user = document.getElementById('uploadUsername').value.trim();
    const caption = document.getElementById('uploadCaption').value.trim();
    document.getElementById('btnSubmitUpload').disabled = !(pendingFile && user && caption);
  }
  document.getElementById('uploadUsername').addEventListener('input', validateForm);
  document.getElementById('uploadCaption').addEventListener('input', validateForm);

  document.getElementById('btnSubmitUpload').addEventListener('click', async () => {
    if (!pendingFile) return;
    const btn = document.getElementById('btnSubmitUpload'); btn.disabled = true; btn.textContent = '⏳ Menyimpan...';
    try {
      const newId = Date.now();
      const overlayData = document.getElementById('inputText').value.trim() !== '' ? {
        text: document.getElementById('inputText').value.trim(), x: textState.x, y: textState.y,
        size: textState.size, rotate: textState.rotate, color: document.getElementById('selectColor').value, font: document.getElementById('selectFont').value
      } : null;

      await saveVideoToDB(newId, pendingFile);
      state.userVideos.unshift({ 
        id: newId, username: document.getElementById('uploadUsername').value.trim(), 
        caption: document.getElementById('uploadCaption').value.trim(), src: null, likes: 0, 
        music: selectedMusicUrl, overlayData, uploadedAt: Date.now() 
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      
      showToast('🎉 Video berhasil disimpan!', 'success');
      await renderFeed(); await renderGrid(); updateBalanceUI();
      document.getElementById('uploadModal').classList.add('hidden'); resetUploadForm(); 
      document.getElementById('btnFeed').click();
    } catch (err) {
      showToast('Gagal menyimpan: ' + err.message, 'error');
      btn.textContent = '🚀 Publikasikan'; btn.disabled = false;
    }
  });

  // ==========================================
  // RENDER FEED
  // ==========================================
  async function renderFeed() {
    const all = getAllVideos(); const feedView = document.getElementById('feedView'); feedView.innerHTML = '';
    for (let i = 0; i < all.length; i++) {
      const v = all[i]; const card = document.createElement('div'); card.className = 'video-card'; card.dataset.id = v.id;
      const isLiked = state.likedVideos[v.id];
      
      let musicHTML = v.music ? `<div class="music-info"><span>🎵</span><div class="marquee"><span>Musik Viral</span></div></div>` : '';
      let overlayHTML = v.overlayData ? `<div class="video-text-overlay" style="left:${v.overlayData.x}%; top:${v.overlayData.y}%; transform:translate(-50%,-50%) rotate(${v.overlayData.rotate}deg); font-size:${v.overlayData.size}px; color:${v.overlayData.color}; font-family:${v.overlayData.font};">${v.overlayData.text}</div>` : '';

      card.innerHTML = `
        <video loop muted playsinline preload="metadata"></video>
        ${v.music ? `<audio class="bg-music" src="${v.music}" loop></audio>` : ''}
        <button class="mute-btn">🔇</button>
        ${overlayHTML}
        <div class="play-indicator">▶</div>
        <div class="progress-bar"><div class="progress-fill"></div></div>
        <div class="video-info">
          <div class="user-row">
            <div class="username">${v.username}</div>
            <button class="follow-btn ${state.followedUsers[v.username] ? 'followed' : ''}" data-user="${v.username}">${state.followedUsers[v.username] ? '✓ Following' : '+ Follow'}</button>
          </div>
          <div class="caption">${v.caption}</div>
          ${musicHTML}
        </div>
        <div class="side-actions">
          <button class="action-btn like-btn" style="${isLiked ? 'filter:drop-shadow(0 0 6px #ff0050)' : ''}">
            ${isLiked ? '❤️' : '🤍'}<span>${formatNum(v.likes + (isLiked ? 1 : 0))}</span>
          </button>
          <button class="action-btn comment-btn">💬<span>${formatNum(Math.floor(Math.random()*50)+5)}</span></button>
        </div>
      `;

      const videoEl = card.querySelector('video'); const bgMusic = card.querySelector('.bg-music');
      if (v.src) { videoEl.src = v.src; } else { try { const blob = await getVideoFromDB(v.id); if (blob) videoEl.src = URL.createObjectURL(blob); } catch (e) {} }

      card.querySelector('.mute-btn').addEventListener('click', (e) => {
        e.stopPropagation(); videoEl.muted = !videoEl.muted; if (bgMusic) bgMusic.muted = videoEl.muted;
        e.target.textContent = videoEl.muted ? '🔇' : '🔊';
      });

      card.querySelector('.follow-btn').addEventListener('click', (e) => {
        e.stopPropagation(); const u = e.target.dataset.user;
        if (state.followedUsers[u]) { delete state.followedUsers[u]; e.target.classList.remove('followed'); e.target.textContent = '+ Follow'; } 
        else { state.followedUsers[u] = true; e.target.classList.add('followed'); e.target.textContent = '✓ Following'; }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      });

      card.querySelector('.like-btn').addEventListener('click', (e) => {
        e.stopPropagation(); const btn = e.currentTarget;
        if (state.likedVideos[v.id]) { delete state.likedVideos[v.id]; btn.style.filter = 'none'; btn.firstChild.textContent = '🤍'; btn.querySelector('span').textContent = formatNum(v.likes); } 
        else { state.likedVideos[v.id] = true; btn.style.filter = 'drop-shadow(0 0 6px #ff0050)'; btn.firstChild.textContent = '❤️'; btn.querySelector('span').textContent = formatNum(v.likes + 1); }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      });

      videoEl.addEventListener('click', () => {
        const indicator = card.querySelector('.play-indicator');
        if (videoEl.paused) { videoEl.play(); indicator.textContent = '▶'; indicator.classList.add('show'); setTimeout(() => indicator.classList.remove('show'), 400); } 
        else { videoEl.pause(); indicator.textContent = '⏸'; indicator.classList.add('show'); setTimeout(() => indicator.classList.remove('show'), 400); }
      });
      videoEl.addEventListener('play', () => { if (bgMusic) bgMusic.play().catch(()=>{}); });
      videoEl.addEventListener('pause', () => { if (bgMusic) bgMusic.pause(); });
      videoEl.addEventListener('timeupdate', () => { if (videoEl.duration) card.querySelector('.progress-fill').style.width = (videoEl.currentTime / videoEl.duration * 100) + '%'; });

      feedView.appendChild(card);
    }
    observeFeed();
  }

  function observeFeed() {
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        const video = entry.target.querySelector('video'); const bgMusic = entry.target.querySelector('.bg-music');
        if (entry.isIntersecting && entry.intersectionRatio > 0.6) { video.play().catch(() => {}); if (bgMusic) bgMusic.play().catch(() => {}); } 
        else { video.pause(); video.currentTime = 0; if (bgMusic) { bgMusic.pause(); bgMusic.currentTime = 0; } }
      });
    }, { threshold: [0, 0.6, 1] });
    document.querySelectorAll('.video-card').forEach(c => observer.observe(c));
  }

  async function renderGrid() {
    const all = getAllVideos(); const gridList = document.getElementById('gridList'); gridList.innerHTML = '';
    for (let i = 0; i < all.length; i++) {
      const v = all[i]; const item = document.createElement('div'); item.className = 'grid-item';
      item.innerHTML = `<video muted preload="metadata" playsinline></video><div class="grid-title">${v.caption}</div>`;
      const videoEl = item.querySelector('video');
      if (v.src) { videoEl.src = v.src; } else { try { const blob = await getVideoFromDB(v.id); if (blob) videoEl.src = URL.createObjectURL(blob); } catch (e) {} }
      item.addEventListener('mouseenter', () => { videoEl.currentTime = 0; videoEl.play().catch(()=>{}); });
      item.addEventListener('mouseleave', () => videoEl.pause());
      gridList.appendChild(item);
    }
  }

  // ==========================================
  // INISIALISASI
  // ==========================================
  function formatNum(n) { if (n >= 1000000) return (n/1000000).toFixed(1) + 'M'; if (n >= 1000) return (n/1000).toFixed(1) + 'K'; return n; }
  function updateBalanceUI() {
    document.getElementById('navBalance').textContent = state.coins;
    document.getElementById('coinBalance').textContent = state.coins;
    document.getElementById('statViews').textContent = state.views;
    document.getElementById('statVideos').textContent = state.userVideos.length;
  }

  document.getElementById('btnFeed').addEventListener('click', () => {
    document.getElementById('feedView').classList.remove('hidden'); document.getElementById('gridView').classList.add('hidden');
    document.getElementById('btnFeed').classList.add('active'); document.getElementById('btnGrid').classList.remove('active');
  });
  document.getElementById('btnGrid').addEventListener('click', () => {
    document.getElementById('gridView').classList.remove('hidden'); document.getElementById('feedView').classList.add('hidden');
    document.getElementById('btnGrid').classList.add('active'); document.getElementById('btnFeed').classList.remove('active');
    document.querySelectorAll('.feed-container video').forEach(v => v.pause());
  });
  document.getElementById('btnMonet').addEventListener('click', () => { updateBalanceUI(); document.getElementById('monetModal').classList.remove('hidden'); });
  document.getElementById('closeMonet').addEventListener('click', () => document.getElementById('monetModal').classList.add('hidden'));

  (async () => {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) state = { ...state, ...JSON.parse(saved) };
    await initDB(); await renderFeed(); await renderGrid(); updateBalanceUI();
  })();
</script>
