<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>VidStream Pro — Final Release</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  body { background:#000; color:#fff; overflow-x:hidden; }
  .hidden { display:none !important; }

  /* ===== NAVBAR ===== */
  .navbar {
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 12px; background:linear-gradient(180deg,rgba(0,0,0,0.95),transparent);
    backdrop-filter:blur(10px);
  }
  .profile-nav-btn {
    width:36px; height:36px; border-radius:50%;
    background:#333; border:2px solid #ff0050;
    cursor:pointer; overflow:hidden; display:flex;
    justify-content:center; align-items:center;
  }
  .profile-nav-btn img { width:100%; height:100%; object-fit:cover; }
  
  .nav-buttons { display:flex; gap:6px; align-items:center; justify-content:flex-end; }
  .nav-btn {
    background:#2a2a2a; border:1px solid #444; color:#fff;
    padding:8px; border-radius:50%; font-size:1rem;
    cursor:pointer; transition:0.2s; display:flex;
    justify-content:center; align-items:center; width:36px; height:36px;
  }
  .nav-btn.active { background:linear-gradient(135deg,#ff8a00,#ff0050); border-color:#ff8a00; }
  .nav-btn.coin-btn {
    background:linear-gradient(135deg,#f7b733,#fc4a1a);
    border:none; font-weight:bold; border-radius:20px; width:auto; padding:8px 12px; font-size:0.85rem; gap:4px;
  }

  /* ===== FEED ===== */
  .feed-container { height:100vh; overflow-y:scroll; scroll-snap-type:y mandatory; scrollbar-width:none; }
  .feed-container::-webkit-scrollbar { display:none; }
  .video-card {
    position:relative; height:100vh; width:100%;
    scroll-snap-align:start; display:flex; justify-content:center; align-items:center; background:#000;
  }
  .video-card video { width:100%; height:100%; object-fit:cover; }
  
  .video-text-overlay {
    position:absolute; z-index:2; text-align:center; font-weight:bold;
    text-shadow:0 2px 8px rgba(0,0,0,0.9); pointer-events:none; white-space:nowrap;
  }

  .video-info { position:absolute; bottom:80px; left:16px; right:80px; z-index:2; text-shadow:0 2px 8px rgba(0,0,0,0.8); }
  .user-row { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .video-info .username { font-weight:bold; font-size:1rem; }
  .follow-btn {
    background:transparent; border:1px solid #fff; color:#fff;
    padding:4px 10px; border-radius:12px; font-size:0.7rem; font-weight:bold; cursor:pointer;
  }
  .follow-btn.followed { background:#fff; color:#000; }
  .video-info .caption { font-size:0.85rem; opacity:0.9; line-height:1.3; }
  
  .music-info {
    display:flex; align-items:center; gap:6px; font-size:0.75rem; margin-top:8px; color:#fff;
    background:rgba(0,0,0,0.6); padding:4px 10px; border-radius:12px; width:fit-content; border:1px solid rgba(255,255,255,0.2);
  }
  .marquee { width:150px; overflow:hidden; white-space:nowrap; }
  .marquee span { display:inline-block; padding-left:100%; animation: marquee 8s linear infinite; }
  @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

  /* SIDE ACTIONS */
  .side-actions {
    position:absolute; right:12px; bottom:20px; /* Dinaikkan agar tidak tertutup */
    display:flex; flex-direction:column; gap:14px; z-index:2;
  }
  .action-btn {
    background:none; border:none; color:#fff; font-size:1.3rem;
    cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5); transition: transform 0.15s;
  }
  .action-btn:active { transform:scale(0.85); }
  .action-btn span { font-size:0.65rem; font-weight:600; }
  .action-btn.tip-btn { color:#f7b733; }
  .action-btn.share-btn { color:#00bfff; }

  .mute-btn {
    position:absolute; top:70px; right:16px; z-index:3;
    background:rgba(0,0,0,0.5); border:none; color:#fff;
    width:36px; height:36px; border-radius:50%; font-size:1.2rem;
    display:flex; justify-content:center; align-items:center;
  }
  .play-indicator {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    font-size:4rem; opacity:0; pointer-events:none; transition:opacity 0.3s;
  }
  .play-indicator.show { opacity:0.8; }
  .progress-bar { position:absolute; bottom:0; left:0; right:0; height:3px; background:rgba(255,255,255,0.2); }
  .progress-fill { height:100%; background:#ff0050; width:0%; }

  /* ===== MODAL UMUM ===== */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:200; display:flex; justify-content:center; align-items:center; padding:16px; }
  .modal-content { position:relative; width:100%; max-width:520px; background:#1a1a1a; border-radius:16px; overflow:hidden; max-height:90vh; display:flex; flex-direction:column; }
  .close-btn { position:absolute; top:12px; right:12px; z-index:10; background:rgba(255,255,255,0.1); border:none; color:#fff; width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:1rem; }

  /* COMMENT SHEET */
  .comment-sheet {
    position:fixed; bottom:0; left:0; right:0; background:#1a1a1a; border-radius:16px 16px 0 0;
    z-index:300; height:60vh; display:flex; flex-direction:column;
    transform:translateY(100%); transition:transform 0.3s ease;
  }
  .comment-sheet.show { transform:translateY(0); }
  .comment-header { display:flex; justify-content:space-between; align-items:center; padding:16px; border-bottom:1px solid #333; }
  .comment-list { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:16px; }
  .comment-item { display:flex; gap:12px; }
  .comment-avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#ff0050,#ff8a00); display:flex; justify-content:center; align-items:center; font-weight:bold; flex-shrink:0; }
  .comment-body .c-user { font-weight:bold; font-size:0.8rem; color:#ccc; }
  .comment-body .c-text { font-size:0.9rem; }
  .comment-input-area { padding:12px 16px; border-top:1px solid #333; display:flex; gap:10px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  .comment-input-area input { flex:1; background:#222; border:none; border-radius:20px; padding:10px 16px; color:#fff; outline:none; }
  .comment-input-area button { background:#ff0050; border:none; color:#fff; width:40px; height:40px; border-radius:50%; font-size:1.2rem; }

  /* PROFIL & SETTINGS */
  .profile-header { text-align:center; padding:30px 20px 20px; border-bottom:1px solid #333; }
  .avatar-preview { width:80px; height:80px; border-radius:50%; background:#333; margin:0 auto 12px; overflow:hidden; border:3px solid #ff0050; position:relative; }
  .avatar-preview img { width:100%; height:100%; object-fit:cover; }
  .avatar-edit-label { position:absolute; bottom:0; right:0; background:#ff0050; width:28px; height:28px; border-radius:50%; display:flex; justify-content:center; align-items:center; cursor:pointer; }
  .form-group { padding:0 20px; margin-bottom:16px; }
  .form-group label { display:block; font-size:0.8rem; color:#aaa; margin-bottom:6px; }
  .form-group input { width:100%; padding:12px; background:#222; border:1px solid #444; border-radius:8px; color:#fff; font-size:1rem; outline:none; }
  .btn-primary { width:calc(100% - 40px); margin:0 20px 20px; padding:14px; background:linear-gradient(90deg,#ff0050,#ff8a00); border:none; color:#fff; border-radius:8px; font-weight:bold; font-size:1rem; cursor:pointer; }

  /* MONETISASI & BELANJA */
  .balance-card { background:linear-gradient(135deg,#f7b733,#fc4a1a); border-radius:16px; padding:24px; margin:20px; text-align:center; }
  .balance-card h2 { font-size:2.5rem; margin:8px 0; }
  .price-list { padding:0 20px; display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
  .price-item { display:flex; justify-content:space-between; background:#222; padding:14px; border-radius:12px; cursor:pointer; border:1px solid #444; }
  .price-item:active { background:#333; border-color:#f7b733; }
  .btn-withdraw { width:calc(100% - 40px); margin:0 20px 20px; padding:14px; background:#00c853; border:none; color:#fff; border-radius:8px; font-weight:bold; font-size:1rem; cursor:pointer; }
  .btn-withdraw:disabled { background:#444; color:#888; }

  .toast {
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px);
    background:#333; color:#fff; padding:12px 20px; border-radius:24px; z-index:500;
    opacity:0; transition:0.3s; pointer-events:none; text-align:center;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <header class="navbar">
    <div class="profile-nav-btn" id="btnProfile" title="Profil Saya">
      <img id="navAvatar" src="https://ui-avatars.com/api/?name=User&background=random" alt="Profile" />
    </div>
    <div class="nav-buttons">
      <button id="btnFeed" class="nav-btn active" title="Feed">📱</button>
      <button id="btnUpload" class="nav-btn" title="Buat Video">🎥</button>
      <button id="btnMonet" class="nav-btn coin-btn" title="Belanja Koin">💰 <span id="navBalance">0</span></button>
    </div>
  </header>

  <main id="feedView" class="feed-container"></main>

  <!-- COMMENT SHEET -->
  <div id="commentSheet" class="comment-sheet">
    <div class="comment-header">
      <h3><span id="commentCount">0</span> Komentar</h3>
      <button id="closeComment" style="background:none;border:none;color:#fff;font-size:1.2rem;">✕</button>
    </div>
    <div class="comment-list" id="commentList"></div>
    <div class="comment-input-area">
      <input type="text" id="commentInput" placeholder="Tambahkan komentar..." />
      <button id="sendComment">➤</button>
    </div>
  </div>

  <!-- MODAL PROFIL & SETTINGS -->
  <div id="profileModal" class="modal hidden">
    <div class="modal-content">
      <button class="close-btn" id="closeProfile">✕</button>
      <div class="profile-header">
        <div class="avatar-preview">
          <img id="profilePreview" src="https://ui-avatars.com/api/?name=User&background=random" />
          <label class="avatar-edit-label" for="avatarUpload">✎</label>
          <input type="file" id="avatarUpload" accept="image/*" hidden />
        </div>
        <h3 id="profileNameDisplay">Nama Pengguna</h3>
        <p style="color:#aaa; font-size:0.85rem;" id="profileUsernameDisplay">@username</p>
      </div>
      
      <div class="form-group" style="margin-top:20px;">
        <label>Nama Tampilan</label>
        <input type="text" id="inputDisplayName" placeholder="Nama Kamu" />
      </div>
      <div class="form-group">
        <label>Username (ID)</label>
        <input type="text" id="inputUsername" placeholder="@username" />
      </div>
      <button class="btn-primary" id="btnSaveProfile">Simpan Perubahan</button>
    </div>
  </div>

  <!-- MODAL BELANJA KOIN & MONETISASI -->
  <div id="monetModal" class="modal hidden">
    <div class="modal-content">
      <button class="close-btn" id="closeMonet">✕</button>
      <div class="balance-card">
        <div style="font-size:0.9rem; opacity:0.9;">Saldo Koin Kamu</div>
        <h2>🪙 <span id="coinBalance">0</span></h2>
        <div style="font-size:1rem; font-weight:bold;">≈ Rp <span id="coinRupiah">0</span></div>
      </div>
      
      <h3 style="padding:0 20px; margin-bottom:10px; font-size:1rem;">💳 Beli Koin</h3>
      <div class="price-list">
        <div class="price-item" data-coins="100" data-price="10000"><span>🪙 100 Koin</span><span style="color:#f7b733;">Rp 10.000</span></div>
        <div class="price-item" data-coins="500" data-price="45000"><span>🪙 500 Koin</span><span style="color:#f7b733;">Rp 45.000</span></div>
        <div class="price-item" data-coins="1200" data-price="100000"><span>🪙 1.200 Koin (+200)</span><span style="color:#f7b733;">Rp 100.000</span></div>
      </div>

      <h3 style="padding:0 20px; margin-bottom:10px; font-size:1rem;">💸 Tarik Uang (Withdraw)</h3>
      <p style="padding:0 20px 10px; font-size:0.75rem; color:#aaa;">Minimal 1000 koin (Rp 100.000).</p>
      <button id="btnWithdraw" class="btn-withdraw" disabled>💸 Tarik ke Rekening</button>
    </div>
  </div>

  <!-- UPLOAD MODAL (DISEDERHANAKAN) -->
  <div id="uploadModal" class="modal hidden">
    <div class="modal-content" style="padding:20px;">
      <button class="close-btn" id="closeUpload">✕</button>
      <h3>🎥 Buat Video Baru</h3>
      <p style="color:#aaa; font-size:0.85rem; margin-bottom:20px;">Rekam dari kamera atau pilih dari galeri.</p>
      
      <div id="dropzone" style="border:2px dashed #444; border-radius:12px; padding:40px 20px; text-align:center; background:#222; margin-bottom:16px;">
        <div style="font-size:3rem; margin-bottom:10px;">📁</div>
        <p><strong>Pilih Video dari Galeri</strong></p>
      </div>
      <input type="file" id="fileInput" accept="video/*" hidden />
      
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="uploadUsername" placeholder="@username" />
      </div>
      <div class="form-group">
        <label>Caption</label>
        <input type="text" id="uploadCaption" placeholder="Tulis caption..." />
      </div>
      <button class="btn-primary" id="btnSubmitUpload" disabled style="width:100%;margin:0;">🚀 Publikasikan</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

<script>
  const STORAGE_KEY = 'vidstream_v11';
  
  // State Aplikasi
  let state = { 
    coins: 0, 
    userVideos: [], 
    comments: {}, 
    likedVideos: {}, 
    followedUsers: {},
    profile: {
      name: "Pengguna Baru",
      username: "@user123",
      avatar: "https://ui-avatars.com/api/?name=User&background=random"
    }
  };

  // DB IndexedDB untuk Video
  const DB_NAME = 'vidstream_db'; const DB_STORE = 'videos'; let db;
  function initDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = e => { if (!e.target.result.objectStoreNames.contains(DB_STORE)) e.target.result.createObjectStore(DB_STORE, { keyPath: 'id' }); };
      req.onsuccess = e => { db = e.target.result; resolve(); };
      req.onerror = e => reject(e);
    });
  }
  function saveVideoToDB(id, blob) { return new Promise((res, rej) => { const tx = db.transaction(DB_STORE, 'readwrite'); tx.objectStore(DB_STORE).put({ id, blob }).onsuccess = () => res(); tx.onerror = rej; }); }
  function getVideoFromDB(id) { return new Promise((res, rej) => { const tx = db.transaction(DB_STORE, 'readonly'); tx.objectStore(DB_STORE).get(id).onsuccess = e => res(e.target.result ? e.target.result.blob : null); tx.onerror = rej; }); }

  const defaultVideos = [
    { id:1, username:"@nature_vibes", caption:"Sunset di pantai 🏖️", src:"https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4", likes:1240 }
  ];
  function getAllVideos() { return [...state.userVideos, ...defaultVideos]; }

  // UTILITIES
  function formatNum(n) { if (n >= 1000000) return (n/1000000).toFixed(1) + 'M'; if (n >= 1000) return (n/1000).toFixed(1) + 'K'; return n; }
  function showToast(msg, type='info') {
    const toast = document.getElementById('toast'); toast.textContent = msg;
    toast.style.background = type === 'success' ? '#00c853' : type === 'error' ? '#ff0050' : '#333';
    toast.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => toast.classList.remove('show'), 2500);
  }
  function updateUI() {
    document.getElementById('navBalance').textContent = state.coins;
    document.getElementById('coinBalance').textContent = state.coins;
    document.getElementById('coinRupiah').textContent = (state.coins * 100).toLocaleString('id-ID');
    document.getElementById('btnWithdraw').disabled = state.coins < 1000;
    
    // Update Profil UI
    document.getElementById('navAvatar').src = state.profile.avatar;
    document.getElementById('profilePreview').src = state.profile.avatar;
    document.getElementById('profileNameDisplay').textContent = state.profile.name;
    document.getElementById('profileUsernameDisplay').textContent = state.profile.username;
    document.getElementById('inputDisplayName').value = state.profile.name;
    document.getElementById('inputUsername').value = state.profile.username;
  }
  function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

  // ==========================================
  // LOGIKA PROFIL & SETTINGS
  // ==========================================
  document.getElementById('btnProfile').addEventListener('click', () => {
    document.getElementById('profileModal').classList.remove('hidden');
  });
  document.getElementById('closeProfile').addEventListener('click', () => {
    document.getElementById('profileModal').classList.add('hidden');
  });

  document.getElementById('avatarUpload').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        state.profile.avatar = ev.target.result;
        document.getElementById('profilePreview').src = state.profile.avatar;
      };
      reader.readAsDataURL(file);
    }
  });

  document.getElementById('btnSaveProfile').addEventListener('click', () => {
    state.profile.name = document.getElementById('inputDisplayName').value.trim() || "Pengguna";
    state.profile.username = document.getElementById('inputUsername').value.trim() || "@user123";
    saveState(); updateUI();
    showToast('✅ Profil berhasil disimpan!', 'success');
    document.getElementById('profileModal').classList.add('hidden');
  });

  // ==========================================
  // LOGIKA MONETISASI & BELANJA KOIN
  // ==========================================
  document.getElementById('btnMonet').addEventListener('click', () => {
    updateUI(); document.getElementById('monetModal').classList.remove('hidden');
  });
  document.getElementById('closeMonet').addEventListener('click', () => {
    document.getElementById('monetModal').classList.add('hidden');
  });

  document.querySelectorAll('.price-item').forEach(item => {
    item.addEventListener('click', () => {
      const coins = parseInt(item.dataset.coins);
      const price = parseInt(item.dataset.price);
      if (confirm(`Beli ${coins} Koin seharga Rp ${price.toLocaleString('id-ID')}?`)) {
        state.coins += coins; saveState(); updateUI();
        showToast(`✅ Pembelian Berhasil! +${coins} Koin`, 'success');
      }
    });
  });

  document.getElementById('btnWithdraw').addEventListener('click', () => {
    if (state.coins < 1000) return;
    const rp = state.coins * 100;
    if (confirm(`Tarik ${state.coins} Koin ke Rekening (Rp ${rp.toLocaleString('id-ID')})?`)) {
      state.coins = 0; saveState(); updateUI();
      showToast('💸 Withdraw diproses ke rekeningmu!', 'success');
    }
  });

  // ==========================================
  // FITUR KOMENTAR
  // ==========================================
  let currentVideoIdForComment = null;
  function openComments(videoId) {
    currentVideoIdForComment = videoId;
    renderComments(videoId);
    document.getElementById('commentSheet').classList.add('show');
  }
  function renderComments(videoId) {
    const comments = state.comments[videoId] || [];
    document.getElementById('commentCount').textContent = comments.length;
    const list = document.getElementById('commentList');
    if (comments.length === 0) { list.innerHTML = `<p style="text-align:center;color:#666;font-size:0.85rem;">Belum ada komentar.</p>`; return; }
    list.innerHTML = comments.map(c => `
      <div class="comment-item"><div class="comment-avatar">${c.user.charAt(1).toUpperCase()}</div>
      <div class="comment-body"><div class="c-user">${c.user}</div><div class="c-text">${c.text}</div></div></div>
    `).join('');
    list.scrollTop = list.scrollHeight;
  }
  document.getElementById('closeComment').addEventListener('click', () => {
    document.getElementById('commentSheet').classList.remove('show');
  });
  document.getElementById('sendComment').addEventListener('click', () => {
    const input = document.getElementById('commentInput');
    if (!input.value.trim() || !currentVideoIdForComment) return;
    if (!state.comments[currentVideoIdForComment]) state.comments[currentVideoIdForComment] = [];
    state.comments[currentVideoIdForComment].push({ user: state.profile.username, text: input.value.trim() });
    saveState(); input.value = ''; renderComments(currentVideoIdForComment);
  });

  // ==========================================
  // FITUR SHARE & TIPS KOIN
  // ==========================================
  function handleShare(v) {
    const shareUrl = window.location.href;
    if (navigator.share) {
      navigator.share({ title: 'VidStream Pro', text: `Tonton video dari ${v.username}`, url: shareUrl }).catch(()=>{});
    } else {
      navigator.clipboard.writeText(shareUrl);
      showToast('🔗 Link disalin ke clipboard!', 'success');
    }
  }

  function sendTip(v) {
    if (!v) return;
    const amount = prompt(`🎁 Kirim koin ke ${v.username}\n\nSaldo kamu: ${state.coins} Koin\nMasukkan jumlah koin (min 10):`, '10');
    if (amount === null) return;
    const coins = parseInt(amount);
    if (isNaN(coins) || coins < 10) { showToast('Minimal 10 Koin', 'error'); return; }
    if (coins > state.coins) { showToast('Saldo koin tidak cukup!', 'error'); return; }
    
    state.coins -= coins;
    saveState(); updateUI();
    showToast(`🎁 Berhasil mengirim ${coins} Koin ke ${v.username}!`, 'success');
  }

  // ==========================================
  // UPLOAD LOGIC (SEDERHANA)
  // ==========================================
  let pendingFile = null;
  const uploadModal = document.getElementById('uploadModal');
  
  document.getElementById('btnUpload').addEventListener('click', () => {
    uploadModal.classList.remove('hidden');
    document.getElementById('uploadUsername').value = state.profile.username;
    document.getElementById('uploadCaption').value = '';
    pendingFile = null;
    document.getElementById('btnSubmitUpload').disabled = true;
  });
  document.getElementById('closeUpload').addEventListener('click', () => {
    uploadModal.classList.add('hidden');
  });
  document.getElementById('dropzone').addEventListener('click', () => document.getElementById('fileInput').click());
  document.getElementById('fileInput').addEventListener('change', (e) => {
    if (e.target.files[0]) {
      pendingFile = e.target.files[0];
      document.getElementById('btnSubmitUpload').disabled = false;
      showToast('✅ Video dipilih. Siap publish!', 'success');
    }
  });
  
  document.getElementById('uploadCaption').addEventListener('input', (e) => {
    if (e.target.value.trim() !== '' && pendingFile) document.getElementById('btnSubmitUpload').disabled = false;
    else document.getElementById('btnSubmitUpload').disabled = true;
  });

  document.getElementById('btnSubmitUpload').addEventListener('click', async () => {
    if (!pendingFile) return;
    const btn = document.getElementById('btnSubmitUpload'); btn.textContent = '⏳ Menyimpan...'; btn.disabled = true;
    const newId = Date.now();
    await saveVideoToDB(newId, pendingFile);
    state.userVideos.unshift({
      id: newId, username: document.getElementById('uploadUsername').value.trim(),
      caption: document.getElementById('uploadCaption').value.trim(), src: null, likes: 0
    });
    saveState(); showToast('🎉 Video berhasil di-publish!', 'success');
    uploadModal.classList.add('hidden'); renderFeed();
  });

  // ==========================================
  // RENDER FEED (TIKTOK STYLE)
  // ==========================================
  async function renderFeed() {
    const feed = document.getElementById('feedView'); feed.innerHTML = '';
    const all = getAllVideos();

    for (let v of all) {
      const card = document.createElement('div'); card.className = 'video-card';
      const isLiked = state.likedVideos[v.id];
      
      card.innerHTML = `
        <video loop muted playsinline preload="metadata"></video>
        <button class="mute-btn">🔇</button>
        <div class="play-indicator">▶</div>
        <div class="progress-bar"><div class="progress-fill"></div></div>
        <div class="video-info">
          <div class="user-row">
            <div class="username">${v.username}</div>
            <button class="follow-btn ${state.followedUsers[v.username] ? 'followed' : ''}" data-user="${v.username}">
              ${state.followedUsers[v.username] ? '✓ Following' : '+ Follow'}
            </button>
          </div>
          <div class="caption">${v.caption}</div>
        </div>
        <div class="side-actions" style="bottom: 80px;">
          <button class="action-btn like-btn" style="${isLiked ? 'filter:drop-shadow(0 0 6px #ff0050)' : ''}">
            ${isLiked ? '❤️' : '🤍'}<span>${formatNum(v.likes + (isLiked ? 1 : 0))}</span>
          </button>
          <button class="action-btn comment-btn">💬<span>${formatNum((state.comments[v.id] || []).length)}</span></button>
          <button class="action-btn tip-btn" style="color:#f7b733;">🎁<span>Tips</span></button>
          <button class="action-btn share-btn" style="color:#00bfff;">↗️<span>Share</span></button>
        </div>
      `;

      const videoEl = card.querySelector('video');
      if (v.src) videoEl.src = v.src;
      else { try { const b = await getVideoFromDB(v.id); if(b) videoEl.src = URL.createObjectURL(b); } catch(e){} }

      // Listeners
      card.querySelector('.mute-btn').addEventListener('click', (e) => {
        e.stopPropagation(); videoEl.muted = !videoEl.muted;
        e.target.textContent = videoEl.muted ? '🔇' : '🔊';
      });
      
      card.querySelector('.like-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        if (state.likedVideos[v.id]) {
          delete state.likedVideos[v.id]; e.currentTarget.style.filter = 'none'; e.currentTarget.firstChild.textContent = '🤍';
        } else {
          state.likedVideos[v.id] = true; e.currentTarget.style.filter = 'drop-shadow(0 0 6px #ff0050)'; e.currentTarget.firstChild.textContent = '❤️';
        }
        saveState(); renderFeed();
      });

      card.querySelector('.comment-btn').addEventListener('click', (e) => { e.stopPropagation(); openComments(v.id); });
      card.querySelector('.share-btn').addEventListener('click', (e) => { e.stopPropagation(); handleShare(v); });
      card.querySelector('.tip-btn').addEventListener('click', (e) => { e.stopPropagation(); sendTip(v); });
      
      card.querySelector('.follow-btn').addEventListener('click', (e) => {
        e.stopPropagation(); const u = v.username;
        if (state.followedUsers[u]) delete state.followedUsers[u];
        else state.followedUsers[u] = true;
        saveState(); renderFeed();
      });

      videoEl.addEventListener('click', () => {
        const ind = card.querySelector('.play-indicator');
        if (videoEl.paused) { videoEl.play(); ind.textContent = '▶'; } else { videoEl.pause(); ind.textContent = '⏸'; }
        ind.classList.add('show'); setTimeout(() => ind.classList.remove('show'), 400);
      });
      videoEl.addEventListener('timeupdate', () => {
        if (videoEl.duration) card.querySelector('.progress-fill').style.width = (videoEl.currentTime / videoEl.duration * 100) + '%';
      });

      feed.appendChild(card);
    }
  }

  // ==========================================
  // INISIALISASI
  // ==========================================
  (async () => {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) state = { ...state, ...JSON.parse(saved) };
    await initDB(); updateUI(); await renderFeed();
  })();
</script>
</body>
</html>
