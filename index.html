<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>VidStream Pro — Ultimate All-in-One</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  body { background:#000; color:#fff; overflow-x:hidden; }
  .hidden { display:none !important; }

  /* ===== NAVBAR ===== */
  .navbar {
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 12px; background:linear-gradient(180deg,rgba(0,0,0,0.95),transparent);
    backdrop-filter:blur(10px);
  }
  .profile-nav-btn {
    width:36px; height:36px; border-radius:50%;
    background:#333; border:2px solid #ff0050;
    cursor:pointer; overflow:hidden; display:flex; justify-content:center; align-items:center;
  }
  .profile-nav-btn img { width:100%; height:100%; object-fit:cover; }
  
  .nav-buttons { display:flex; gap:6px; align-items:center; justify-content:flex-end; flex-wrap:wrap; }
  .nav-btn {
    background:#2a2a2a; border:1px solid #444; color:#fff;
    padding:8px; border-radius:50%; font-size:1rem; cursor:pointer; 
    display:flex; justify-content:center; align-items:center; width:36px; height:36px;
  }
  .nav-btn.active { background:linear-gradient(135deg,#ff8a00,#ff0050); border-color:#ff8a00; box-shadow:0 0 10px rgba(255,138,0,0.5); }
  .nav-btn.coin-btn {
    background:linear-gradient(135deg,#f7b733,#fc4a1a); border:none; font-weight:bold; 
    border-radius:20px; width:auto; padding:8px 12px; font-size:0.85rem; gap:4px; color:#fff;
  }

  /* ===== FEED ===== */
  .feed-container { height:100vh; overflow-y:scroll; scroll-snap-type:y mandatory; scrollbar-width:none; }
  .feed-container::-webkit-scrollbar { display:none; }
  .video-card {
    position:relative; height:100vh; width:100%;
    scroll-snap-align:start; display:flex; justify-content:center; align-items:center; background:#000;
  }
  .video-card video { width:100%; height:100%; object-fit:cover; transition: filter 0.3s ease; }
  
  .filter-cinematic { filter: contrast(1.2) saturate(0.8) sepia(0.3); }
  .filter-vintage { filter: sepia(0.6) contrast(1.1) brightness(0.9); }
  .filter-bw { filter: grayscale(1) contrast(1.3); }
  .filter-vivid { filter: saturate(1.5) contrast(1.1); }
  .filter-warm { filter: sepia(0.4) saturate(1.3) hue-rotate(-10deg); }

  .video-text-overlay {
    position:absolute; z-index:2; text-align:center; font-weight:bold;
    text-shadow:0 2px 8px rgba(0,0,0,0.9); pointer-events:none; white-space:nowrap;
  }

  .video-info { position:absolute; bottom:80px; left:16px; right:80px; z-index:2; text-shadow:0 2px 8px rgba(0,0,0,0.8); }
  .user-row { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .video-info .username { font-weight:bold; font-size:1rem; }
  .follow-btn { background:transparent; border:1px solid #fff; color:#fff; padding:4px 10px; border-radius:12px; font-size:0.7rem; font-weight:bold; cursor:pointer; }
  .follow-btn.followed { background:#fff; color:#000; }
  .video-info .caption { font-size:0.85rem; opacity:0.9; line-height:1.3; }
  
  .music-info {
    display:flex; align-items:center; gap:6px; font-size:0.75rem; margin-top:8px; color:#fff;
    background:rgba(0,0,0,0.6); padding:4px 10px; border-radius:12px; width:fit-content; border:1px solid rgba(255,255,255,0.2);
  }
  .marquee { width:150px; overflow:hidden; white-space:nowrap; }
  .marquee span { display:inline-block; padding-left:100%; animation: marquee 8s linear infinite; }
  @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

  .side-actions { position:absolute; right:12px; bottom:80px; display:flex; flex-direction:column; gap:14px; z-index:2; }
  .action-btn {
    background:none; border:none; color:#fff; font-size:1.3rem; cursor:pointer; 
    display:flex; flex-direction:column; align-items:center; gap:2px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }
  .action-btn span { font-size:0.65rem; font-weight:600; }

  .mute-btn { position:absolute; top:70px; right:16px; z-index:3; background:rgba(0,0,0,0.5); border:none; color:#fff; width:36px; height:36px; border-radius:50%; font-size:1.2rem; display:flex; justify-content:center; align-items:center; }
  .play-indicator { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:4rem; opacity:0; pointer-events:none; transition:opacity 0.3s; }
  .play-indicator.show { opacity:0.8; }
  .progress-bar { position:absolute; bottom:0; left:0; right:0; height:3px; background:rgba(255,255,255,0.2); }
  .progress-fill { height:100%; background:#ff0050; width:0%; }

  /* ===== MODAL UMUM ===== */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:200; display:flex; justify-content:center; align-items:center; padding:16px; }
  .modal-content { position:relative; width:100%; max-width:520px; background:#1a1a1a; border-radius:16px; overflow:hidden; max-height:90vh; display:flex; flex-direction:column; }
  .close-btn { position:absolute; top:12px; right:12px; z-index:10; background:rgba(255,255,255,0.1); border:none; color:#fff; width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:1rem; }

  /* COMMENT SHEET */
  .comment-sheet {
    position:fixed; bottom:0; left:0; right:0; background:#1a1a1a; border-radius:16px 16px 0 0;
    z-index:300; height:60vh; display:flex; flex-direction:column; transform:translateY(100%); transition:transform 0.3s ease;
  }
  .comment-sheet.show { transform:translateY(0); }
  .comment-header { display:flex; justify-content:space-between; align-items:center; padding:16px; border-bottom:1px solid #333; }
  .comment-list { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:16px; }
  .comment-item { display:flex; gap:12px; }
  .comment-avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#ff0050,#ff8a00); display:flex; justify-content:center; align-items:center; font-weight:bold; flex-shrink:0; }
  .comment-body .c-user { font-weight:bold; font-size:0.8rem; color:#ccc; }
  .comment-body .c-text { font-size:0.9rem; }
  .comment-input-area { padding:12px 16px; border-top:1px solid #333; display:flex; gap:10px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  .comment-input-area input { flex:1; background:#222; border:none; border-radius:20px; padding:10px 16px; color:#fff; outline:none; }
  .comment-input-area button { background:#ff0050; border:none; color:#fff; width:40px; height:40px; border-radius:50%; font-size:1.2rem; }

  /* PROFIL & SETTINGS */
  .profile-header { text-align:center; padding:30px 20px 20px; border-bottom:1px solid #333; }
  .avatar-preview { width:80px; height:80px; border-radius:50%; background:#333; margin:0 auto 12px; overflow:hidden; border:3px solid #ff0050; position:relative; }
  .avatar-preview img { width:100%; height:100%; object-fit:cover; }
  .avatar-edit-label { position:absolute; bottom:0; right:0; background:#ff0050; width:28px; height:28px; border-radius:50%; display:flex; justify-content:center; align-items:center; cursor:pointer; }
  .form-group { padding:0 20px; margin-bottom:16px; }
  .form-group label { display:block; font-size:0.8rem; color:#aaa; margin-bottom:6px; }
  .form-group input, .form-group select, .form-group textarea { width:100%; padding:12px; background:#222; border:1px solid #444; border-radius:8px; color:#fff; font-size:1rem; outline:none; }
  .btn-primary { width:calc(100% - 40px); margin:0 20px 20px; padding:14px; background:linear-gradient(90deg,#ff0050,#ff8a00); border:none; color:#fff; border-radius:8px; font-weight:bold; font-size:1rem; cursor:pointer; }
  .btn-primary:disabled { opacity:0.5; }

  /* MONETISASI & BELANJA */
  .balance-card { background:linear-gradient(135deg,#f7b733,#fc4a1a); border-radius:16px; padding:24px; margin:20px; text-align:center; }
  .balance-card h2 { font-size:2.5rem; margin:8px 0; }
  .price-list { padding:0 20px; display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
  .price-item { display:flex; justify-content:space-between; background:#222; padding:14px; border-radius:12px; cursor:pointer; border:1px solid #444; }
  .price-item:active { background:#333; border-color:#f7b733; }
  .btn-withdraw { width:calc(100% - 40px); margin:0 20px 20px; padding:14px; background:#00c853; border:none; color:#fff; border-radius:8px; font-weight:bold; font-size:1rem; cursor:pointer; }
  .btn-withdraw:disabled { background:#444; color:#888; }

  /* UPLOAD & CAMERA */
  .upload-body { padding:20px; overflow-y:auto; display:flex; flex-direction:column; height:100%; }
  .camera-container { position:relative; width:100%; aspect-ratio:9/16; background:#000; border-radius:12px; overflow:hidden; margin-bottom:16px; }
  .camera-container video { width:100%; height:100%; object-fit:cover; }
  .record-btn { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); width:60px; height:60px; border-radius:50%; background:rgba(255,255,255,0.3); border:4px solid #fff; cursor:pointer; display:flex; justify-content:center; align-items:center; }
  .record-btn.recording { background:rgba(255,0,80,0.5); border-color:#ff0050; }
  .record-btn .inner { width:46px; height:46px; border-radius:50%; background:#ff0050; transition:0.2s; }
  .record-btn.recording .inner { border-radius:8px; width:24px; height:24px; background:#fff; }
  .flip-cam-btn { position:absolute; top:16px; right:16px; background:rgba(0,0,0,0.6); border:none; color:#fff; width:44px; height:44px; border-radius:50%; cursor:pointer; font-size:1.5rem; display:flex; justify-content:center; align-items:center; }

  /* EDITOR */
  .preview-wrapper { position:relative; width:100%; margin-bottom:16px; border-radius:12px; overflow:hidden; background:#000; display:flex; justify-content:center; }
  .preview-wrapper video { width:100%; max-height:300px; object-fit:contain; }
  .interactive-text { position:absolute; z-index:10; cursor:move; padding:4px; border:1px dashed transparent; user-select:none; touch-action:none; white-space:nowrap; font-weight:bold; text-shadow:0 2px 8px rgba(0,0,0,0.9); }
  .interactive-text.active { border-color:#ff0050; background:rgba(255,0,80,0.1); }
  .interactive-text .controls { position:absolute; bottom:-30px; left:50%; transform:translateX(-50%); display:flex; gap:6px; background:#222; padding:4px 8px; border-radius:12px; opacity:0; transition:0.2s; }
  .interactive-text.active .controls { opacity:1; pointer-events:auto; }
  .interactive-text .controls button { background:none; border:none; color:#fff; cursor:pointer; font-size:1rem; }

  /* MUSIC KATALOG */
  .music-catalog-view { position:absolute; inset:0; background:#1a1a1a; z-index:10; display:flex; flex-direction:column; }
  .music-catalog-header { display:flex; justify-content:space-between; align-items:center; padding:16px; border-bottom:1px solid #333; }
  .music-list { flex:1; overflow-y:auto; padding:12px; }
  .song-item { display:flex; align-items:center; gap:12px; background:#222; padding:12px; border-radius:8px; margin-bottom:8px; cursor:pointer; border:1px solid transparent; }
  .song-item.selected { border-color:#f7b733; background:#333; }
  .song-icon { width:40px; height:40px; border-radius:8px; background:linear-gradient(135deg,#f7b733,#fc4a1a); display:flex; justify-content:center; align-items:center; font-size:1.2rem; }
  .song-info { flex:1; }
  .song-title { font-weight:bold; font-size:0.9rem; }
  .song-meta { font-size:0.75rem; color:#aaa; }

  .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px); background:#333; color:#fff; padding:12px 20px; border-radius:24px; z-index:500; opacity:0; transition:0.3s; pointer-events:none; text-align:center; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <header class="navbar">
    <div class="profile-nav-btn" id="btnProfile">
      <img id="navAvatar" src="https://ui-avatars.com/api/?name=User&background=random" alt="Profile" />
    </div>
    <div class="nav-buttons">

  <main id="feedView" class="feed-container"></main>

          <input type="text" id="inputJoinCode" placeholder="KODE UNDANGAN" style="width:100%; padding:12px; background:#222; border:1px solid #444; border-radius:8px; color:#fff; text-align:center; margin-bottom:10px; text-transform:uppercase;">
          <button id="btnJoinRoom" class="btn-primary" style="width:100%; margin:0; background:#333;">🚪 Gabung</button>

      <div class="form-group"><label>Username</label><input type="text" id="inputUsername" /></div>
      <button class="btn-primary" id="btnSaveProfile">Simpan Profil</button>

  <div id="toast" class="toast"></div>

<script>
  // ===== STATE =====
  const STORAGE_KEY = 'vidstream_final_v2';
  let state = { coins: 0, userVideos: [], comments: {}, likedVideos: {}, followedUsers: {}, profile: { name: "Pengguna", username: "@user", avatar: "https://ui-avatars.com/api/?name=User&background=random" } };
  
  // ===== DB & UTILS =====
  const DB_NAME = 'vidstream_db', DB_STORE = 'videos'; let db;
  function initDB() { return new Promise((res) => { const req = indexedDB.open(DB_NAME, 1); req.onupgradeneeded = e => { if(!e.target.result.objectStoreNames.contains(DB_STORE)) e.target.result.createObjectStore(DB_STORE, {keyPath:'id'}); }; req.onsuccess = e => { db = e.target.result; res(); }; }); }
  function saveVideoDB(id, blob) { return new Promise(res => { const tx = db.transaction(DB_STORE, 'readwrite'); tx.objectStore(DB_STORE).put({id, blob}).onsuccess = () => res(); }); }
  function getVideoDB(id) { return new Promise(res => { const tx = db.transaction(DB_STORE, 'readonly'); tx.objectStore(DB_STORE).get(id).onsuccess = e => res(e.target.result ? e.target.result.blob : null); }); }
  function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  function showToast(m, t='info') { const el = document.getElementById('toast'); el.textContent = m; el.style.background = t==='error'?'#ff0050':t==='success'?'#00c853':'#333'; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'), 2500); }
  function formatNum(n) { return n >= 1000 ? (n/1000).toFixed(1)+'K' : n; }
  
  function updateUI() {
    document.getElementById('navBalance').textContent = state.coins;
    document.getElementById('coinBalance').textContent = state.coins;
    document.getElementById('coinRupiah').textContent = (state.coins * 100).toLocaleString('id-ID');
    document.getElementById('btnWithdraw').disabled = state.coins < 1000;
    document.getElementById('navAvatar').src = state.profile.avatar;
    document.getElementById('profilePreview').src = state.profile.avatar;
    document.getElementById('profileNameDisplay').textContent = state.profile.name;
    document.getElementById('profileUsernameDisplay').textContent = state.profile.username;
    document.getElementById('inputDisplayName').value = state.profile.name;
    document.getElementById('inputUsername').value = state.profile.username;
  }

  const defaultVideos = [
    { id:1, username:"@nature_vibes", caption:"Sunset di pantai 🏖️", src:"https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4", likes:1240 }
  ];
  function getAllVideos() { return [...state.userVideos, ...defaultVideos]; }

  // ===== PROFILE =====
  document.getElementById('btnProfile').onclick = () => document.getElementById('profileModal').classList.remove('hidden');
  document.getElementById('closeProfile').onclick = () => document.getElementById('profileModal').classList.add('hidden');
  document.getElementById('avatarUpload').onchange = (e) => {
    const f = e.target.files[0]; if(f) { const r = new FileReader(); r.onload = ev => { state.profile.avatar = ev.target.result; updateUI(); }; r.readAsDataURL(f); }
  };
  document.getElementById('btnSaveProfile').onclick = () => {
    state.profile.name = document.getElementById('inputDisplayName').value.trim();
    state.profile.username = document.getElementById('inputUsername').value.trim();
    saveState(); updateUI(); showToast('Profil disimpan!', 'success'); document.getElementById('profileModal').classList.add('hidden');
  };

  // ===== MONETISASI =====
  document.getElementById('btnMonet').onclick = () => { updateUI(); document.getElementById('monetModal').classList.remove('hidden'); };
  document.getElementById('closeMonet').onclick = () => document.getElementById('monetModal').classList.add('hidden');
  document.querySelectorAll('.price-item').forEach(el => {
    el.onclick = () => { const c = parseInt(el.dataset.coins), p = parseInt(el.dataset.price); if(confirm(`Beli ${c} Koin seharga Rp ${p}?`)) { state.coins += c; saveState(); updateUI(); showToast('Berhasil!', 'success'); } };
  });
  document.getElementById('btnWithdraw').onclick = () => {
    if(state.coins < 1000) return; if(confirm(`Tarik ${state.coins} Koin ke Rupiah?`)) { state.coins = 0; saveState(); updateUI(); showToast('Withdraw diproses!', 'success'); }
  };

  // ===== UPLOAD & CAMERA =====
  let pendingFile = null, streamRef = null, mediaRecorder, chunks = [], facingMode = 'user';
  let textState = { x: 50, y: 50, size: 24, rot: 0 };
  let selectedMusicUrl = "", selectedMusicTitle = "Suara Asli";

  const songList = [
    { t: 'DJ Remix Viral', u: 'https://cdn.pixabay.com/audio/2022/03/15/audio_c8c8a73467.mp3', g: 'EDM' },
    { t: 'Aesthetic Bass', u: 'https://cdn.pixabay.com/audio/2022/05/27/audio_1808fbf07a.mp3', g: 'Chill' },
    { t: 'Upbeat Pop', u: 'https://cdn.pixabay.com/audio/2021/11/25/audio_91b32e02f9.mp3', g: 'Pop' },
  ];

  async function startCamera() {
    if(streamRef) streamRef.getTracks().forEach(t => t.stop());
    try { streamRef = await navigator.mediaDevices.getUserMedia({ video: { facingMode }, audio: true }); document.getElementById('liveCamera').srcObject = streamRef; } catch(e) { showToast('Kamera gagal', 'error'); }
  }
  function stopCamera() { if(streamRef) { streamRef.getTracks().forEach(t => t.stop()); streamRef = null; } }

  document.getElementById('btnUpload').onclick = () => { document.getElementById('uploadModal').classList.remove('hidden'); document.getElementById('pageSelect').classList.remove('hidden'); document.getElementById('pageEditor').classList.add('hidden'); document.getElementById('pageMusic').classList.add('hidden'); document.getElementById('uploadUsername').value = state.profile.username; document.getElementById('uploadCaption').value = ''; startCamera(); };
  document.getElementById('closeUpload').onclick = () => { document.getElementById('uploadModal').classList.add('hidden'); stopCamera(); };
  
  document.getElementById('tabCam').onclick = () => { document.getElementById('tabCam').classList.add('active'); document.getElementById('tabGal').classList.remove('active'); document.getElementById('sectionCam').classList.remove('hidden'); document.getElementById('sectionGal').classList.add('hidden'); startCamera(); };
  document.getElementById('tabGal').onclick = () => { document.getElementById('tabGal').classList.add('active'); document.getElementById('tabCam').classList.remove('active'); document.getElementById('sectionGal').classList.remove('hidden'); document.getElementById('sectionCam').classList.add('hidden'); stopCamera(); };
  
  document.getElementById('btnFlipCam').onclick = () => { facingMode = facingMode === 'user' ? 'environment' : 'user'; startCamera(); };
  document.getElementById('btnRecord').onclick = () => {
    if(!streamRef) return;
    if(mediaRecorder && mediaRecorder.state === 'recording') { mediaRecorder.stop(); document.getElementById('btnRecord').classList.remove('recording'); }
    else { chunks = []; mediaRecorder = new MediaRecorder(streamRef); mediaRecorder.ondataavailable = e => chunks.push(e.data); mediaRecorder.onstop = () => { pendingFile = new File([new Blob(chunks, {type:'video/webm'})], "rec.webm", {type:'video/webm'}); stopCamera(); showEditor(); }; mediaRecorder.start(); document.getElementById('btnRecord').classList.add('recording'); }
  };
  
  document.getElementById('dropzone').onclick = () => document.getElementById('fileInput').click();
  document.getElementById('fileInput').onchange = (e) => { if(e.target.files[0]) { pendingFile = e.target.files[0]; showEditor(); } };

  function showEditor() {
    document.getElementById('pageSelect').classList.add('hidden'); document.getElementById('pageEditor').classList.remove('hidden');
    document.getElementById('previewVideo').src = URL.createObjectURL(pendingFile); document.getElementById('previewVideo').play();
    validateForm();
  }
  function validateForm() { document.getElementById('btnSubmitUpload').disabled = !(document.getElementById('uploadUsername').value.trim() && document.getElementById('uploadCaption').value.trim() && pendingFile); }
  document.getElementById('uploadUsername').oninput = validateForm; document.getElementById('uploadCaption').oninput = validateForm;

  // Editor Text Drag
  const iText = document.getElementById('interactiveText'); let drag = false, sX, sY, iX, iY;
  iText.onpointerdown = (e) => { if(e.target.tagName==='BUTTON') return; drag = true; iText.classList.add('active'); sX = e.clientX; sY = e.clientY; const r = document.getElementById('previewVideo').getBoundingClientRect(); iX = (textState.x/100)*r.width; iY = (textState.y/100)*r.height; iText.setPointerCapture(e.pointerId); };
  iText.onpointermove = (e) => { if(!drag) return; const r = document.getElementById('previewVideo').getBoundingClientRect(); let nX = Math.max(0, Math.min(iX + (e.clientX - sX), r.width)); let nY = Math.max(0, Math.min(iY + (e.clientY - sY), r.height)); textState.x = (nX/r.width)*100; textState.y = (nY/r.height)*100; updateTxtPos(); };
  iText.onpointerup = (e) => { drag = false; iText.releasePointerCapture(e.pointerId); };
  function updateTxtPos() { iText.style.left = textState.x + '%'; iText.style.top = textState.y + '%'; iText.style.transform = `translate(-50%,-50%) rotate(${textState.rot}deg)`; }
  
  document.getElementById('inputText').oninput = (e) => { if(!e.target.value.trim()) iText.classList.add('hidden'); else { iText.classList.remove('hidden'); iText.childNodes[0].nodeValue = e.target.value; } };
  document.getElementById('selectFont').onchange = (e) => iText.style.fontFamily = e.target.value;
  document.getElementById('selectColor').onchange = (e) => iText.style.color = e.target.value;
  document.getElementById('btnTxtPlus').onclick = (e) => { e.stopPropagation(); textState.size+=4; iText.style.fontSize = textState.size+'px'; };
  document.getElementById('btnTxtMin').onclick = (e) => { e.stopPropagation(); textState.size=Math.max(10, textState.size-4); iText.style.fontSize = textState.size+'px'; };
  document.getElementById('btnTxtRot').onclick = (e) => { e.stopPropagation(); textState.rot+=45; updateTxtPos(); };
  document.getElementById('previewVideo').onclick = () => iText.classList.remove('active');

  // Music Catalog
  document.getElementById('btnOpenMusic').onclick = () => { document.getElementById('pageMusic').classList.remove('hidden'); renderMusic(); };
  document.getElementById('closeMusic').onclick = () => document.getElementById('pageMusic').classList.add('hidden');
  function renderMusic() {
    const list = document.getElementById('musicList');
    list.innerHTML = `<div class="song-item ${selectedMusicUrl===''?'selected':''}" data-url="" data-title="Suara Asli"><div class="song-icon">🎤</div><div class="song-info"><div class="song-title">Suara Asli Video</div></div></div>` + 
    songList.map(s => `<div class="song-item ${selectedMusicUrl===s.u?'selected':''}" data-url="${s.u}" data-title="${s.t}"><div class="song-icon">🎵</div><div class="song-info"><div class="song-title">${s.t}</div><div class="song-meta">${s.g}</div></div></div>`).join('');
    list.querySelectorAll('.song-item').forEach(el => el.onclick = () => { selectedMusicUrl = el.dataset.url; selectedMusicTitle = el.dataset.title; document.getElementById('txtSelectedMusic').textContent = selectedMusicTitle; document.getElementById('pageMusic').classList.add('hidden'); });
  }

  document.getElementById('btnSubmitUpload').onclick = async () => {
    if(!pendingFile) return; document.getElementById('btnSubmitUpload').textContent = '⏳ Menyimpan...';
    const id = Date.now();
    const overlayData = document.getElementById('inputText').value.trim() ? { text: document.getElementById('inputText').value.trim(), x: textState.x, y: textState.y, size: textState.size, rot: textState.rot, color: document.getElementById('selectColor').value, font: document.getElementById('selectFont').value } : null;
    await saveVideoDB(id, pendingFile);
    state.userVideos.unshift({ id, username: document.getElementById('uploadUsername').value.trim(), caption: document.getElementById('uploadCaption').value.trim(), src: null, likes: 0, music: selectedMusicUrl, overlayData });
    saveState(); showToast('Berhasil publish!', 'success'); document.getElementById('uploadModal').classList.add('hidden'); renderFeed();
  };

  // ===== KOMENTAR & SHARE =====
  let commentTargetId = null;
  function openComments(id) { commentTargetId = id; renderComments(id); document.getElementById('commentSheet').classList.add('show'); }
  function renderComments(id) {
    const cmts = state.comments[id] || []; document.getElementById('commentCount').textContent = cmts.length;
    document.getElementById('commentList').innerHTML = cmts.length ? cmts.map(c => `<div class="comment-item"><div class="comment-avatar">${c.user.charAt(1).toUpperCase()}</div><div class="comment-body"><div class="c-user">${c.user}</div><div class="c-text">${c.text}</div></div></div>`).join('') : `<p style="color:#666; text-align:center;">Belum ada komentar</p>`;
    document.getElementById('commentList').scrollTop = 9999;
  }
  document.getElementById('closeComment').onclick = () => document.getElementById('commentSheet').classList.remove('show');
  document.getElementById('sendComment').onclick = () => { const v = document.getElementById('commentInput').value.trim(); if(!v || !commentTargetId) return; if(!state.comments[commentTargetId]) state.comments[commentTargetId] = []; state.comments[commentTargetId].push({user:state.profile.username, text:v}); saveState(); document.getElementById('commentInput').value = ''; renderComments(commentTargetId); };

  function shareVideo(v) {
    if(navigator.share) navigator.share({ title:'VidStream', text:`Tonton ${v.username}`, url: window.location.href });
    else { navigator.clipboard.writeText(window.location.href); showToast('Link disalin!', 'success'); }
  }
  function sendTip(v) {
    const a = prompt(`Kirim tips ke ${v.username}\nSaldo: ${state.coins} Koin\nMasukkan jumlah (min 10):`, '10');
    if(!a) return; const n = parseInt(a); if(isNaN(n) || n < 10) { showToast('Minimal 10 koin', 'error'); return; }
    if(n > state.coins) { showToast('Saldo kurang', 'error'); return; }
    state.coins -= n; saveState(); updateUI(); showToast(`Berhasil kirim ${n} koin!`, 'success');
  }

  // ===== RENDER FEED =====
  async function renderFeed() {
    const feed = document.getElementById('feedView'); feed.innerHTML = '';
    for(let v of getAllVideos()) {
      const card = document.createElement('div'); card.className = 'video-card';
      const isLiked = state.likedVideos[v.id];
      let overlayHTML = v.overlayData ? `<div class="video-text-overlay" style="left:${v.overlayData.x}%; top:${v.overlayData.y}%; transform:translate(-50%,-50%) rotate(${v.overlayData.rot}deg); font-size:${v.overlayData.size}px; color:${v.overlayData.color}; font-family:${v.overlayData.font};">${v.overlayData.text}</div>` : '';
      
      card.innerHTML = `
        <video loop muted playsinline preload="metadata"></video>
        ${v.music ? `<audio class="bg-music" src="${v.music}" loop></audio>` : ''}
        <button class="mute-btn">🔇</button>
        ${overlayHTML}
        <div class="play-indicator">▶</div>
        <div class="progress-bar"><div class="progress-fill"></div></div>
        <div class="video-info">
          <div class="user-row">
            <div class="username">${v.username}</div>
            <button class="follow-btn ${state.followedUsers[v.username] ? 'followed' : ''}" data-u="${v.username}">${state.followedUsers[v.username] ? '✓ Following' : '+ Follow'}</button>
          </div>
          <div class="caption">${v.caption}</div>
        </div>
        <div class="side-actions">
          <button class="action-btn like-btn" style="${isLiked ? 'filter:drop-shadow(0 0 6px #ff0050)' : ''}">${isLiked ? '❤️' : '🤍'}<span>${formatNum(v.likes + (isLiked?1:0))}</span></button>
          <button class="action-btn comment-btn">💬<span>${formatNum((state.comments[v.id]||[]).length)}</span></button>
          <button class="action-btn tip-btn" style="color:#f7b733;">🎁<span>Tips</span></button>
          <button class="action-btn share-btn" style="color:#00bfff;">↗️<span>Share</span></button>
        </div>
      `;
      
      const vid = card.querySelector('video');
      if(v.src) vid.src = v.src; else { try { const b = await getVideoDB(v.id); if(b) vid.src = URL.createObjectURL(b); } catch(e){} }

      // Listeners
      card.querySelector('.mute-btn').onclick = (e) => { e.stopPropagation(); vid.muted = !vid.muted; if(card.querySelector('.bg-music')) card.querySelector('.bg-music').muted = vid.muted; e.target.textContent = vid.muted ? '🔇' : '🔊'; };
      card.querySelector('.like-btn').onclick = (e) => { e.stopPropagation(); if(state.likedVideos[v.id]) delete state.likedVideos[v.id]; else state.likedVideos[v.id] = true; saveState(); renderFeed(); };
      card.querySelector('.comment-btn').onclick = (e) => { e.stopPropagation(); openComments(v.id); };
      card.querySelector('.share-btn').onclick = (e) => { e.stopPropagation(); shareVideo(v); };
      card.querySelector('.tip-btn').onclick = (e) => { e.stopPropagation(); sendTip(v); };
      card.querySelector('.follow-btn').onclick = (e) => { e.stopPropagation(); const u = v.username; if(state.followedUsers[u]) delete state.followedUsers[u]; else state.followedUsers[u] = true; saveState(); renderFeed(); };
      
      vid.onclick = () => { const ind = card.querySelector('.play-indicator'); if(vid.paused) { vid.play(); ind.textContent = '▶'; } else { vid.pause(); ind.textContent = '⏸'; } ind.classList.add('show'); setTimeout(() => ind.classList.remove('show'), 400); };
      vid.ontimeupdate = () => { if(vid.duration) card.querySelector('.progress-fill').style.width = (vid.currentTime/vid.duration*100)+'%'; };
      
      feed.appendChild(card);
    }
    observeFeed();
  }

  function observeFeed() {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(en => { const vid = en.target.querySelector('video'); const bg = en.target.querySelector('.bg-music'); if(en.isIntersecting && en.intersectionRatio > 0.6) { vid.play().catch(()=>{}); if(bg) bg.play().catch(()=>{}); } else { vid.pause(); vid.currentTime = 0; if(bg) { bg.pause(); bg.currentTime = 0; } } });
    }, { threshold: [0, 0.6, 1] });
    document.querySelectorAll('.video-card').forEach(c => obs.observe(c));
  }

  // ===== NAVIGASI & INIT =====
  document.getElementById('btnFeed').onclick = () => { document.getElementById('feedView').classList.remove('hidden'); document.getElementById('gridView').classList.add('hidden'); document.getElementById('btnFeed').classList.add('active'); document.getElementById('btnGrid').classList.remove('active'); };
  document.getElementById('btnGrid').onclick = () => { document.getElementById('gridView').classList.remove('hidden'); document.getElementById('feedView').classList.add('hidden'); document.getElementById('btnGrid').classList.add('active'); document.getElementById('btnFeed').classList.remove('active'); };
  
  document.getElementById('btnLive').onclick = () => document.getElementById('liveModal').classList.remove('hidden');
  document.getElementById('closeLive').onclick = () => document.getElementById('liveModal').classList.add('hidden');

  (async () => {
    const s = localStorage.getItem(STORAGE_KEY); if(s) state = { ...state, ...JSON.parse(s) };
    await initDB(); updateUI(); renderFeed();
  })();
</script>
</body>
</html>
