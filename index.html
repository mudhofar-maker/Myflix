<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>TikVid - Video Pendek</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/plus-jakarta-sans@5.0.3/index.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #000;
    color: #fff;
    user-select: none;
  }
  #app {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 480px;
    margin: 0 auto;
    background: #000;
    overflow: hidden;
  }
  /* Top Bar */
  .top-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 50;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  }
  .top-bar .live-btn {
    font-size: 14px; font-weight: 600;
    opacity: 0.85; cursor: pointer;
  }
  .top-bar .tabs {
    display: flex;
    gap: 20px;
    font-size: 16px;
    font-weight: 600;
  }
  .top-bar .tab { opacity: 0.6; cursor: pointer; position: relative; padding: 4px 2px; }
  .top-bar .tab.active { opacity: 1; }
  .top-bar .tab.active::after {
    content: '';
    position: absolute;
    bottom: -4px; left: 50%;
    transform: translateX(-50%);
    width: 18px; height: 3px;
    background: #fff;
    border-radius: 2px;
  }
  .top-bar .search-btn {
    font-size: 22px;
    cursor: pointer;
  }
  /* Feed */
  .feed {
    width: 100%;
    height: 100%;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
  }
  .feed::-webkit-scrollbar { display: none; }
  .video-slide {
    position: relative;
    width: 100%;
    height: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    overflow: hidden;
    background: #000;
  }
  .video-slide canvas, .video-slide video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }
  /* Play/Pause indicator */
  .play-indicator {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 80px;
    opacity: 0;
    pointer-events: none;
    transition: transform 0.25s ease, opacity 0.25s ease;
    z-index: 20;
    text-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .play-indicator.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 0.9;
  }
  /* Double tap heart */
  .double-tap-heart {
    position: absolute;
    font-size: 100px;
    color: #ff2d55;
    pointer-events: none;
    z-index: 25;
    animation: heartPop 1s ease-out forwards;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
  }
  @keyframes heartPop {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-15deg); opacity: 0; }
    20% { transform: translate(-50%, -50%) scale(1.3) rotate(10deg); opacity: 1; }
    40% { transform: translate(-50%, -50%) scale(1) rotate(-5deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.1) rotate(0); opacity: 0; }
  }
  /* Sidebar */
  .sidebar {
    position: absolute;
    right: 10px;
    bottom: 110px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    z-index: 10;
  }
  .sidebar .avatar-wrap {
    position: relative;
    margin-bottom: 8px;
  }
  .sidebar .avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 2px solid #fff;
    background: linear-gradient(135deg, #ff2d55, #ff9500);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 18px;
    overflow: hidden;
  }
  .sidebar .follow-btn {
    position: absolute;
    bottom: -10px; left: 50%;
    transform: translateX(-50%);
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #ff2d55;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: 2px solid #000;
    transition: transform 0.2s;
  }
  .sidebar .follow-btn.followed {
    background: #2ecc71;
    transform: translateX(-50%) scale(0.9);
  }
  .sidebar .action {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }
  .sidebar .action .icon {
    width: 44px; height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    transition: transform 0.15s;
  }
  .sidebar .action:active .icon { transform: scale(0.85); }
  .sidebar .action .count {
    font-size: 12px;
    font-weight: 600;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
  .sidebar .like-btn.liked .icon { color: #ff2d55; }
  .sidebar .like-btn.liked .icon svg { fill: #ff2d55; }
  .sidebar .bookmark-btn.bookmarked .icon svg { fill: #ffd700; }
  /* Bottom Info */
  .bottom-info {
    position: absolute;
    left: 12px;
    right: 80px;
    bottom: 80px;
    z-index: 10;
    background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
    padding: 30px 0 10px;
    margin: 0 -12px;
    padding-left: 12px;
    padding-right: 12px;
  }
  .bottom-info .username {
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 6px;
  }
  .bottom-info .caption {
    font-size: 14px;
    line-height: 1.4;
    margin-bottom: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .bottom-info .caption .hashtag { font-weight: 600; }
  .bottom-info .music {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    overflow: hidden;
  }
  .bottom-info .music .marquee {
    overflow: hidden;
    white-space: nowrap;
    flex: 1;
    mask-image: linear-gradient(to right, transparent, #000 10%, #000 90%, transparent);
  }
  .bottom-info .music .marquee span {
    display: inline-block;
    padding-right: 40px;
    animation: marquee 12s linear infinite;
  }
  @keyframes marquee {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  /* Progress bar */
  .progress-bar {
    position: absolute;
    bottom: 60px;
    left: 0; right: 0;
    height: 2px;
    background: rgba(255,255,255,0.2);
    z-index: 15;
  }
  .progress-bar .progress {
    height: 100%;
    background: #fff;
    width: 0%;
    transition: width 0.1s linear;
  }
  /* Bottom Nav */
  .bottom-nav {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 60px;
    background: #000;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 40;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .bottom-nav .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 10px;
    color: #fff;
    opacity: 0.6;
    cursor: pointer;
    padding: 6px 0;
    transition: opacity 0.2s;
  }
  .bottom-nav .nav-item.active { opacity: 1; }
  .bottom-nav .nav-item .nav-icon {
    font-size: 22px;
    line-height: 1;
  }
  .bottom-nav .upload-btn {
    width: 44px; height: 30px;
    background: linear-gradient(90deg, #25f4ee, #fff, #fe2c55);
    border-radius: 8px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .bottom-nav .upload-btn::before {
    content: '+';
    position: absolute;
    inset: 0;
    background: #000;
    border-radius: 6px;
    margin: 2px 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 22px;
    font-weight: 300;
  }
  /* Modal */
  .modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    display: none;
    align-items: flex-end;
    animation: fadeIn 0.25s ease;
  }
  .modal-overlay.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    width: 100%;
    max-height: 70%;
    background: #1c1c1e;
    border-radius: 16px 16px 0 0;
    padding: 16px;
    animation: slideUp 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
    display: flex;
    flex-direction: column;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-header {
    text-align: center;
    font-weight: 700;
    font-size: 15px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    position: relative;
  }
  .modal-close {
    position: absolute;
    right: 0; top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    cursor: pointer;
    padding: 4px 8px;
  }
  /* Comments */
  .comments-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 0;
    max-height: 400px;
  }
  .comment-item {
    display: flex;
    gap: 10px;
    padding: 10px 0;
  }
  .comment-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
  }
  .comment-body { flex: 1; }
  .comment-user {
    font-size: 13px;
    opacity: 0.6;
    margin-bottom: 2px;
  }
  .comment-text {
    font-size: 14px;
    line-height: 1.4;
  }
  .comment-meta {
    font-size: 12px;
    opacity: 0.5;
    margin-top: 4px;
    display: flex;
    gap: 14px;
  }
  .comment-input-wrap {
    display: flex;
    gap: 10px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .comment-input {
    flex: 1;
    background: #2c2c2e;
    border: none;
    border-radius: 20px;
    padding: 10px 16px;
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  .comment-send {
    background: #fe2c55;
    border: none;
    color: #fff;
    padding: 0 18px;
    border-radius: 20px;
    font-weight: 600;
    cursor: pointer;
  }
  /* Share */
  .share-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    padding: 16px 0;
  }
  .share-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .share-icon {
    width: 50px; height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }
  /* Toast */
  .toast {
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(0,0,0,0.85);
    color: #fff;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    z-index: 200;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  /* Mute indicator */
  .mute-indicator {
    position: absolute;
    top: 60px;
    right: 16px;
    background: rgba(0,0,0,0.5);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 30;
    cursor: pointer;
  }

  /* --- CAMERA / UPLOAD STUDIO MODAL --- */
  .camera-modal {
    position: absolute;
    inset: 0;
    background: #000;
    z-index: 300;
    display: none;
    flex-direction: column;
    justify-content: space-between;
    padding: 20px;
  }
  .camera-modal.show { display: flex; }
  .camera-preview-wrap {
    position: absolute;
    inset: 0;
    background: #111;
    z-index: 1;
    overflow: hidden;
  }
  #cameraVideo {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .camera-top-bar {
    position: relative;
    z-index: 5;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 20px;
  }
  .camera-controls {
    position: relative;
    z-index: 5;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding-bottom: 30px;
  }
  .cam-btn {
    background: rgba(255,255,255,0.2);
    border: none;
    color: #fff;
    padding: 12px 18px;
    border-radius: 30px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .record-shutter {
    width: 70px; height: 70px;
    border-radius: 50%;
    border: 4px solid #fff;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
  }
  .record-shutter-inner {
    width: 54px; height: 54px;
    background: #fe2c55;
    border-radius: 50%;
    transition: all 0.2s;
  }
  .record-shutter.recording .record-shutter-inner {
    width: 30px; height: 30px;
    border-radius: 4px;
  }
</style>
</head>

<div id="app">
  <!-- Top Bar -->

  <!-- Comments Modal -->
  <div class="modal-overlay" id="commentsModal">
    <div class="modal">

        <div class="modal-close" data-close="commentsModal">✕</div>
      </div>
      <div class="comments-list" id="commentsList"></div>
      <div class="comment-input-wrap">
        <input type="text" class="comment-input" id="commentInput" placeholder="Tambah komentar..." />
        <button class="comment-send" id="commentSend">Kirim</button>
      </div>
    </div>
  </div>

  <!-- Share Modal -->
  <div class="modal-overlay" id="shareModal">
    <div class="modal">
      <div class="modal-header">
        Bagikan ke

      </div>
      <div class="share-grid" id="shareGrid"></div>
    </div>
  </div>

  <!-- Search Modal -->
  <div class="modal-overlay" id="searchModal">
    <div class="modal" style="height: 300px;">
      <div class="modal-header">
        Cari Video / Akun
        <div class="modal-close" data-close="searchModal">✕</div>
      </div>
      <div style="padding-top: 15px;">
        <input type="text" class="comment-input" id="searchInput" placeholder="Cari tag, musik, atau kreator..." style="width: 100%; margin-bottom: 15px;" />
        <button class="comment-send" id="executeSearch" style="width: 100%; border-radius: 20px; padding: 10px;">Cari Sekarang</button>
      </div>
    </div>
  </div>

  <!-- Camera & Upload Studio Modal -->
  <div class="camera-modal" id="cameraModal">
    <div class="camera-preview-wrap">
      <video id="cameraVideo" autoplay playsinline muted></video>
    </div>
    <div class="camera-top-bar">
      <div style="cursor: pointer;" id="closeCamera">✕ Batal</div>
      <div id="recordingTimer" style="font-weight: 700; color: #fe2c55; display: none;">● 00:00</div>
      <div style="cursor: pointer;" id="switchCameraBtn">🔄 Putar Kamera</div>
    </div>
    <div class="camera-controls">
      <button class="cam-btn" id="uploadGalleryBtn">📁 Galeri</button>
      <div class="record-shutter" id="recordShutter">
        <div class="record-shutter-inner"></div>
      </div>
      <button class="cam-btn" id="flipCamText">Kamera</button>
    </div>
    <input type="file" id="galleryInput" accept="video/*" style="display: none;" />
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>
</div>

              <svg width="30" height="30" viewBox="0 0 24 24" fill="white">

  renderFeed(videos);

  // Add spin animation style
  const styleEl = document.createElement('style');
  styleEl.textContent = `@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }`;
  document.head.appendChild(styleEl);

  // ============ CANVAS ANIMATIONS ============
  const animations = [];

  function initAnimations() {
    animations.length = 0;
    const slides = document.querySelectorAll('.video-slide');
    slides.forEach((slide, idx) => {
      const canvas = slide.querySelector('canvas');
      if (!canvas) return;
      const theme = videos[idx].theme;
      animations[idx] = createAnimation(canvas, theme, idx);
    });
  }

  function createAnimation(canvas, theme, idx) {
    const ctx = canvas.getContext('2d');
    let w, h;
    let particles = [];
    let t = 0;
    let paused = false;
    let startTime = performance.now();
    const duration = 15000;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      w = rect.width;
      h = rect.height;
    }
    resize();

    // Particle setup
    if (theme === 'sunset') {
      for (let i = 0; i < 60; i++) particles.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 2 + 0.5, vy: -Math.random() * 0.5 - 0.2, vx: (Math.random() - 0.5) * 0.3, a: Math.random() * 0.8 + 0.2 });
    } else if (theme === 'ocean') {
      for (let i = 0; i < 40; i++) particles.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 3 + 1, vy: Math.random() * 0.3 + 0.1, vx: (Math.random() - 0.5) * 0.5, a: Math.random() * 0.5 + 0.3 });
    } else if (theme === 'aurora') {
      for (let i = 0; i < 80; i++) particles.push({ x: Math.random() * w, y: Math.random() * h * 0.7, r: Math.random() * 1.5 + 0.3, vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.3, a: Math.random() * 0.8 + 0.2, hue: Math.random() * 120 + 120 });
    } else if (theme === 'city') {
      for (let i = 0; i < 100; i++) particles.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.5 + 0.3, a: Math.random(), color: ['#ff0099', '#ffcc00', '#00ffff', '#ff6600', '#ffffff'][Math.floor(Math.random() * 5)] });
    } else if (theme === 'forest') {
      for (let i = 0; i < 50; i++) particles.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 2 + 1, vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4, a: Math.random(), phase: Math.random() * Math.PI * 2 });
    } else if (theme === 'space') {
      for (let i = 0; i < 200; i++) particles.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.8 + 0.2, a: Math.random(), twinkle: Math.random() * 0.05 + 0.01, color: Math.random() > 0.7 ? '#aaddff' : '#ffffff' });
    }

    function draw() {
      if (paused) {
        animations[idx].raf = requestAnimationFrame(draw);
        return;
      }
      t += 0.016;
      const progress = ((performance.now() - startTime) % duration) / duration;
      const progressBar = document.getElementById(`progress-${idx}`);
      if (progressBar) progressBar.style.width = (progress * 100) + '%';

      if (theme === 'sunset') {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#2c1810'); grad.addColorStop(0.3, '#ff6b35'); grad.addColorStop(0.6, '#f7931e'); grad.addColorStop(0.8, '#ffcc70'); grad.addColorStop(1, '#4a2c2a');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        const sunY = h * 0.55 + Math.sin(t * 0.3) * 10;
        ctx.beginPath(); ctx.arc(w/2, sunY, 50, 0, Math.PI * 2); ctx.fillStyle = '#fff4d6'; ctx.fill();
        ctx.fillStyle = 'rgba(30, 20, 40, 0.6)'; ctx.fillRect(0, h * 0.7, w, h * 0.3);
        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy;
          if (p.y < 0) { p.y = h; p.x = Math.random() * w; }
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fillStyle = `rgba(255, 220, 150, ${p.a * 0.6})`; ctx.fill();
        });
      } else if (theme === 'ocean') {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#0a2540'); grad.addColorStop(0.5, '#1e5799'); grad.addColorStop(1, '#2989d8');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        for (let layer = 0; layer < 5; layer++) {
          ctx.beginPath(); const yBase = h * 0.4 + layer * 40; ctx.moveTo(0, yBase);
          for (let x = 0; x <= w; x += 10) { const y = yBase + Math.sin((x * 0.02) + t * (1 + layer * 0.3) + layer) * (15 - layer * 2); ctx.lineTo(x, y); }
          ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
          ctx.fillStyle = `rgba(${100 + layer * 20}, ${180 + layer * 10}, 230, ${0.3 + layer * 0.1})`; ctx.fill();
        }
      } else if (theme === 'aurora') {
        ctx.fillStyle = '#050520'; ctx.fillRect(0, 0, w, h);
        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fillStyle = `hsla(${p.hue}, 100%, 70%, ${p.a})`; ctx.fill();
        });
      } else if (theme === 'city') {
        ctx.fillStyle = '#1a0033'; ctx.fillRect(0, 0, w, h);
        particles.forEach(p => {
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 2, 0, Math.PI * 2); ctx.fillStyle = p.color; ctx.globalAlpha = p.a; ctx.fill(); ctx.globalAlpha = 1;
        });
      } else if (theme === 'forest') {
        ctx.fillStyle = '#0a1f0a'; ctx.fillRect(0, 0, w, h);
        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fillStyle = `rgba(255, 255, 200, ${p.a})`; ctx.fill();
        });
      } else if (theme === 'space') {
        ctx.fillStyle = '#000010'; ctx.fillRect(0, 0, w, h);
        particles.forEach(p => {
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fillStyle = p.color; ctx.globalAlpha = p.a; ctx.fill(); ctx.globalAlpha = 1;
        });
      }

      animations[idx].raf = requestAnimationFrame(draw);
    }
    draw();

    return {
      pause: () => { paused = true; },
      resume: () => { paused = false; },
      isPaused: () => paused,
      raf: null
    };
  }

  initAnimations();

  // ============ INTERACTIONS & EVENT LISTENERS ============
  const state = videos.map(v => ({
    liked: false,
    bookmarked: false,
    followed: false,
    likes: v.likes,
    bookmarks: v.bookmarks,
    comments: [...sampleComments]
  }));

  // Tap feed for play/pause or double tap like
  let lastTap = 0;
  let tapTimeout = null;
  feed.addEventListener('click', (e) => {
    if (e.target.closest('.sidebar') || e.target.closest('.bottom-info') || e.target.closest('.top-bar')) return;
    const slide = e.target.closest('.video-slide');
    if (!slide) return;
    const idx = parseInt(slide.dataset.idx);
    const now = Date.now();
    if (now - lastTap < 300) {
      clearTimeout(tapTimeout);
      const rect = slide.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const heart = document.createElement('div');
      heart.className = 'double-tap-heart';
      heart.textContent = '❤';
      heart.style.left = x + 'px';
      heart.style.top = y + 'px';
      slide.appendChild(heart);
      setTimeout(() => heart.remove(), 1000);
      if (!state[idx].liked) toggleLike(idx);
    } else {
      tapTimeout = setTimeout(() => {
        const anim = animations[idx];
        const indicator = document.getElementById(`playInd-${idx}`);
        if (anim) {
          if (anim.isPaused()) {
            anim.resume();
            indicator.textContent = '▶';
          } else {
            anim.pause();
            indicator.textContent = '❚❚';
          }
          indicator.classList.add('show');
          setTimeout(() => indicator.classList.remove('show'), 500);
        }
      }, 300);
    }
    lastTap = now;
  });

  // Action Delegation
  feed.addEventListener('click', (e) => {
    const likeBtn = e.target.closest('[data-like]');
    if (likeBtn) {
      e.stopPropagation();
      toggleLike(parseInt(likeBtn.dataset.like));
      return;
    }
    const bookmarkBtn = e.target.closest('[data-bookmark]');
    if (bookmarkBtn) {
      e.stopPropagation();
      const idx = parseInt(bookmarkBtn.dataset.bookmark);
      state[idx].bookmarked = !state[idx].bookmarked;
      state[idx].bookmarks += state[idx].bookmarked ? 1 : -1;
      bookmarkBtn.classList.toggle('bookmarked', state[idx].bookmarked);
      document.getElementById(`bookmarkCount-${idx}`).textContent = formatCount(state[idx].bookmarks);
      showToast(state[idx].bookmarked ? '✓ Disimpan ke favorit' : 'Dihapus dari favorit');
      return;
    }
    const followBtn = e.target.closest('[data-follow]');
    if (followBtn) {
      e.stopPropagation();
      const idx = parseInt(followBtn.dataset.follow);
      state[idx].followed = !state[idx].followed;
      followBtn.classList.toggle('followed', state[idx].followed);
      followBtn.textContent = state[idx].followed ? '✓' : '+';
      showToast(state[idx].followed ? `Mengikuti @${videos[idx].user}` : 'Berhenti mengikuti');
      return;
    }
    const commentBtn = e.target.closest('[data-comment]');
    if (commentBtn) {
      e.stopPropagation();
      openComments(parseInt(commentBtn.dataset.comment));
      return;
    }
    const shareBtn = e.target.closest('[data-share]');
    if (shareBtn) {
      e.stopPropagation();
      openShare(parseInt(shareBtn.dataset.share));
      return;
    }
  });

  function toggleLike(idx) {
    state[idx].liked = !state[idx].liked;
    state[idx].likes += state[idx].liked ? 1 : -1;
    const btn = document.querySelector(`[data-like="${idx}"]`);
    if (btn) {
      btn.classList.toggle('liked', state[idx].liked);
      document.getElementById(`likeCount-${idx}`).textContent = formatCount(state[idx].likes);
    }
  }

  // Comments System
  function openComments(idx) {
    const modal = document.getElementById('commentsModal');
    const list = document.getElementById('commentsList');
    document.getElementById('commentsCount').textContent = `${formatCount(state[idx].comments.length)} Komentar`;
    list.innerHTML = '';
    state[idx].comments.forEach(c => {
      const item = document.createElement('div');
      item.className = 'comment-item';
      item.innerHTML = `
        <div class="comment-avatar" style="background:#ff6b6b">${c.user[0].toUpperCase()}</div>
        <div class="comment-body">
          <div class="comment-user">@${c.user}</div>
          <div class="comment-text">${c.text}</div>

            <span>${c.time}</span>
            <span>♡ ${c.likes}</span>
            <span>Balas</span>
          </div>
        </div>
      `;
      list.appendChild(item);
    });
    modal.classList.add('show');
    modal.dataset.idx = idx;
  }

  document.getElementById('commentSend').addEventListener('click', () => {
    const input = document.getElementById('commentInput');
    const text = input.value.trim();
    if (!text) return;
    const modal = document.getElementById('commentsModal');
    const idx = parseInt(modal.dataset.idx);
    state[idx].comments.unshift({ user: 'saya', text: text, time: 'baru saja', likes: 0 });
    input.value = '';
    openComments(idx);
    showToast('Komentar terkirim');
  });

  // Share System
  function openShare(idx) {
    const modal = document.getElementById('shareModal');
    const grid = document.getElementById('shareGrid');
    grid.innerHTML = '';
    shareOptions.forEach(opt => {
      const item = document.createElement('div');
      item.className = 'share-item';
      item.innerHTML = `
        <div class="share-icon" style="background:${opt.bg}">${opt.icon}</div>
        <div>${opt.name}</div>
      `;
      item.addEventListener('click', () => {
        modal.classList.remove('show');
        showToast(opt.name === 'Salin Link' ? 'Link disalin ke clipboard' : `Membuka ${opt.name}...`);
      });
      grid.appendChild(item);
    });
    modal.classList.add('show');
  }

  // Search & Top Bar
  document.getElementById('searchBtn').addEventListener('click', () => {
    document.getElementById('searchModal').classList.add('show');
  });
  document.getElementById('executeSearch').addEventListener('click', () => {
    const query = document.getElementById('searchInput').value;
    document.getElementById('searchModal').classList.remove('show');
    showToast(query ? `Hasil pencarian: "${query}"` : 'Menampilkan semua video');
  });

  document.getElementById('liveBtn').addEventListener('click', () => {
    showToast('Menghubungkan ke siaran LIVE...');
  });

  document.querySelectorAll('.top-bar .tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.top-bar .tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      showToast(`Beralih ke tab ${tab.textContent}`);
    });
  });

  document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.bottom-nav .nav-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      const navName = item.dataset.nav;
      if (navName) showToast(`Menu ${item.textContent.trim()} dipilih`);

  // Modals Close handlers
  document.querySelectorAll('.modal-close').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById(btn.dataset.close).classList.remove('show');
    });
  });
  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.classList.remove('show');
    });
  });

  // Mute Indicator
  let muted = true;
  document.getElementById('muteIndicator').addEventListener('click', () => {
    muted = !muted;
    document.getElementById('muteIcon').textContent = muted ? '🔇' : '🔊';
    document.getElementById('muteText').textContent = muted ? 'Ketik untuk bunyi' : 'Suara aktif';
    showToast(muted ? 'Audio dimatikan' : 'Audio diaktifkan');
  });

  // ============ CAMERA & UPLOAD STUDIO FUNCTIONALITY ============
  const cameraModal = document.getElementById('cameraModal');
  const cameraVideo = document.getElementById('cameraVideo');
  const openCameraModalBtn = document.getElementById('openCameraModal');
  const closeCameraBtn = document.getElementById('closeCamera');
  const switchCameraBtn = document.getElementById('switchCameraBtn');
  const recordShutter = document.getElementById('recordShutter');
  const recordingTimer = document.getElementById('recordingTimer');
  const uploadGalleryBtn = document.getElementById('uploadGalleryBtn');
  const galleryInput = document.getElementById('galleryInput');

  let mediaStream = null;
  let mediaRecorder = null;
  let recordedChunks = [];
  let isRecording = false;
  let useFrontCamera = true;
  let timerInterval = null;

  async function startCamera(front = true) {
    if (mediaStream) {
      mediaStream.getTracks().forEach(track => track.stop());
    }
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: front ? 'user' : 'environment' },
        audio: true
      });
      cameraVideo.srcObject = mediaStream;
    } catch (err) {
      showToast('Gagal mengakses kamera/mikrofon');
      console.error(err);
    }
  }

  openCameraModalBtn.addEventListener('click', async () => {
    cameraModal.classList.add('show');
    await startCamera(useFrontCamera);
  });

  closeCameraBtn.addEventListener('click', () => {
    stopCameraStream();
    cameraModal.classList.remove('show');
  });

  function stopCameraStream() {
    if (mediaStream) {
      mediaStream.getTracks().forEach(track => track.stop());
      mediaStream = null;
    }
    if (isRecording) {
      stopRecording();
    }
  }

  switchCameraBtn.addEventListener('click', async () => {
    useFrontCamera = !useFrontCamera;
    await startCamera(useFrontCamera);
    showToast(useFrontCamera ? 'Kamera Depan Aktif' : 'Kamera Belakang Aktif');
  });

  // Record Video Functionality
  recordShutter.addEventListener('click', () => {
    if (!isRecording) {
      startRecording();
    } else {
      stopRecording();
    }
  });

  function startRecording() {
    recordedChunks = [];
    try {
      mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/webm' });
    } catch (e) {
      try {
        mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/mp4' });
      } catch (err) {
        mediaRecorder = new MediaRecorder(mediaStream);
      }
    }

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const videoUrl = URL.createObjectURL(blob);
      addNewVideoToFeed(videoUrl, 'Video Rekaman Kamera');
    };

    mediaRecorder.start();
    isRecording = true;
    recordShutter.classList.add('recording');
    recordingTimer.style.display = 'block';
    
    let seconds = 0;
    timerInterval = setInterval(() => {
      seconds++;
      let m = String(Math.floor(seconds / 60)).padStart(2, '0');
      let s = String(seconds % 60).padStart(2, '0');
      recordingTimer.textContent = `● ${m}:${s}`;
    }, 1000);

    showToast('Perekaman dimulai...');
  }

  function stopRecording() {
    if (mediaRecorder && isRecording) {
      mediaRecorder.stop();
      isRecording = false;
      recordShutter.classList.remove('recording');
      recordingTimer.style.display = 'none';
      clearInterval(timerInterval);
      cameraModal.classList.remove('show');
      stopCameraStream();
      showToast('Video berhasil direkam & diunggah!');
    }
  }

  // Upload from Gallery Functionality
  uploadGalleryBtn.addEventListener('click', () => {
    galleryInput.click();
  });

  galleryInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const videoUrl = URL.createObjectURL(file);
      addNewVideoToFeed(videoUrl, file.name);
      cameraModal.classList.remove('show');
      stopCameraStream();
      showToast('Video dari galeri berhasil diunggah!');
    }
  });

  function addNewVideoToFeed(videoUrl, captionTitle) {
    const newVideoItem = {
      id: videos.length + 1,
      user: 'saya_kreator',
      displayName: 'Anda',
      avatar: '😎',
      avatarBg: 'linear-gradient(135deg, #25f4ee, #fe2c55)',
      caption: `Unggahan baru: ${captionTitle} 🚀`,
      hashtags: ['fyp', 'indonesia', 'kreator'],
      music: '♪ Original Sound - Saya',
      likes: 1,
      comments: 0,
      shares: 0,
      bookmarks: 0,
      isCustomVideo: true,
      videoUrl: videoUrl
    };
    videos.unshift(newVideoItem);
    state.unshift({
      liked: false,
      bookmarked: false,
      followed: true,
      likes: 1,
      bookmarks: 0,
      comments: []
    });
    renderFeed(videos);
    initAnimations();
  }

  // Intersection Observer to control autoplay canvas/video loops
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const idx = parseInt(entry.target.dataset.idx);
      const anim = animations[idx];
      const vidEl = entry.target.querySelector('video');
      
      if (entry.isIntersecting && entry.intersectionRatio > 0.7) {
        if (anim) anim.resume();
        if (vidEl) vidEl.play().catch(e => {});
      } else {
        if (anim) anim.pause();
        if (vidEl) vidEl.pause();
      }
    });
  }, { threshold: [0, 0.7, 1] });

  function observeSlides() {
    document.querySelectorAll('.video-slide').forEach(slide => observer.observe(slide));
  }
  observeSlides();
</script>
</body>
