<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>TikVid - Video Pendek</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/plus-jakarta-sans@5.0.3/index.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #000;
    color: #fff;
    user-select: none;
  }
  #app {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 480px;
    margin: 0 auto;
    background: #000;
    overflow: hidden;
  }
  /* Top Bar */
  .top-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 50;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
  }
  .top-bar .live-btn {
    font-size: 14px; font-weight: 600;
    opacity: 0.85;
  }
  .top-bar .tabs {
    display: flex;
    gap: 20px;
    font-size: 16px;
    font-weight: 600;
  }
  .top-bar .tab { opacity: 0.6; cursor: pointer; position: relative; padding: 4px 2px; }
  .top-bar .tab.active { opacity: 1; }
  .top-bar .tab.active::after {
    content: '';
    position: absolute;
    bottom: -4px; left: 50%;
    transform: translateX(-50%);
    width: 18px; height: 3px;
    background: #fff;
    border-radius: 2px;
  }
  .top-bar .search-btn {
    font-size: 22px;
    cursor: pointer;
  }
  /* Feed */
  .feed {
    width: 100%;
    height: 100%;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
  }
  .feed::-webkit-scrollbar { display: none; }
  .video-slide {
    position: relative;
    width: 100%;
    height: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    overflow: hidden;
    background: #000;
  }
  .video-slide canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  /* Play/Pause indicator */
  .play-indicator {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 80px;
    opacity: 0;
    pointer-events: none;
    transition: transform 0.25s ease, opacity 0.25s ease;
    z-index: 20;
    text-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .play-indicator.show {
    transform: translate(-50%, -50%) scale(1);
    opacity: 0.9;
  }
  /* Double tap heart */
  .double-tap-heart {
    position: absolute;
    font-size: 100px;
    color: #ff2d55;
    pointer-events: none;
    z-index: 25;
    animation: heartPop 1s ease-out forwards;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
  }
  @keyframes heartPop {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-15deg); opacity: 0; }
    20% { transform: translate(-50%, -50%) scale(1.3) rotate(10deg); opacity: 1; }
    40% { transform: translate(-50%, -50%) scale(1) rotate(-5deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.1) rotate(0); opacity: 0; }
  }
  /* Sidebar */
  .sidebar {
    position: absolute;
    right: 10px;
    bottom: 110px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    z-index: 10;
  }
  .sidebar .avatar-wrap {
    position: relative;
    margin-bottom: 8px;
  }
  .sidebar .avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 2px solid #fff;
    background: linear-gradient(135deg, #ff2d55, #ff9500);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 18px;
    overflow: hidden;
  }
  .sidebar .follow-btn {
    position: absolute;
    bottom: -10px; left: 50%;
    transform: translateX(-50%);
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #ff2d55;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: 2px solid #000;
    transition: transform 0.2s;
  }
  .sidebar .follow-btn.followed {
    background: #2ecc71;
    transform: translateX(-50%) scale(0.9);
  }
  .sidebar .action {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }
  .sidebar .action .icon {
    width: 44px; height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    transition: transform 0.15s;
  }
  .sidebar .action:active .icon { transform: scale(0.85); }
  .sidebar .action .count {
    font-size: 12px;
    font-weight: 600;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
  .sidebar .like-btn.liked .icon { color: #ff2d55; }
  .sidebar .like-btn.liked .icon svg { fill: #ff2d55; }
  .sidebar .bookmark-btn.bookmarked .icon svg { fill: #ffd700; }
  /* Bottom Info */
  .bottom-info {
    position: absolute;
    left: 12px;
    right: 80px;
    bottom: 80px;
    z-index: 10;
    background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
    padding: 30px 0 10px;
    margin: 0 -12px;
    padding-left: 12px;
    padding-right: 12px;
  }
  .bottom-info .username {
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 6px;
  }
  .bottom-info .caption {
    font-size: 14px;
    line-height: 1.4;
    margin-bottom: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .bottom-info .caption .hashtag { font-weight: 600; }
  .bottom-info .music {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    overflow: hidden;
  }
  .bottom-info .music .marquee {
    overflow: hidden;
    white-space: nowrap;
    flex: 1;
    mask-image: linear-gradient(to right, transparent, #000 10%, #000 90%, transparent);
  }
  .bottom-info .music .marquee span {
    display: inline-block;
    padding-right: 40px;
    animation: marquee 12s linear infinite;
  }
  @keyframes marquee {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  /* Progress bar */
  .progress-bar {
    position: absolute;
    bottom: 60px;
    left: 0; right: 0;
    height: 2px;
    background: rgba(255,255,255,0.2);
    z-index: 15;
  }
  .progress-bar .progress {
    height: 100%;
    background: #fff;
    width: 0%;
    transition: width 0.1s linear;
  }
  /* Bottom Nav */
  .bottom-nav {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 60px;
    background: #000;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 40;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .bottom-nav .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 10px;
    color: #fff;
    opacity: 0.6;
    cursor: pointer;
    padding: 6px 0;
    transition: opacity 0.2s;
  }
  .bottom-nav .nav-item.active { opacity: 1; }
  .bottom-nav .nav-item .nav-icon {
    font-size: 22px;
    line-height: 1;
  }
  .bottom-nav .upload-btn {
    width: 44px; height: 30px;
    background: linear-gradient(90deg, #25f4ee, #fff, #fe2c55);
    border-radius: 8px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bottom-nav .upload-btn::before {
    content: '+';
    position: absolute;
    inset: 0;
    background: #000;
    border-radius: 6px;
    margin: 2px 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 22px;
    font-weight: 300;
  }
  /* Modal */
  .modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    display: none;
    align-items: flex-end;
    animation: fadeIn 0.25s ease;
  }
  .modal-overlay.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    width: 100%;
    max-height: 70%;
    background: #1c1c1e;
    border-radius: 16px 16px 0 0;
    padding: 16px;
    animation: slideUp 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
    display: flex;
    flex-direction: column;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-header {
    text-align: center;
    font-weight: 700;
    font-size: 15px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    position: relative;
  }
  .modal-close {
    position: absolute;
    right: 0; top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    cursor: pointer;
    padding: 4px 8px;
  }
  /* Comments */
  .comments-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 0;
    max-height: 400px;
  }
  .comment-item {
    display: flex;
    gap: 10px;
    padding: 10px 0;
  }
  .comment-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
  }
  .comment-body { flex: 1; }
  .comment-user {
    font-size: 13px;
    opacity: 0.6;
    margin-bottom: 2px;
  }
  .comment-text {
    font-size: 14px;
    line-height: 1.4;
  }
  .comment-meta {
    font-size: 12px;
    opacity: 0.5;
    margin-top: 4px;
    display: flex;
    gap: 14px;
  }
  .comment-input-wrap {
    display: flex;
    gap: 10px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .comment-input {
    flex: 1;
    background: #2c2c2e;
    border: none;
    border-radius: 20px;
    padding: 10px 16px;
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  .comment-send {
    background: #fe2c55;
    border: none;
    color: #fff;
    padding: 0 18px;
    border-radius: 20px;
    font-weight: 600;
    cursor: pointer;
  }
  /* Share */
  .share-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    padding: 16px 0;
  }
  .share-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .share-icon {
    width: 50px; height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }
  /* Toast */
  .toast {
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(0,0,0,0.85);
    color: #fff;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    z-index: 200;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  /* Mute indicator */
  .mute-indicator {
    position: absolute;
    top: 60px;
    right: 16px;
    background: rgba(0,0,0,0.5);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 30;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="app">
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="live-btn">📺 LIVE</div>
    <div class="tabs">
      <div class="tab" data-tab="following">Mengikuti</div>
      <div class="tab active" data-tab="foryou">Untuk Kamu</div>
    </div>
    <div class="search-btn">🔍</div>
  </div>

  <!-- Mute indicator -->
  <div class="mute-indicator" id="muteIndicator">
    <span id="muteIcon">🔇</span>
    <span id="muteText">Ketik untuk bunyi</span>
  </div>

  <!-- Feed -->
  <div class="feed" id="feed"></div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <div class="nav-item active">
      <div class="nav-icon">🏠</div>
      <div>Beranda</div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">🧭</div>
      <div>Jelajahi</div>
    </div>
    <div class="nav-item">
      <div class="upload-btn"></div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">📥</div>
      <div>Kotak Masuk</div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">👤</div>
      <div>Profil</div>
    </div>
  </div>

  <!-- Comments Modal -->
  <div class="modal-overlay" id="commentsModal">
    <div class="modal">
      <div class="modal-header">
        <span id="commentsCount">0 Komentar</span>
        <div class="modal-close" data-close="commentsModal">✕</div>
      </div>
      <div class="comments-list" id="commentsList"></div>
      <div class="comment-input-wrap">
        <input type="text" class="comment-input" id="commentInput" placeholder="Tambah komentar..." />
        <button class="comment-send" id="commentSend">Kirim</button>
      </div>
    </div>
  </div>

  <!-- Share Modal -->
  <div class="modal-overlay" id="shareModal">
    <div class="modal">
      <div class="modal-header">
        Bagikan ke
        <div class="modal-close" data-close="shareModal">✕</div>
      </div>
      <div class="share-grid" id="shareGrid"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>
</div>

<script>
  // ============ DATA ============
  const videos = [
    {
      id: 1,
      user: 'sunset_lover',
      displayName: 'Pecinta Senja',
      avatar: '🌅',
      avatarBg: 'linear-gradient(135deg, #ff9966, #ff5e62)',

      hashtags: ['senja', 'sunset', 'indonesia', 'fyp'],
      music: '♪ Lofi Sunset Vibes - ChillBeats',
      likes: 128400,
      comments: 2341,

      bookmarks: 4521,
      theme: 'sunset'
    },
    {
      id: 2,
      user: 'ocean_dreamer',
      displayName: 'Pemimpi Laut',
      avatar: '🌊',
      avatarBg: 'linear-gradient(135deg, #2193b0, #6dd5ed)',
      caption: 'Gelombang laut menenangkan pikiran 🌊✨',
      hashtags: ['ocean', 'waves', 'calm', 'nature'],
      music: '♪ Ocean Waves - Nature Sounds',
      likes: 89200,
      comments: 1203,
      shares: 456,
      bookmarks: 2310,
      theme: 'ocean'
    },
    {
      id: 3,
      user: 'aurora_north',
      displayName: 'Cahaya Utara',
      avatar: '✨',
      avatarBg: 'linear-gradient(135deg, #00c9ff, #92fe9d)',
      caption: 'Aurora borealis di malam ini 💚💙 Masya Allah indahnya',
      hashtags: ['aurora', 'northernlights', 'sky', 'magic'],
      music: '♪ Northern Lights - Ambient',
      likes: 456700,
      comments: 8921,
      shares: 3421,
      bookmarks: 12300,
      theme: 'aurora'
    },
    {
      id: 4,
      user: 'city_nights',
      displayName: 'Malam Kota',
      avatar: '🌃',
      avatarBg: 'linear-gradient(135deg, #ff0099, #493240)',
      caption: 'Kota tidak pernah tidur 🌃 Lampu-lampu kota yang indah',
      hashtags: ['city', 'night', 'urban', 'lights'],
      music: '♪ City Lights - Synthwave',
      likes: 67800,
      comments: 892,
      shares: 234,
      bookmarks: 1890,
      theme: 'city'
    },
    {
      id: 5,
      user: 'forest_magic',
      displayName: 'Hutan Ajaib',
      avatar: '🌲',
      avatarBg: 'linear-gradient(135deg, #134e5e, #71b280)',
      caption: 'Kunang-kunang di hutan malam 🌲✨ Keajaiban alam',
      hashtags: ['forest', 'fireflies', 'nature', 'magical'],
      music: '♪ Forest Night - Nature',
      likes: 234500,
      comments: 4521,
      shares: 1234,
      bookmarks: 8900,
      theme: 'forest'
    },
    {
      id: 6,
      user: 'space_explorer',
      displayName: 'Penjelajah Angkasa',
      avatar: '🚀',
      avatarBg: 'linear-gradient(135deg, #0f0c29, #302b63, #24243e)',
      caption: 'Menjelajah galaksi yang tak terhingga 🌌✨ #SpaceLovers',
      hashtags: ['space', 'galaxy', 'stars', 'universe'],
      music: '♪ Cosmic Journey - Electronic',
      likes: 789200,
      comments: 12340,
      shares: 5670,
      bookmarks: 23400,
      theme: 'space'
    }
  ];

  const sampleComments = [
    { user: 'dina_k', text: 'Keren banget kak! 🔥', time: '2j', likes: 234 },
    { user: 'rizky.m', text: 'Indahnya ya Allah 😍', time: '3j', likes: 567 },
    { user: 'sari_99', text: 'Ini dimana kak? Pengen kesana', time: '5j', likes: 89 },
    { user: 'budi_art', text: 'Editannya mantap 👏', time: '6j', likes: 145 },
    { user: 'maya.p', text: 'Vibesnya enak banget', time: '8j', likes: 78 },
    { user: 'andi_x', text: 'FYP memang tidak pernah bohong', time: '12j', likes: 321 }
  ];

  const shareOptions = [
    { name: 'WhatsApp', icon: '💬', bg: '#25D366' },
    { name: 'Instagram', icon: '📷', bg: 'linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888)' },
    { name: 'Facebook', icon: '📘', bg: '#1877F2' },
    { name: 'Twitter', icon: '🐦', bg: '#1DA1F2' },
    { name: 'Telegram', icon: '✈️', bg: '#0088cc' },
    { name: 'Salin Link', icon: '🔗', bg: '#555' },
    { name: 'Email', icon: '📧', bg: '#EA4335' },
    { name: 'Lainnya', icon: '•••', bg: '#333' }
  ];

  // ============ UTILS ============
  function formatCount(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
    return n.toString();
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  // ============ BUILD FEED ============
  const feed = document.getElementById('feed');
  videos.forEach((v, idx) => {
    const slide = document.createElement('div');
    slide.className = 'video-slide';
    slide.dataset.idx = idx;
    slide.innerHTML = `
      <canvas></canvas>
      <div class="play-indicator" id="playInd-${idx}">▶</div>
      <div class="sidebar">
        <div class="avatar-wrap">
          <div class="avatar" style="background:${v.avatarBg}">${v.avatar}</div>
          <div class="follow-btn" data-follow="${idx}">+</div>
        </div>
        <div class="action like-btn" data-like="${idx}">
          <div class="icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="white">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
          </div>
          <div class="count" id="likeCount-${idx}">${formatCount(v.likes)}</div>
        </div>
        <div class="action comment-btn" data-comment="${idx}">
          <div class="icon">💬</div>
          <div class="count">${formatCount(v.comments)}</div>
        </div>
        <div class="action bookmark-btn" data-bookmark="${idx}">
          <div class="icon">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="white">
              <path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/>
            </svg>
          </div>
          <div class="count" id="bookmarkCount-${idx}">${formatCount(v.bookmarks)}</div>
        </div>
        <div class="action share-btn" data-share="${idx}">
          <div class="icon">↗</div>
          <div class="count">${formatCount(v.shares)}</div>
        </div>
        <div class="action" style="margin-top: 4px;">
          <div class="icon" style="width:40px;height:40px;border-radius:50%;background:${v.avatarBg};font-size:20px;animation:spin 4s linear infinite;">${v.avatar}</div>
        </div>
      </div>
      <div class="bottom-info">
        <div class="username">@${v.user}</div>
        <div class="caption">${v.caption} ${v.hashtags.map(h => `<span class="hashtag">#${h}</span>`).join(' ')}</div>
        <div class="music">
          <span>🎵</span>
          <div class="marquee"><span>${v.music} &nbsp;&nbsp;&nbsp; ${v.music} &nbsp;&nbsp;&nbsp; </span></div>
        </div>
      </div>
      <div class="progress-bar"><div class="progress" id="progress-${idx}"></div></div>
    `;
    feed.appendChild(slide);
  });

  // Add spin animation
  const styleEl = document.createElement('style');
  styleEl.textContent = `@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }`;
  document.head.appendChild(styleEl);

  // ============ CANVAS ANIMATIONS ============
  const canvases = document.querySelectorAll('.video-slide canvas');
  const animations = [];

  function createAnimation(canvas, theme, idx) {
    const ctx = canvas.getContext('2d');
    let w, h;
    let particles = [];
    let t = 0;
    let paused = false;
    let startTime = performance.now();
    const duration = 15000; // 15s loop

    function resize() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      w = rect.width;
      h = rect.height;
    }
    resize();
    window.addEventListener('resize', resize);

    // Init particles based on theme
    if (theme === 'sunset') {
      for (let i = 0; i < 60; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 2 + 0.5,
          vy: -Math.random() * 0.5 - 0.2,
          vx: (Math.random() - 0.5) * 0.3,
          a: Math.random() * 0.8 + 0.2
        });
      }
    } else if (theme === 'ocean') {
      for (let i = 0; i < 40; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 3 + 1,
          vy: Math.random() * 0.3 + 0.1,
          vx: (Math.random() - 0.5) * 0.5,
          a: Math.random() * 0.5 + 0.3
        });
      }
    } else if (theme === 'aurora') {
      for (let i = 0; i < 80; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h * 0.7,
          r: Math.random() * 1.5 + 0.3,
          vx: (Math.random() - 0.5) * 0.5,
          vy: (Math.random() - 0.5) * 0.3,
          a: Math.random() * 0.8 + 0.2,
          hue: Math.random() * 120 + 120
        });
      }
    } else if (theme === 'city') {
      for (let i = 0; i < 100; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.5 + 0.3,
          a: Math.random(),
          flicker: Math.random() * 0.05,
          color: ['#ff0099', '#ffcc00', '#00ffff', '#ff6600', '#ffffff'][Math.floor(Math.random() * 5)]
        });
      }
    } else if (theme === 'forest') {
      for (let i = 0; i < 50; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 2 + 1,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          a: Math.random(),
          phase: Math.random() * Math.PI * 2
        });
      }
    } else if (theme === 'space') {
      for (let i = 0; i < 200; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.8 + 0.2,
          a: Math.random(),
          twinkle: Math.random() * 0.05 + 0.01,
          color: Math.random() > 0.7 ? '#aaddff' : '#ffffff'
        });
      }
    }

    function draw() {
      if (paused) {
        animations[idx].raf = requestAnimationFrame(draw);
        return;
      }
      t += 0.016;
      const progress = ((performance.now() - startTime) % duration) / duration;
      const progressBar = document.getElementById(`progress-${idx}`);
      if (progressBar) progressBar.style.width = (progress * 100) + '%';

      if (theme === 'sunset') {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#2c1810');
        grad.addColorStop(0.3, '#ff6b35');
        grad.addColorStop(0.6, '#f7931e');
        grad.addColorStop(0.8, '#ffcc70');
        grad.addColorStop(1, '#4a2c2a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        // Sun
        const sunY = h * 0.55 + Math.sin(t * 0.3) * 10;
        const sunGrad = ctx.createRadialGradient(w/2, sunY, 0, w/2, sunY, 120);
        sunGrad.addColorStop(0, 'rgba(255, 240, 180, 1)');
        sunGrad.addColorStop(0.3, 'rgba(255, 180, 100, 0.8)');
        sunGrad.addColorStop(1, 'rgba(255, 100, 50, 0)');
        ctx.fillStyle = sunGrad;
        ctx.fillRect(0, 0, w, h);
        // Sun disk
        ctx.beginPath();
        ctx.arc(w/2, sunY, 50, 0, Math.PI * 2);
        ctx.fillStyle = '#fff4d6';
        ctx.fill();
        // Horizon line / water
        ctx.fillStyle = 'rgba(30, 20, 40, 0.6)';
        ctx.fillRect(0, h * 0.7, w, h * 0.3);
        // Particles (dust)
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          if (p.y < 0) { p.y = h; p.x = Math.random() * w; }
          if (p.x < 0) p.x = w;
          if (p.x > w) p.x = 0;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 220, 150, ${p.a * 0.6})`;
          ctx.fill();
        });
      } else if (theme === 'ocean') {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#0a2540');
        grad.addColorStop(0.5, '#1e5799');
        grad.addColorStop(1, '#2989d8');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        // Waves
        for (let layer = 0; layer < 5; layer++) {
          ctx.beginPath();
          const yBase = h * 0.4 + layer * 40;
          ctx.moveTo(0, yBase);
          for (let x = 0; x <= w; x += 10) {
            const y = yBase + Math.sin((x * 0.02) + t * (1 + layer * 0.3) + layer) * (15 - layer * 2);
            ctx.lineTo(x, y);
          }
          ctx.lineTo(w, h);
          ctx.lineTo(0, h);
          ctx.closePath();
          ctx.fillStyle = `rgba(${100 + layer * 20}, ${180 + layer * 10}, 230, ${0.3 + layer * 0.1})`;
          ctx.fill();
        }
        // Bubbles
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          if (p.y > h) { p.y = 0; p.x = Math.random() * w; }
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${p.a * 0.5})`;
          ctx.fill();
        });
      } else if (theme === 'aurora') {
        ctx.fillStyle = '#050520';
        ctx.fillRect(0, 0, w, h);
        // Aurora bands
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.moveTo(0, h * 0.3 + i * 30);
          for (let x = 0; x <= w; x += 20) {
            const y = h * 0.3 + i * 30 + Math.sin(x * 0.01 + t * 0.5 + i) * 40 + Math.cos(x * 0.02 + t * 0.3) * 20;
            ctx.lineTo(x, y);
          }
          ctx.lineTo(w, 0);
          ctx.lineTo(0, 0);
          ctx.closePath();
          const grad = ctx.createLinearGradient(0, 0, 0, h);
          grad.addColorStop(0, `rgba(0, 255, 150, ${0.1 - i * 0.02})`);
          grad.addColorStop(0.5, `rgba(100, 200, 255, ${0.15 - i * 0.02})`);
          grad.addColorStop(1, 'rgba(0, 0, 50, 0)');
          ctx.fillStyle = grad;
          ctx.fill();
        }
        // Stars
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = w;
          if (p.x > w) p.x = 0;
          if (p.y < 0) p.y = h * 0.7;
          if (p.y > h * 0.7) p.y = 0;
          const flicker = 0.5 + Math.sin(t * 3 + p.x) * 0.5;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${p.hue}, 100%, 70%, ${p.a * flicker})`;
          ctx.fill();
        });
        // Ground silhouette
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.moveTo(0, h);
        ctx.lineTo(0, h * 0.85);
        for (let x = 0; x <= w; x += 20) {
          ctx.lineTo(x, h * 0.85 + Math.sin(x * 0.05) * 10);
        }
        ctx.lineTo(w, h);
        ctx.closePath();
        ctx.fill();
      } else if (theme === 'city') {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#1a0033');
        grad.addColorStop(0.5, '#4a0e4e');
        grad.addColorStop(1, '#0f0524');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        // Buildings silhouette
        ctx.fillStyle = '#000';
        const buildings = [
          {x: 0, w: 60, h: 200}, {x: 60, w: 40, h: 280},
          {x: 100, w: 70, h: 240}, {x: 170, w: 50, h: 320},
          {x: 220, w: 80, h: 260}, {x: 300, w: 60, h: 300},
          {x: 360, w: 70, h: 220}, {x: 430, w: 50, h: 280}
        ];
        buildings.forEach(b => {
          const scale = w / 480;
          ctx.fillRect(b.x * scale, h - b.h, b.w * scale, b.h);
        });
        // Windows
        buildings.forEach(b => {
          const scale = w / 480;
          for (let wy = h - b.h + 10; wy < h - 10; wy += 15) {
            for (let wx = b.x * scale + 5; wx < (b.x + b.w) * scale - 5; wx += 10) {
              if (Math.random() > 0.3) {
                const flicker = Math.sin(t * 3 + wx + wy) > 0 ? 1 : 0.3;
                ctx.fillStyle = `rgba(255, 220, 100, ${flicker * 0.8})`;
                ctx.fillRect(wx, wy, 4, 6);
              }
            }
          }
        });
        // Neon lights
        particles.forEach(p => {
          const flicker = 0.5 + Math.sin(t * 5 + p.x) * 0.5;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * 2, 0, Math.PI * 2);
          ctx.fillStyle = p.color.replace(')', `, ${p.a * flicker})`).replace('rgb', 'rgba');
          if (!p.color.startsWith('rgba')) {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.a * flicker;
          }
          ctx.fill();
          ctx.globalAlpha = 1;
        });
      } else if (theme === 'forest') {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#0a1f0a');
        grad.addColorStop(0.5, '#1a3a1a');
        grad.addColorStop(1, '#0a1a0a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        // Trees silhouettes
        ctx.fillStyle = '#000';
        for (let i = 0; i < 8; i++) {
          const tx = (i * w / 8) + Math.sin(i) * 20;
          const th = 200 + Math.sin(i * 2) * 80;
          ctx.beginPath();
          ctx.moveTo(tx, h);
          ctx.lineTo(tx - 30, h - th);
          ctx.lineTo(tx + 30, h - th);
          ctx.closePath();
          ctx.fill();
        }
        // Fireflies
        particles.forEach(p => {
          p.x += p.vx + Math.sin(t + p.phase) * 0.3;
          p.y += p.vy + Math.cos(t + p.phase) * 0.3;
          if (p.x < 0) p.x = w;
          if (p.x > w) p.x = 0;
          if (p.y < 0) p.y = h;
          if (p.y > h) p.y = 0;
          const glow = 0.5 + Math.sin(t * 2 + p.phase) * 0.5;
          // Glow
          const glowGrad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 6);
          glowGrad.addColorStop(0, `rgba(255, 255, 150, ${p.a * glow * 0.6})`);
          glowGrad.addColorStop(1, 'rgba(255, 255, 150, 0)');
          ctx.fillStyle = glowGrad;
          ctx.fillRect(p.x - p.r * 6, p.y - p.r * 6, p.r * 12, p.r * 12);
          // Core
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 200, ${p.a * glow})`;
          ctx.fill();
        });
      } else if (theme === 'space') {
        ctx.fillStyle = '#000010';
        ctx.fillRect(0, 0, w, h);
        // Nebula
        const nebGrad = ctx.createRadialGradient(w * 0.3, h * 0.4, 0, w * 0.3, h * 0.4, w * 0.6);
        nebGrad.addColorStop(0, 'rgba(150, 50, 200, 0.3)');
        nebGrad.addColorStop(0.5, 'rgba(50, 100, 200, 0.15)');
        nebGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = nebGrad;
        ctx.fillRect(0, 0, w, h);
        const nebGrad2 = ctx.createRadialGradient(w * 0.7, h * 0.6, 0, w * 0.7, h * 0.6, w * 0.5);
        nebGrad2.addColorStop(0, 'rgba(200, 100, 150, 0.25)');
        nebGrad2.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = nebGrad2;
        ctx.fillRect(0, 0, w, h);
        // Stars
        particles.forEach(p => {
          const twinkle = 0.5 + Math.sin(t * p.twinkle * 60 + p.x) * 0.5;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.a * twinkle;
          ctx.fill();
          ctx.globalAlpha = 1;
        });
        // Shooting star occasionally
        if (Math.sin(t * 0.5) > 0.98) {
          const sx = (t * 100) % w;
          const sy = (t * 50) % (h * 0.5);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(sx, sy);
          ctx.lineTo(sx - 40, sy - 20);
          ctx.stroke();
        }
      }

      animations[idx].raf = requestAnimationFrame(draw);
    }
    draw();

    return {
      pause: () => { paused = true; },
      resume: () => { paused = false; },
      isPaused: () => paused,
      raf: null
    };
  }

  canvases.forEach((canvas, idx) => {
    animations[idx] = createAnimation(canvas, videos[idx].theme, idx);
  });

  // ============ INTERACTIONS ============
  // Track state
  const state = videos.map(v => ({
    liked: false,
    bookmarked: false,
    followed: false,
    likes: v.likes,
    bookmarks: v.bookmarks,
    comments: [...sampleComments]
  }));

  // Play/Pause on tap
  let lastTap = 0;
  let tapTimeout = null;
  document.querySelectorAll('.video-slide').forEach(slide => {
    slide.addEventListener('click', (e) => {
      // Ignore if clicked on interactive elements
      if (e.target.closest('.sidebar') || e.target.closest('.bottom-info') || e.target.closest('.top-bar')) return;
      const idx = parseInt(slide.dataset.idx);
      const now = Date.now();
      if (now - lastTap < 300) {
        // Double tap - like
        clearTimeout(tapTimeout);
        const rect = slide.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const heart = document.createElement('div');
        heart.className = 'double-tap-heart';
        heart.textContent = '❤';
        heart.style.left = x + 'px';
        heart.style.top = y + 'px';
        slide.appendChild(heart);
        setTimeout(() => heart.remove(), 1000);
        if (!state[idx].liked) {
          toggleLike(idx);
        }
      } else {
        tapTimeout = setTimeout(() => {
          // Single tap - pause/play
          const anim = animations[idx];
          const indicator = document.getElementById(`playInd-${idx}`);
          if (anim.isPaused()) {
            anim.resume();
            indicator.textContent = '▶';
          } else {
            anim.pause();
            indicator.textContent = '❚❚';
          }
          indicator.classList.add('show');
          setTimeout(() => indicator.classList.remove('show'), 500);
        }, 300);
      }
      lastTap = now;
    });
  });

  // Like button
  function toggleLike(idx) {
    state[idx].liked = !state[idx].liked;
    state[idx].likes += state[idx].liked ? 1 : -1;
    const btn = document.querySelector(`[data-like="${idx}"]`);
    btn.classList.toggle('liked', state[idx].liked);
    document.getElementById(`likeCount-${idx}`).textContent = formatCount(state[idx].likes);
    if (state[idx].liked) {
      btn.querySelector('.icon').animate([
        { transform: 'scale(1)' },
        { transform: 'scale(1.4)' },
        { transform: 'scale(1)' }
      ], { duration: 300 });
    }
  }
  document.querySelectorAll('[data-like]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleLike(parseInt(btn.dataset.like));
    });
  });

  // Bookmark
  document.querySelectorAll('[data-bookmark]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.bookmark);
      state[idx].bookmarked = !state[idx].bookmarked;
      state[idx].bookmarks += state[idx].bookmarked ? 1 : -1;
      btn.classList.toggle('bookmarked', state[idx].bookmarked);
      document.getElementById(`bookmarkCount-${idx}`).textContent = formatCount(state[idx].bookmarks);
      showToast(state[idx].bookmarked ? '✓ Disimpan ke favorit' : 'Dihapus dari favorit');
    });
  });

  // Follow
  document.querySelectorAll('[data-follow]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.follow);
      state[idx].followed = !state[idx].followed;
      btn.classList.toggle('followed', state[idx].followed);
      btn.textContent = state[idx].followed ? '✓' : '+';
      showToast(state[idx].followed ? `Mengikuti @${videos[idx].user}` : 'Berhenti mengikuti');
    });
  });

  // Comments
  document.querySelectorAll('[data-comment]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.comment);
      openComments(idx);
    });
  });

  function openComments(idx) {
    const modal = document.getElementById('commentsModal');
    const list = document.getElementById('commentsList');
    document.getElementById('commentsCount').textContent = `${formatCount(state[idx].comments.length)} Komentar`;
    list.innerHTML = '';
    state[idx].comments.forEach(c => {
      const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#a8e6cf', '#ff8b94', '#95e1d3'];
      const color = colors[Math.floor(Math.random() * colors.length)];
      const item = document.createElement('div');
      item.className = 'comment-item';
      item.innerHTML = `
        <div class="comment-avatar" style="background:${color}">${c.user[0].toUpperCase()}</div>
        <div class="comment-body">
          <div class="comment-user">@${c.user}</div>
          <div class="comment-text">${c.text}</div>
          <div class="comment-meta">
            <span>${c.time}</span>
            <span>♡ ${c.likes}</span>
            <span>Balas</span>
          </div>
        </div>
      `;
      list.appendChild(item);
    });
    modal.classList.add('show');
    modal.dataset.idx = idx;
  }

  // Send comment
  document.getElementById('commentSend').addEventListener('click', () => {
    const input = document.getElementById('commentInput');
    const text = input.value.trim();
    if (!text) return;
    const idx = parseInt(document.getElementById('commentsModal').dataset.idx);
    state[idx].comments.unshift({
      user: 'saya',
      text: text,
      time: 'baru saja',
      likes: 0
    });
    input.value = '';
    openComments(idx);
    showToast('Komentar terkirim');
  });

  document.getElementById('commentInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') document.getElementById('commentSend').click();
  });

  // Share
  document.querySelectorAll('[data-share]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      openShare(parseInt(btn.dataset.share));
    });
  });

  function openShare(idx) {
    const modal = document.getElementById('shareModal');
    const grid = document.getElementById('shareGrid');
    grid.innerHTML = '';
    shareOptions.forEach(opt => {
      const item = document.createElement('div');
      item.className = 'share-item';
      item.innerHTML = `
        <div class="share-icon" style="background:${opt.bg}">${opt.icon}</div>
        <div>${opt.name}</div>
      `;
      item.addEventListener('click', () => {
        modal.classList.remove('show');
        if (opt.name === 'Salin Link') {
          showToast('Link disalin ke clipboard');
        } else {
          showToast(`Membuka ${opt.name}...`);
        }
      });
      grid.appendChild(item);
    });
    modal.classList.add('show');
  }

  // Close modals
  document.querySelectorAll('.modal-close').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById(btn.dataset.close).classList.remove('show');
    });
  });
  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.classList.remove('show');
    });
  });

  // Tabs
  document.querySelectorAll('.top-bar .tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.top-bar .tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      showToast(`Beralih ke ${tab.textContent}`);
    });
  });

  // Bottom nav
  document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.bottom-nav .nav-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
    });
  });

  // Mute toggle
  let muted = true;
  document.getElementById('muteIndicator').addEventListener('click', () => {
    muted = !muted;
    document.getElementById('muteIcon').textContent = muted ? '🔇' : '🔊';
    document.getElementById('muteText').textContent = muted ? 'Ketik untuk bunyi' : 'Suara aktif';
    showToast(muted ? 'Audio dimatikan' : 'Audio diaktifkan');
  });

  // Pause videos not in view
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const idx = parseInt(entry.target.dataset.idx);
      if (entry.isIntersecting && entry.intersectionRatio > 0.7) {
        animations[idx].resume();
      } else {
        animations[idx].pause();
      }
    });
  }, { threshold: [0, 0.7, 1] });

  document.querySelectorAll('.video-slide').forEach(slide => observer.observe(slide));
</script>
</body>
</html>
